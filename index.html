function noteWordError(term) {
  L.wordErr[term] = (L.wordErr[term]||0) + 1;
  const v = DB.vocab.find(w => norm(w.term)===norm(term));
  if (v) {
    v.errors = (v.errors||0) + 1;
    v.status = 'на закреплении';
    if (v.errors >= 2) {
      if (!DB.reviewQueue.includes(v.term)) DB.reviewQueue.push(v.term);
      ensureMnemonic(v); // мнемоника — один раз по триггеру (раздел 2.3-М)
    }
  }
}
/* Мнемоника: уровень 1 (текст + эмодзи) генерируется однократно и хранится.
   Уровни 2 (схемы) и 3 (Imagen, «пробовать → откат») — направление развития
   этого прототипа; принцип деградации сохранён в архитектуре. */
async function ensureMnemonic(v) {
  if (v.mnemonic || v._mnemoPending) return;
  v._mnemoPending = true;
  try {
    const r = await Gemini.call({ task:'mnemonic', target_lang:DB.profile.targetLang, native_lang:DB.profile.nativeLang,
      term:v.term, translation:v.translation, topic:DB.profile.interests },
      '{"mnemonic":"один яркий чувственный образ-ассоциация на родном языке, 1–2 коротких предложения"}');
    if (r.mnemonic) { v.mnemonic = r.mnemonic; v.mnemo_date = today(); Storage.save(DB); }
  } catch(e){}
  delete v._mnemoPending;
}

function firstTry(stepKey, ok) {
  if (L.firstTryDone[stepKey]) return;
  L.firstTryDone[stepKey] = true;
  L.ft.total++; if (ok) L.ft.ok++;
}

/* ---------- Незавершённые занятия: хранилище эпизодов (спека 4.29) ----------
   Принцип: снимок живёт, пока занятие не завершено или пока это же занятие не начато заново.
   СРОКА ГОДНОСТИ НЕТ — заниматься можно раз в три дня, прогресс дождётся (прежняя инвалидация
   через 24 часа молча обнуляла урок и обесценивала уже сделанные задания).
   Слоты РАЗДЕЛЬНЫЕ по виду (урок / урок A0 / Суперквест) и по профилю: старт Суперквеста
   больше не стирает незавершённый урок.
   QUEUE-63: на вид у профиля ровно ОДИН эпизод, и снимок пройденного занятия не хранится. */
const Episodes = {
  _read() {
    try {
      const v = JSON.parse(localStorage.getItem(EPISODES_KEY));
      if (v && Array.isArray(v.items)) return v;
    } catch(e) {}
    return { schema: EPISODES_SCHEMA, items: [] };
  },
  _write(v) {
    try { v.schema = EPISODES_SCHEMA; localStorage.setItem(EPISODES_KEY, JSON.stringify(v)); return true; }
    catch(e) { return false; }   // переполнение хранилища — молчать нельзя, разбираем в put()
  },
  _id(kind, code, pid) { return (pid||'?') + '|' + kind + '|' + (code||'?'); },
  /* QUEUE-63: занятие с этим кодом уже пройдено? Снимок пройденного занятия — мусор:
     предлагать «продолжить» то, что закрыто, нельзя. Источник истины — DB.progress,
     куда запись о прохождении кладут finishLesson, финал Суперквеста и финал урока A0. */
  _isDone(code) {
    if (!code) return false;
    return (DB?.progress || []).some(r => String(r.code) === String(code));
  },
  /* Снять мусор у активного профиля: эпизоды уже пройденных занятий.
     Самолечение — чинит и сирот, доставшихся от старой схемы хранения (ключ с номером
     билда: завершение урока чистило только текущий ключ, снимок в прежнем оставался). */
  sweepDone() {
    const pid = Storage.activeId(), v = this._read();
    const before = v.items.length;
    v.items = v.items.filter(x => !(x.profileId === pid && this._isDone(x.code)));
    if (v.items.length !== before) this._write(v);
  },
  put(kind, code, data) {
    const pid = Storage.activeId(), id = this._id(kind, code, pid);
    const v = this._read();
    const rec = { id, profileId: pid, kind, code, savedAt: Date.now(), build: APP_VERSION, data };
    // QUEUE-63: один эпизод на вид у профиля — прочие эпизоды ЭТОГО ЖЕ вида уходят.
    // Чужие профили и другие виды (урок / a0 / super) не трогаем.
    v.items = v.items.filter(x => !(x.profileId === pid && x.kind === kind && x.id !== id));
    const at = v.items.findIndex(x => x.id === id);
    if (at >= 0) v.items[at] = rec; else v.items.push(rec);
    if (this._write(v)) return true;
    // не влезло: жертвуем старыми эпизодами ради текущего, о котором человек знает
    const keepNow = new Set([id]);
    v.items = v.items.filter(x => keepNow.has(x.id));
    if (this._write(v)) return true;
    if (!this._warned) { this._warned = true; toast('Память устройства переполнена — прогресс может не сохраниться', true); }
    return false;
  },
  /* 4.42: снимок урока хранит задания, сгенерированные ТЕМ билдом, при котором урок начался.
     После обновления методики продолжение показывает старые задания — человек видит дефекты,
     которые уже исправлены, и правку невозможно проверить. Снимок урока от прежнего билда
     отдавать нельзя: урок собирается заново. Суперквеста и A0 это не касается — там сюжет и
     последовательность, потерять их дороже, чем показать пару заданий по старому контракту. */
  get(kind, code) {
    if (this._isDone(code)) return null;                                // QUEUE-63: снимок пройденного не отдаём
    const r = this._read().items.find(x => x.id === this._id(kind, code, Storage.activeId()));
    if (!r) return null;
    if (kind === 'lesson' && r.build && r.build !== APP_VERSION) {
      this.drop(kind, code);
      console.log('[AILEX] урок собран прежним билдом (' + r.build + ') — пересобираем');
      return null;
    }
    return r.data;
  },
  list(kind) {
    const pid = Storage.activeId();
    return this._read().items
      .filter(x => x.profileId === pid && (!kind || x.kind === kind))
      .sort((a,b) => b.savedAt - a.savedAt);
  },
  latest(kind) {
    const l = this.list(kind).filter(x => !Episodes._isDone(x.code));   // QUEUE-63: пройденное не предлагаем
    return l.length ? l[0].data : null;
  },
  drop(kind, code) {
    const id = this._id(kind, code, Storage.activeId());
    const v = this._read(); v.items = v.items.filter(x => x.id !== id); this._write(v);
  },
  dropKind(kind) {
    const pid = Storage.activeId(), v = this._read();
    v.items = v.items.filter(x => !(x.profileId === pid && x.kind === kind)); this._write(v);
  },
  // разовый перенос снимка прежнего формата (единый слот, ключ с номером билда) в эпизоды
  migrate() {
    LEGACY_CACHE_KEYS.forEach(k => {
      let snap = null;
      try { snap = JSON.parse(localStorage.getItem(k)); } catch(e) {}
      if (snap && snap.code && !this._isDone(snap.code)) {   // QUEUE-63: давно пройденное не переносим
        const kind = snap.isSuper ? 'super' : 'lesson';
        const pid  = snap._profileId || Storage.activeId();
        const v = this._read(), id = this._id(kind, snap.code, pid);
        if (!v.items.some(x => x.id === id)) {
          v.items.push({ id, profileId: pid, kind, code: snap.code, savedAt: snap._savedAt || Date.now(), data: snap });
          this._write(v);
        }
      }
      try { localStorage.removeItem(k); } catch(e) {}
    });
  }
};

/* Снимок текущего урока/Суперквеста (объект L) поверх хранилища эпизодов.
   Сериализуем L целиком, кроме promise-объектов chunk2/superParts. */
const LessonCache = {
  save() {
    if (!L) return;
    const snapshot = Object.assign({}, L, {
      chunk2: { state: L.chunk2?.state || 'idle', err: null, promise: null },
      superParts: undefined,   // промисы порции суперквеста не сериализуются
      _savedAt: Date.now(),
      _profileId: Storage.activeId(),
      _spent: Date.now() - (L.t0 || Date.now())   // чистое время занятия: пауза между заходами не идёт в статистику
    });
    Episodes.put(L.isSuper ? 'super' : 'lesson', L.code, snapshot);
  },
  // подготовка снимка к работе: восстановить обёртку chunk2 и сдвинуть t0 на уже потраченное время
  hydrate(snap) {
    if (!snap) return null;
    snap.chunk2 = { state: snap.chunk2?.state || 'idle', err: null, promise: null };
    snap.t0 = Date.now() - (snap._spent || 0);
    return snap;
  },
  lesson(code) { return this.hydrate(Episodes.get('lesson', code)); },
  clearLesson(code) { Episodes.drop('lesson', code); },
  clearSuper(code) { code ? Episodes.drop('super', code) : Episodes.dropKind('super'); }
};

function renderStep() {
  if (!L || L.i >= L.steps.length) return finishLesson();
  LessonCache.save();   // сохраняем позицию при каждом переходе
  const s = L.steps[L.i];
  if (s.t==='present')   return drillPresent();
  if (s.t==='ruleRecap') return drillRuleRecap(s);
  if (s.t==='reviewCtx') {                // повторение слова в контексте предложения (пункт 12)
    const go = () => {
      const rd = (L.reviewDrills||[]).find(d => norm(d.word)===norm(s.w.term));
      if (rd && rd.sentence) return drillReviewContext(s, rd);
      return drillRecog({ ...s, pool:'all' });   // откат: узнавание, если предложение не сгенерировалось
    };
    if (L.chunk2.state==='ready') return go();
    return ensureChunk2().then(ok => { if (ok) go(); });
  }
  if (s.t==='context') {                 // слово в контексте (из порции 2)
    if (L.constructs && L.constructs.length) return drillContext(s);
    return ensureChunk2().then(ok => { if (ok) drillContext(s); });
  }
  if (s.t==='phrases') {                  // повседневные выражения (из порции 2)
    if (L.chunk2.state==='ready') { if (L.phrases && L.phrases.length) return drillPhrases(); L.i++; return renderStep(); }
    return ensureChunk2().then(ok => { if (!ok) return; if (L.phrases && L.phrases.length) drillPhrases(); else { L.i++; renderStep(); } });
  }
  if (s.t==='grammar') {                 // правило из порции 2: если не готово — подождём; нет правила — пропустим
    if (L.chunk2.state==='ready') { if (L.grammar) return drillGrammar(); L.i++; return renderStep(); }
    return ensureChunk2().then(ok => { if (!ok) return; if (L.grammar) drillGrammar(); else { L.i++; renderStep(); } });
  }
  if (s.t==='recog')     return drillRecog(s);
  if (s.t==='write')     return drillWrite(s);
  if (s.t==='construct') {               // построение фраз из порции 2
    if (s.c) return drillConstruct(s);
    if (L.constructs && L.constructs.length) { s.c = L.constructs[s.ci % L.constructs.length]; return drillConstruct(s); }
    return ensureChunk2().then(ok => { if (!ok) return; s.c = L.constructs[s.ci % L.constructs.length]; drillConstruct(s); });
  }
  if (s.t==='quest')     return runQuest({
      title:'Задание 21 · Интерактивный рассказ-квест',
      topic: DB.profile.interests, cefr: curCefr(),
      mustUse: L.words.slice(0,3).map(w=>w.term), maxScenes: questScenes(curCefr()),
      onError: ()=>{ L.errors.quest++; },
      onDone: ()=>{ L.i++; renderStep(); }
    });
}

// Повседневные разговорные выражения (Alltagsphrasen, версия 4.14)
function drillPhrases() {
  const list = L.phrases || [];
  // сохраняем выражения в словарь (без дублей)
  list.forEach(f => {
    if (!f.phrase) return;
    const ex = DB.vocab.find(v=>norm(v.term)===norm(f.phrase));
    if (ex) { ex.seen_in_context = true; return; }
    DB.vocab.push({ term:f.phrase, translation:f.translation||'', translit:f.translit||'', emoji:'💬',
      part_of_speech:'phrase', article:'', is_irregular:false, forms:'', lesson:'PHRASE',
      errors:0, status:'встречено в контексте', source:'phrase', seen_in_context:true,
      note:f.when||'', mnemonic:'', date_added:today(), date_review:today() });
  });
  Storage.save(DB);
  Screen.show(`
    <div class="eyebrow">${esc(L.code)} · Повседневные выражения</div>
    <h1>💬 Фразы на каждый день</h1>
    <p class="sub">Готовые разговорные выражения для живого общения. Нажмите 🔊, чтобы услышать. Они сохранены в словарь.</p>
    <div class="card">
      ${list.map(f=>`
        <div style="padding:10px 0;border-bottom:1px solid var(--line)">
          <div style="font-size:18px;font-weight:600">${tapAllWordsHTML(f.phrase)} <span style="color:var(--orange);font-weight:400">${esc(f.translit||'')}</span> ${hasTTS(DB.profile.targetLang)?`<button class="tts" style="width:34px;height:34px;font-size:15px;vertical-align:middle;margin-left:8px" data-say="${esc(f.phrase)}" onclick="replaySay(this)" aria-label="Произнести">🔊</button>`:''}</div>
          <div class="note" style="margin-top:2px">${esc(f.translation||'')}${f.when?` · <i>${esc(f.when)}</i>`:''}</div>
          ${f.reply&&f.reply.phrase?`<div style="margin-top:6px;padding-left:12px;border-left:2px solid var(--line)">
            <div style="font-size:16px;color:var(--dim)">↩ ${tapAllWordsHTML(f.reply.phrase)} <span style="color:var(--orange);font-weight:400">${esc(f.reply.translit||'')}</span> ${hasTTS(DB.profile.targetLang)?`<button style="width:30px;height:30px;font-size:14px;vertical-align:middle" data-say="${esc(f.reply.phrase)}" onclick="replaySay(this)" aria-label="Произнести ответ">🔊</button>`:''}</div>
            <div class="note" style="margin-top:1px">${esc(f.reply.translation||'')}</div>
          </div>`:''}
        </div>`).join('')}
    </div>
    <button class="btn btn-primary" id="go" style="margin-top:14px">Дальше</button>`);
  attachTapAll(document);   // 4.28: тап-перевод слов во «Фразах на каждый день»
  $('#go').onclick = () => { L.i++; renderStep(); };
}
/* ---------- Presentation: таблица новых слов ---------- */

    <div class="card">
      ${L.words.map(w=>`
        <div class="vocab-row">

            <small>${esc(w.translation)}${w.is_irregular&&(w.forms||w.irregular_forms)?' · ⚠️ '+esc(w.forms||w.irregular_forms):''}</small></span>
          ${hasTTS(DB.profile.targetLang)?`<button class="tts" data-t="${esc(w.term)}">🔊</button>`:''}

    <p class="note">${hasTTS(DB.profile.targetLang)
      ? 'Транскрипция родными буквами приблизительна — это опора для чтения, эталон даёт озвучка.'

  document.querySelectorAll('.tts').forEach(b=>b.onclick=()=>speak(b.dataset.t, DB.profile.targetLang));
  Hints.show('newWords', HintTexts.newWords);
  // пункт 3: слово показано → отмечаем «увидено»; импортированные переходят из «новое» в «изучается»
  L.words.forEach(w => { const v = DB.vocab.find(x=>norm(x.term)===norm(w.term)); if (v) { v.seen = true; if (v.source==='import' && v.status==='новое') v.status='изучается'; } w.seen = true; });
  Storage.save(DB);
  $('#go').onclick = () => { L.i++; renderStep(); };

/* ---------- Grammar Card: правило урока (раздел 5, 2.3-П) ---------- */
function grammarCardHTML(g) {
  const lang = (DB.profile && DB.profile.targetLang) || 'de';
  /* 4.40: подпись формы (label). Без неё таблица показывает набор форм без указания, где какое
     лицо или падеж, и совпадения увидеть нельзя: «ich möchte» и «er möchte» выглядят просто
     двумя строками. Требование «расположи строки так, чтобы совпадения читались с одного
     взгляда» было невыполнимо в структуре, где подписи не существует. */
  const table = (g.table||[]).map(r=>`
    <div class="vocab-row">
      <span class="w">${r.label?`<span style="color:var(--dim);font-size:12px;display:block">${esc(r.label)}</span>`:''}<b>${esc(r.form)}</b> <span class="tr">${esc(r.translit||'')}</span>
        <small>${esc(r.translation||'')}</small></span>
      <button class="tts" data-t="${esc(r.form)}" aria-label="Озвучить" ${hasTTS(lang)?'':'style="display:none"'}>🔊</button>
    </div>`).join('');
  const ex = (g.examples||[]).map(e=>`
    <div class="vocab-row">
      <span class="w"><b>${esc(e.target)}</b> <span class="tr">${esc(e.translit||'')}</span>
        <small>${esc(e.translation||'')}</small></span>
      <button class="tts" data-t="${esc(e.target)}" aria-label="Озвучить" ${hasTTS(lang)?'':'style="display:none"'}>🔊</button>
    </div>`).join('');
  return `
    <div style="font-size:15px;line-height:1.55;margin-bottom:10px">${esc(g.summary||'')}</div>
    ${g.note?`<div style="font-size:14px;line-height:1.5;margin:-4px 0 12px;color:var(--warn,#F2B84B)">⚠️ ${esc(g.note)}</div>`:''}
    ${table?`<div class="card" style="margin:0 0 10px">${table}</div>`:''}
    ${ex?`<div style="font-size:12px;color:var(--dim);margin:4px 0">Примеры:</div><div class="card" style="margin:0">${ex}</div>`:''}`;
}
function wireGrammarTTS() {

}
/* Всплывающее окно правила (кнопка-подсказка «Правило» в дриллах и квесте) */
function showRulePopup(g) {
  if (!g) { toast('В этом уроке нет отдельного правила', true); return; }
  let ov = document.getElementById('ruleOverlay');
  if (ov) ov.remove();
  ov = document.createElement('div');
  ov.id = 'ruleOverlay';
  ov.style.cssText = 'position:fixed;inset:0;z-index:60;background:rgba(4,7,14,.72);display:flex;align-items:flex-end;justify-content:center';
  ov.innerHTML = `
    <div style="width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);
                border-radius:18px 18px 0 0;padding:18px;max-height:82vh;overflow-y:auto">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <div class="eyebrow" style="margin:0">📐 Правило урока</div>
        <button id="ruleClose" style="margin-left:auto;background:var(--panel2);border:1px solid var(--line);
                color:var(--ink);border-radius:9px;width:34px;height:34px;font-size:18px;cursor:pointer">✕</button>
      </div>
      <h2 style="margin-bottom:8px">${esc(g.title||'Правило')}</h2>
      ${grammarCardHTML(g)}

  wireGrammarTTS();

  ov.onclick = e => { if (e.target===ov) close(); };
}

/* Точное правило при ошибке (версия 4.7).
   Правило приходит прямо в ответе check_answer — Gemini формулирует его под конкретную
   допущенную ошибку. Показываем сразу при первой ошибке и сохраняем в Свод правил. */
function ruleFromCheck(res) {
  if (!res || !res.rule_title) return null;
  return { title: res.rule_title, summary: res.rule_summary || '', table: res.rule_table || [],
    categories: Array.isArray(res.rule_categories) ? res.rule_categories : [],
    examples: [], cefr: curCefr(), lesson: (L&&L.code)||'', status: 'на закреплении',
    errors: 0, date_added: today() };
}
/* QUEUE-71 (4.31): в Словарь правил попадали сообщения проверяльщика вида «Ответ должен
   соответствовать смыслу задания» — это не правило языка. На экране разбора показываем всё
   (в моменте полезно), но храним только грамматику: либо есть грамматическая категория,
   либо есть таблица форм. */
const GRAM_CATS = ['Артикли','Существительные','Глаголы','Времена','Падежи','Предлоги','Порядок слов','Местоимения'];
function isGrammarRule(rule) {
  if (!rule || !rule.title) return false;
  const cats = Array.isArray(rule.categories) ? rule.categories.map(c=>String(c).trim()) : [];
  if (cats.some(c => GRAM_CATS.indexOf(c) >= 0)) return true;
  return !!(rule.table && rule.table.length);

function saveErrorRule(rule) {

}

/* ---------- Recognition / Recap: выбор слова по переводу ---------- */
function drillRecog(s) {
  const w = s.w;
  // фильтр дистракторов: только пройденные слова (seen=true), без мусорных строк (длина, скобки, стрелки)
  const isValidDistractor = x => x.seen === true
    && norm(x.term) !== norm(w.term)
    && x.term.length <= 40
    && !/[()→\d]{2}/.test(x.term)
    && !/[а-яёА-ЯЁ]{3}/.test(x.term);   // не кириллица в поле целевого языка
  const lessonPool = L.words.filter(x => norm(x.term) !== norm(w.term));
  const fillerPool = s.pool==='lesson'
    ? lessonPool
    : DB.vocab.concat(L.words).filter(isValidDistractor);
  // если отфильтрованных не хватает — добираем из lessonPool
  const fillers = pick(fillerPool, 3);
  if (fillers.length < 3) {
    const extra = lessonPool.filter(x => !fillers.some(f=>norm(f.term)===norm(x.term)));
    while (fillers.length < 3 && extra.length) fillers.push(extra.shift());
  }
  const opts = shuffle([w, ...fillers]);
  const key = 'st'+L.i;
  Screen.show(`
    <div class="eyebrow">${esc(L.code)} · ${esc(s.phase)}</div>
    <div class="card">
      <div class="drill-head"><span class="n">${s.n}</span><span class="ph">🎯 узнавание</span></div>
      <p class="note" style="margin:0 0 8px;color:var(--accent)">🎯 Какое слово соответствует: <b>«${esc(w.translation)}»</b>?</p>
      ${opts.map(o=>`<button class="opt" data-t="${esc(o.term)}">${esc(o.term)}</button>`).join('')}
      <div class="feedback" id="fb"></div>
      <button class="btn btn-primary" id="next" style="margin-top:12px" disabled>Дальше</button>
    </div>`);
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const ok = norm(b.dataset.t) === norm(w.term);
    firstTry(key, ok);
    if (ok) {
      b.classList.add('right');
      document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      $('#fb').className='feedback ok';
      $('#fb').innerHTML = `✅ <b>${esc(w.term)}</b> <span style="color:var(--orange)">${esc(w.translit||'')}</span>` + sayBtn(w.term);
      speak(w.term, DB.profile.targetLang);
      $('#next').disabled = false;
    } else {
      b.classList.add('wrong'); b.disabled = true;
      L.errors.recognition++; noteWordError(w.term);
      $('#fb').className='feedback bad';
      $('#fb').innerHTML = `❌ Не то. Попробуйте ещё раз — верный вариант на экране.`;
    }
  });
  $('#next').onclick = () => { L.i++; renderStep(); };
}

/* ---------- Скелеты и контекст (раздел 5, версия 4.12) ---------- */
// Предложение с пропуском на месте целевого слова (прячем именно цель задания)
function makeGapSentence(sentence, word) {
  const s = String(sentence||''); if (!word) return { gapped:s, found:false, answer:word };
  // пробуем: всё слово → без ведущего артикля → последний токен (существительное)
  const candidates = [];
  const w = String(word).trim();
  candidates.push(w);
  const toks = w.split(/\s+/);
  if (toks.length>1 && articleSet().has(norm(toks[0]))) candidates.push(toks.slice(1).join(' '));  // 4.35: артикли из языка
  candidates.push(toks[toks.length-1]);
  // длинная основа существительного (на случай склонения: Mechaniker в einen Mechaniker)
  const noun = toks[toks.length-1];
  for (const cand of candidates) {
    if (!cand) continue;
    const re = new RegExp('(^|[^\\p{L}])('+cand.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\p{L}*)(?=[^\\p{L}]|$)','iu');
    const m = s.match(re);
    if (m) return { gapped: s.replace(re, (mm,p1)=>p1+'_____'), found:true, answer:m[2] };
  }
  // не нашли (другая форма) — спрячем существительное по основе (первые 4 буквы)
  if (noun.length>=4) {
    const re2 = new RegExp('(^|[^\\p{L}])('+noun.slice(0,4).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\p{L}*)(?=[^\\p{L}]|$)','iu');
    const m2 = s.match(re2);
    if (m2) return { gapped: s.replace(re2,(mm,p1)=>p1+'_____'), found:true, answer:m2[2] };
  }
  return { gapped: s, found:false, answer:word };
}
// Каркас слова: первые reveal букв + точки на остальные (помощь с орфографией, не раскрывая всё)
function wordSkeleton(word, reveal) {
  const w = String(word||''); reveal = Math.max(1, reveal||1);
  return w.slice(0, reveal) + (w.length>reveal ? ' ' + '·'.repeat(w.length-reveal) : '');
}
function markSeen(term){ const v = DB.vocab.find(x=>norm(x.term)===norm(term)); if (v) { v.seen=true; } }

// --- человечная проверка (версия 4.13; источник артиклей — Ядро языка, 4.35) ---
/* Здесь до 4.35 стоял список из двенадцати немецких артиклей, вписанный в код руками. Всё, что
   на него опиралось, работало ровно для одного языка из 72 — и молча, без ошибки. Теперь набор
   собирается из языка: закрытый класс Ядра (coreMeta.articles) плюс поле article существительных
   Ядра и Словаря. Пустой набор = в языке артиклей нет, и каждая проверка артикля выключена. */
const ART = { _k:'', _s:new Set() };
function articleSet(){
  try {
    const m = (DB && DB.coreMeta) || {};
    const core = (DB && Array.isArray(DB.core)) ? DB.core : [];
    const voc  = (DB && Array.isArray(DB.vocab)) ? DB.vocab : [];
    const key = (Array.isArray(m.articles) ? m.articles.length : -1) + ':' + core.length + ':' + voc.length;
    if (key === ART._k) return ART._s;
    const s = new Set();
    (Array.isArray(m.articles) ? m.articles : []).forEach(a => { const k = norm(a); if (k && !/\s/.test(k)) s.add(k); });
    // поле article существительных: доступно сразу, до прихода отдельной партии
    const fromField = w => { const a = String((w && w.article) || '').trim();
      if (!a || /[\s,;/()]/.test(a)) return;      // только однословное значение — прочее это пояснение
      const k = norm(a); if (k) s.add(k); };
    core.forEach(fromField); voc.forEach(fromField);
    ART._k = key; ART._s = s; return s;
  } catch(e){ return ART._s; }
}
// слово перед существительным, снимающее вопрос об артикле: сам артикль либо местоимение/частица
// закрытого класса Ядра (mein, dieser, kein…). Список опять же берётся из языка, а не из кода.
function isDeterminer(tok){
  if (!tok) return false;
  if (articleSet().has(tok)) return true;
  const core = (DB && Array.isArray(DB.core)) ? DB.core : [];
  const w = core.find(x => norm(x.term) === tok);
  return !!(w && (w.part_of_speech === 'pron' || w.part_of_speech === 'part'));
}
// расстояние Левенштейна (с потолком) — для распознавания опечаток
function editDistance(a, b) {
  a = String(a); b = String(b);
  const m = a.length, n = b.length;
  if (Math.abs(m-n) > 3) return 99;
  const dp = Array.from({length:m+1}, (_,i)=>[i, ...Array(n).fill(0)]);
  for (let j=0;j<=n;j++) dp[0][j]=j;
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++)
    dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  return dp[m][n];
}
const tokenize = s => norm(s).replace(/[.,!?;:()«»"]/g,' ').split(/\s+/).filter(Boolean);
// сравнить ответ с эталоном локально: 'exact' | 'typo' | 'article' | null(надо звать Gemini)
function localVerdict(user, correct) {
  const u = tokenize(user), c = tokenize(correct);
  if (u.join(' ') === c.join(' ')) return { kind:'exact' };
  /* Отличие только в артиклях (4.35). Условие «одинаковое число слов» снято: именно оно запирало
     ученика, который дописал артикль, пропущенный в эталоне («Der Motor startet nicht» против
     «Motor startet nicht»). Разводим два случая: ученик ДОБАВИЛ артикль, которого в эталоне нет,
     сохранив все имеющиеся, — это не ошибка и не «почти верно», ответ вернее эталона, засчитываем
     молча; артикль перепутан или пропущен — прежнее поведение с замечанием. */
  const A = articleSet();
  if (A.size) {
    const uNoArt = u.filter(w=>!A.has(w)), cNoArt = c.filter(w=>!A.has(w));
    if (uNoArt.join(' ') === cNoArt.join(' ')) {
      const uArt = u.filter(w=>A.has(w)), cArt = c.filter(w=>A.has(w));
      if (uArt.join(' ') === cArt.join(' ')) return { kind:'exact' };
      const kept = cArt.every(a => uArt.includes(a));
      if (kept && uArt.length > cArt.length) return { kind:'exact', added:true };
      const wrong = cArt.filter(a => !uArt.includes(a));
      return { kind:'article', detail: wrong[0] || cArt[0] };
    }
  }
  /* 4.41 (QUEUE-105б): разница в ОКОНЧАНИИ — не опечатка, а другая форма слова. На задании
     «Профессионал отвечает быстро» ученик написал antwortet (верно), эталон содержал antworten
     (неверно), и приложение объявило верную форму опечаткой, «исправив» её на неверную. Это
     хуже плохого эталона: человек запоминает ошибку как правило. Слова с общим началом, но
     разными хвостами локально не судим — пусть решает проверяльщик, который знает язык. */
  const endingDiff = (a,b) => {
    if (a === b) return false;
    let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
    return i >= Math.max(3, Math.min(a.length, b.length) - 3);   // расходятся только к концу слова
  };
  if (u.length === c.length && u.some((w,i) => endingDiff(w, c[i]))) return null;   // → проверяльщику
  // мелкая опечатка: те же слова, общее расстояние ≤2, и одинаковое число слов
  if (u.length === c.length) {
    let dist = 0, wrongPair = null;
    for (let i=0;i<c.length;i++) { const d = editDistance(u[i], c[i]); dist += d; if (d>0 && !wrongPair) wrongPair = { got:u[i], exp:c[i] }; }
    if (dist > 0 && dist <= 2) return { kind:'typo', detail: wrongPair };
  }
  return null; // непонятно локально — спросим Gemini (смысл/синонимы)
}
/* Существительные эталона, стоящие без артикля и без определителя (4.35). Слово считается
   существительным по записи Ядра/Словаря с непустым полем article, поэтому проверка живёт ровно
   в тех языках, где артикли есть: пустой набор артиклей — пустой ответ и полное молчание. */
function bareNounHits(text){
  const A = articleSet(); if (!A.size) return [];
  const toks = tokenize(text); if (!toks.length) return [];
  const arts = new Map();
  const put = w => { if (!w || !w.term) return;
    const a = String(w.article||'').trim();
    if (a && !/[\s,;/()]/.test(a)) arts.set(norm(w.term), a + ' ' + String(w.term).trim()); };
  ((DB && DB.core) || []).forEach(put); ((DB && DB.vocab) || []).forEach(put);
  const hits = [];
  toks.forEach((t, i) => {
    const hit = arts.get(t); if (!hit) return;          // словарная запись: «артикль + слово как в словаре»
    if (i > 0 && isDeterminer(toks[i-1])) return;
    hits.push(hit);
  });
  return [...new Set(hits)].slice(0, 6);
}
/* Знаменательные слова эталона, которых ученику негде взять (4.36, QUEUE-85). Критерий (4)
   валидатора проверяет согласованность ФОРМЫ уже присутствующего слова, а не наличие слова
   целиком, и потому молчал: в глоссарии «die Automatik», в эталоне «den Automatikmodus» —
   составного слова не было нигде, а увиденный женский артикль ещё и противоречил нужному
   мужскому. Слово считается доступным, если оно есть в глоссарии или в видимой части каркаса. */
// исходное написание слова по нормализованному токену: в запрос уходит «Automatikmodus», а не «automatikmodus»
function origBy(text){
  const m = new Map();
  String(text||'').split(/[^\p{L}\p{M}-]+/u).forEach(w => { const k = norm(w); if (k && !m.has(k)) m.set(k, w); });
  return m;
}
function glossaryGaps(text, glossary, scaffold){
  const toks = tokenize(text); if (!toks.length) return [];
  const A = articleSet();
  const core = (DB && Array.isArray(DB.core)) ? DB.core : [];
  const CLOSED = ['pron','prep','conj','part'];
  const have = [];
  (glossary||[]).forEach(g => tokenize(String((g&&g.term)||'')).forEach(t => have.push(t)));
  tokenize(String(scaffold||'').replace(/_+/g,' ')).forEach(t => have.push(t));
  // словоформа считается покрытой при общем начале и близкой длине: startet ← starten (да),
  // automatikmodus ← automatik (нет — это другое слово, а не форма того же)
  const covered = t => have.some(h => {
    if (h === t) return true;
    let i = 0; while (i < h.length && i < t.length && h[i] === t[i]) i++;
    return i >= 4 && Math.abs(h.length - t.length) <= 3;
  });
  const gaps = [], O = origBy(text);
  toks.forEach(t => {
    if (t.length < 3 || A.has(t)) return;
    const w = core.find(x => norm(x.term) === t);
    if (w && CLOSED.includes(w.part_of_speech)) return;      // служебное слово — не «слово задания»
    if (!covered(t)) gaps.push(O.get(t) || t);
  });
  return [...new Set(gaps)].slice(0, 6);
}
/* Разбор составного существительного (4.36, QUEUE-86). Род составного задаёт ПОСЛЕДНИЙ компонент
   (der Modus → der Automatikmodus), и именно это звено правило пропустило, объяснив вместо него
   заглавную букву и слитное написание. Код находит опору — словарную запись хвоста — и передаёт
   её проверяльщику фактом, чтобы правилу было от чего оттолкнуться. */
function compoundHints(text){
  const toks = tokenize(text); if (!toks.length) return [];
  const src = [...((DB && DB.core) || []), ...((DB && DB.vocab) || [])];
  const nouns = src.filter(w => w && w.term && String(w.article||'').trim() && !/[\s,;/()]/.test(String(w.article).trim()));
  const out = [], O = origBy(text);
  toks.forEach(t => {
    if (t.length < 8) return;
    if (nouns.some(w => norm(w.term) === t)) return;             // цельное слово, уже в словаре
    let best = null;
    nouns.forEach(w => {
      const tail = norm(w.term);
      if (tail.length < 3 || tail.length >= t.length - 2) return;
      if (!t.endsWith(tail)) return;
      if (!best || tail.length > norm(best.term).length) best = w;
    });
    if (best) out.push((O.get(t) || t) + ': последний компонент — ' + String(best.article).trim() + ' ' + String(best.term).trim()
                         + ', род и артикль составного берутся от него');
  });
  return [...new Set(out)].slice(0, 3);
}
// подсветить расхождение: эталон с выделенным отличающимся словом
function highlightDiff(user, correct) {
  const cTok = String(correct).split(/(\s+)/), uTok = tokenize(user);
  let ui = 0;
  return cTok.map(tok => {
    if (/^\s+$/.test(tok) || !tok) return esc(tok);
    const plain = norm(tok.replace(/[.,!?;:()«»"]/g,''));
    const u = uTok[ui++]; const same = u !== undefined && u === plain;
    return same ? esc(tok) : `<u style="color:var(--orange);text-decoration-thickness:2px">${esc(tok)}</u>`;
  }).join('');
}

// Повторение слова прошлых уроков — в контексте предложения со скелетом (пункт 12, версия 4.13)
function drillReviewContext(s, rd) {
  const w = s.w;
  const gap = makeGapSentence(rd.sentence, w.term);
  if (!gap.found) return drillRecog({ ...s, pool:'all' });   // не удалось встроить — откат на узнавание
  const answer = gap.answer;
  const fullSentence = rd.sentence;   // полное предложение для показа после верного ответа
  const key = 'st'+L.i; let mustRetype = false;
  Screen.show(`
    <div class="eyebrow">${esc(L.code)} · ${esc(s.phase||'Повторение')}</div>
    <div class="card">

    speak(answer, DB.profile.targetLang); };
  $('#check').onclick = () => {
    const a = $('#ans').value.trim();
    if (!a && !mustRetype) return;
    // Путь 1: ввод совпадает с answer напрямую (одно слово или словосочетание)
    // Путь 2: ввод — полное предложение → вычитаем каркас, остаток сравниваем с answer
    const gappedNorm = norm(gap.gapped).replace(/_+/g, '').replace(/\s+/g,' ').trim();
    const inputNorm  = norm(a).replace(/\s+/g,' ').trim();
    const gapToks = gappedNorm.split(/\s+/).filter(Boolean);
    const inToks  = inputNorm.split(/\s+/).filter(Boolean);
    let extracted = null;
    if (inToks.length > gapToks.length) {
      const remaining = []; let gi = 0;
      for (let ii = 0; ii < inToks.length; ii++) {

        else { remaining.push(inToks[ii]); }
      }
      if (remaining.length) extracted = remaining.join(' ');
    }
    const ok = norm(a)===norm(answer) || norm(a)===norm(w.term) || editDistance(norm(a),norm(answer))<=1

      $('#fb').className='feedback ok';

    } else {
      if (!mustRetype) { L.errors.recognition++; noteWordError(w.term); mustRetype = true; }
      $('#fb').className='feedback bad';
      $('#fb').innerHTML = `❌ <span class="target">${tapAllWordsHTML(fullSentence)}</span> <span style="color:var(--orange)">${esc(w.translit||'')}</span>` + sayBtn(fullSentence) + `<br><span>🧠 Запомните и напишите предложение целиком.</span>`;
      attachTapAll($('#fb'), L.words);
      speak(fullSentence, DB.profile.targetLang);
      $('#ans').value=''; autoGrow($('#ans')); $('#ans').focus();

  };
}

// Слово в контексте — пропуск в предложении (пункт 12, версия 4.20)
function drillContext(s) {
  const item = (L.constructs||[])[s.ci % (L.constructs||[1]).length];
  if (!item) { L.i++; return renderStep(); }
  const dictWord = item.focus_word || (item.expected_target||'').split(/\s+/).find(x=>x.length>2) || (item.expected_target||'').trim();
  const vEntry = L.words.find(w=>norm(w.term)===norm(dictWord)) || DB.vocab.find(w=>norm(w.term)===norm(dictWord)) || {};
  const gap = makeGapSentence(item.expected_target, dictWord);
  // не удалось встроить пропуск (другая форма/нет слова) — не показываем кривой прочерк, пропускаем
  if (!gap.found) { L.i++; return renderStep(); }
  const answer = gap.answer;              // ответ — форма, реально стоящая в предложении
  const fullSentence = item.expected_target;  // полное предложение для показа после верного ответа
  const key = 'st'+L.i; let mustRetype = false;
  // перевод предложения: берём из prompt_native (поле constructs)
  const sentTranslation = item.prompt_native || '';
  Screen.show(`
    <div class="eyebrow">${esc(L.code)} · ${esc(s.phase||'Контекст')}</div>
    <div class="card">
      <div class="drill-head"><span class="n">${s.n}</span><span class="ph">🧩 слово в контексте</span></div>

      <div class="task-text target">${tapAllWordsHTML(gap.gapped)}</div>

      <textarea id="ans" class="ans-grow" placeholder="Напишите предложение целиком" autocomplete="off" autocapitalize="off"></textarea>
      <div class="feedback" id="fb"></div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn btn-ghost btn-ico" id="hint" title="Подсказка" aria-label="Подсказка">💡</button>
        <button class="btn btn-primary" id="check">Проверить</button>
      </div>
    </div>`);
  bindAutoGrow('ans');
  attachTapAll(document, L.words);   // 4.28: тап-перевод слов фразы
  // двухуровневая лампочка: 1-й тап → скелет+транскрипция, 2-й тап → полное слово+перевод
  let hintLevel = 0;
  $('#hint').onclick = () => {
    L.hints++; hintLevel++;
    $('#fb').className = 'feedback ok';
    if (hintLevel === 1) {
      $('#fb').innerHTML = `💡 <b>${esc(wordSkeleton(answer, Math.min(2, answer.length)))}</b> <span style="color:var(--orange)">${esc(vEntry.translit||'')}</span>`;
    } else {
      // QUEUE-03: показываем форму из задания (answer), не инфинитив из словаря
      const hintTranslit = item.expected_translit || vEntry.translit || '';
      $('#fb').innerHTML = `💡 <b>${esc(answer)}</b> <span style="color:var(--orange)">${esc(hintTranslit)}</span>` + sayBtn(answer) + ` — ${esc(vEntry.translation||'')}`;
      speak(answer, DB.profile.targetLang); // QUEUE-10: авто-TTS при показе полного ответа
    }
  };
  $('#check').onclick = () => {
    const a = $('#ans').value.trim();
    if (!a && !mustRetype) return;
    // Путь 1: ввод совпадает с answer напрямую (одно слово или словосочетание)
    // Путь 2: ввод — полное предложение → вычитаем каркас, остаток сравниваем с answer (4.20)
    const gappedNorm = norm(gap.gapped).replace(/_+/g, '').replace(/\s+/g,' ').trim();
    const inputNorm  = norm(a).replace(/\s+/g,' ').trim();
    const gapToks = gappedNorm.split(/\s+/).filter(Boolean);
    const inToks  = inputNorm.split(/\s+/).filter(Boolean);
    let extracted = null;
    if (inToks.length > gapToks.length) {
      const remaining = []; let gi = 0;
      for (let ii = 0; ii < inToks.length; ii++) {
        if (gi < gapToks.length && inToks[ii] === gapToks[gi]) { gi++; }
        else { remaining.push(inToks[ii]); }
      }
      if (remaining.length) extracted = remaining.join(' ');
    }
    // QUEUE-05: засчитываем любую форму корня если правило не пройдено
    const knownRuleCats = (DB.rules||[]).flatMap(r=>r.categories||[]);
    const grammarKnown = knownRuleCats.length > 0;
    // rootMatch: ввод содержит корень ответа (первые N букв совпадают)
    const ansRoot = norm(answer).slice(0, Math.max(3, Math.floor(norm(answer).length*0.6)));
    const rootMatch = norm(a).includes(ansRoot) || (extracted && norm(extracted).includes(ansRoot));
    const ok = norm(a)===norm(answer) || norm(a)===norm(dictWord) || editDistance(norm(a),norm(answer))<=1
            || (extracted !== null && editDistance(norm(extracted), norm(answer)) <= 1)
            || (!grammarKnown && rootMatch);
    if (!mustRetype) firstTry(key, ok);
    if (ok) {
      markSeen(dictWord);
      $('#fb').className='feedback ok';
      $('#fb').innerHTML = `✅ <span class="target">${tapAllWordsHTML(fullSentence)}</span> <span style="color:var(--orange)">${esc(vEntry.translit||'')}</span>` + sayBtn(fullSentence);
      attachTapAll($('#fb'), L.words);
      speak(fullSentence, DB.profile.targetLang);
      $('#check').textContent = 'Дальше'; $('#check').onclick = () => { L.i++; renderStep(); };
    } else {
      if (!mustRetype) { L.errors.writing++; noteWordError(dictWord); markSeen(dictWord); mustRetype = true; }
      $('#fb').className='feedback bad';
      // QUEUE-04: при ошибке формы — показываем пояснение если есть
      const formNote = (answer !== dictWord) ? `<br><span style="color:var(--dim);font-size:13px">📌 В этом предложении: <b>${esc(answer)}</b> — форма слова «${esc(dictWord)}»</span>` : '';
      $('#fb').innerHTML = `❌ <span class="target">${tapAllWordsHTML(fullSentence)}</span> <span style="color:var(--orange)">${esc(vEntry.translit||'')}</span>` + sayBtn(fullSentence) + formNote + `<br><span>🧠 Запомните и напишите предложение целиком.</span>`;
      attachTapAll($('#fb'), L.words);
      speak(fullSentence, DB.profile.targetLang);
      $('#ans').value=''; autoGrow($('#ans')); $('#ans').focus();
    }
  };
}

/* ---------- Construction: построение фраз (проверка через Gemini) ---------- */
function drillConstruct(s) {
  const c = s.c, key = 'st'+L.i;
  // QUEUE-72: то же для заданий урока — эталон не показываем в условии ни при каких формулировках
  c.prompt_native = stripAnswerLeak(c.prompt_native, c.expected_target);
  let mustRetype = false, correctForm = c.expected_target;
  // словарик новых слов задания (с переводом+транскрипцией) + автосохранение в словарь
  const gloss = Array.isArray(c.glossary) ? c.glossary.filter(g=>g && g.term) : [];
  gloss.forEach(g => {
    const ex = DB.vocab.find(v=>norm(v.term)===norm(g.term));
    if (ex) { if (g.translit && !ex.translit) ex.translit=g.translit; return; }
    DB.vocab.push({ term:g.term, translation:g.translation||'', translit:g.translit||'', emoji:'💬',
      part_of_speech:'', article:'', is_irregular:false, forms:'', lesson:'CONTEXT',
      errors:0, status:'встречено в контексте', source:'task', seen_in_context:true, mnemonic:'', date_added:today(), date_review:today() });
  });
  if (gloss.length) Storage.save(DB);
  // ЛЮБОЕ немецкое слово, показанное в формулировке задания, получает перевод+транскрипцию из словаря —
  // даже «известное» (как Bedienfeld), чтобы не было слов без пояснения (версия 4.13)
  const shownText = (instr0()+' '+(c.prompt_native||'')+' '+(c.focus_word||''));
  function instr0(){ return c.instruction || ''; }
  const latinTokens = (shownText.match(/[A-Za-zÄÖÜäöüß]{2,}/g) || []);
  const seenG = new Set(gloss.map(g=>norm(g.term)));
  latinTokens.forEach(tok => {
    const n = norm(tok); if (seenG.has(n)) return;
    const v = DB.vocab.find(x=>norm(x.term)===n || norm(x.term).split(' ').pop()===n);
    if (v && (v.translation||v.translit)) { seenG.add(n); gloss.push({ term: tok, translit: v.translit||'', translation: v.translation||'' }); }
  });
  // «Собери фразу» (4.28): набор всех слов эталона, перемешанный — опора для сборки.
  // Набор строит ПРИЛОЖЕНИЕ из expected_target (split+shuffle) — логика, не Gemini.
  // Все слова, включая служебные, попадают в набор (иначе фразу не собрать); каждое — с тап-переводом.
  const bankWords = String(c.expected_target||'').trim().split(/\s+/)
    .map(x=>x.replace(/^[«»"'(]+|[.,!?;:«»"')]+$/g,'')).filter(Boolean);
  const bankHTML = bankWords.length
    ? `<div class="note" style="margin:8px 0 4px;line-height:2">🧩 Соберите фразу из слов <span style="opacity:.6">(тап — перевод)</span>:<br>${shuffle(bankWords.slice()).map(word=>`<span class="tapword tapall" data-word="${esc(word)}">${esc(word)}</span>`).join(', ')}</div>` : '';
  /* 4.41 (QUEUE-105в): формулировку задаёт приложение. Модель присылала «Переведите фразу на
     немецкий язык», а строкой ниже стояло «Соберите фразу из слов» — два разных упражнения в
     одном задании. Если слова даны, перевод уже сделан за ученика: остаётся порядок слов. */
  const instruction = `Соберите фразу на ${esc(langName(DB.profile.targetLang))}:`;
  Screen.show(`
    <div class="eyebrow">${esc(L.code)} · Construction</div>
    <div class="card">
      <div class="drill-head"><span class="n">${s.n}</span><span class="ph">🧩 собери фразу</span></div>
      <p class="note" style="margin:0 0 6px;color:var(--accent)">🎯 ${esc(instruction)}</p>
      <div class="task-text">«${esc(c.prompt_native)}»</div>
      ${bankHTML}
      <textarea id="ans" class="ans-grow" placeholder="Ваш ответ на ${esc(langName(DB.profile.targetLang))}" autocomplete="off" autocapitalize="off"></textarea>
      <div class="feedback" id="fb"></div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn btn-ghost btn-ico" id="hint" title="Подсказка" aria-label="Подсказка">💡</button>
        ${L.grammar?`<button class="btn btn-ghost btn-ico" id="rule" title="Правило" aria-label="Правило">📐</button>`:''}
        <button class="btn btn-primary" id="check">Проверить</button>
      </div>
    </div>`);
  if (L.grammar) $('#rule').onclick = () => { L.hints++; showRulePopup(L.grammar); };
  bindAutoGrow('ans');
  attachTapAll(document, gloss);   // 4.28: тап-перевод слов набора (gloss — быстрый источник, дальше словарь/Gemini)
  // подсказка: ПОЛНЫЙ правильный ответ — фраза целиком + транскрипция + перевод + озвучка (версия 4.14)
  $('#hint').onclick = () => { L.hints++; $('#fb').className='feedback ok';
    const tr = c.expected_translit ? ` <span style="color:var(--orange)">${esc(c.expected_translit)}</span>` : '';
    $('#fb').innerHTML = `💡 Полный ответ: <b>${esc(correctForm)}</b>${tr}` + sayBtn(correctForm) + `<br><span style="font-size:13px">${esc(c.prompt_native||'')}</span>`;
    speak(correctForm, DB.profile.targetLang); }; // QUEUE-10: авто-TTS при показе полного ответа
  $('#check').onclick = async () => {
    const a = $('#ans').value.trim();
    if (!a) return;
    if (mustRetype) {
      const v = localVerdict(a, correctForm);
      if (v && (v.kind==='exact'||v.kind==='typo'||v.kind==='article')) { passOK(); }
      else { $('#fb').className='feedback bad'; $('#fb').innerHTML=`❌ Почти! Сверьте: ${highlightDiff(a, correctForm)}`; }
      return;
    }
    // 1) локальная человечная проверка (без сети): точное / опечатка / только артикль
    const v = localVerdict(a, correctForm);
    if (v && v.kind==='exact') { firstTry(key, true); return passOK(); }
    if (v && v.kind==='typo') { firstTry(key, true);
      return passOK({ note:`Верно, маленькая опечатка: правильно «${v.detail.exp}», вы написали «${v.detail.got}».` }); }
    if (v && v.kind==='article') { firstTry(key, true); if (c.focus_word) noteWordError(c.focus_word);
      return passOK({ note:`Почти верно — обратите внимание на артикль: «${v.detail}».`, articleSlip:true }); }
    // 2) смысл/синонимы — через Gemini
    $('#check').disabled = true; $('#fb').className='feedback ok'; $('#fb').textContent='Проверяю…';
    let res = null;
    try {
      res = await Gemini.call({ task:'check_answer', target_lang:DB.profile.targetLang, native_lang:DB.profile.nativeLang,
        cefr: curCefr(), expected: c.expected_target, user_answer: a,
        rules:'Проверяй по СМЫСЛУ и грамматике, НЕ по точному совпадению строк. Любой грамматически корректный вариант с тем же смыслом — correct=true (синонимы, иной порядок слов, иные но верные конструкции). Равноценные формы (in dem=im, zu dem=zum, an dem=am) — верны. Мелкие опечатки (1-2 буквы) — correct=true. Если ответ верен, но эталон естественнее — correct=true и note на native_lang («Верно. Более типично: …»). Только при реальной смысловой/грамматической ошибке correct=false: в explanation короткий разбор именно этой ошибки на native_lang, в rule_title/rule_summary правило под неё (полно), rule_table — полный набор форм.' },
        '{"correct":true,"error_type":"spelling|article|word_order|verb_conjugation|vocabulary_gap|none","note":"мягкая подсказка если ответ верен но есть лучший вариант, иначе пусто","explanation":"короткий разбор именно этой ошибки на родном","correct_form":"верная фраза","correct_translit":"[транскрипция верной фразы родными буквами]","rule_title":"короткое название правила под эту ошибку (на родном)","rule_summary":"правило целиком, 2-4 фразы на родном","rule_categories":["одна или несколько из: Артикли, Существительные, Глаголы, Времена, Падежи, Предлоги, Порядок слов, Местоимения, Прочее"],"rule_table":[{"form":"форма на целевом","translit":"[транскрипция]","translation":"перевод"}]}');
    } catch(e){}
    $('#check').disabled = false;
    if (!res) { toast('Связь барахлит — ответ засчитан', true); firstTry(key, true); return passOK(null); }
    if (res.correct) { firstTry(key, true); return passOK(res); }
    firstTry(key, false);
    L.errors.construction++; if (c.focus_word) noteWordError(c.focus_word);
    correctForm = (res && res.correct_form) || c.expected_target;
    const cTr = (res && res.correct_translit) ? ` <span style="color:var(--orange)">${esc(res.correct_translit)}</span>` : '';
    mustRetype = true;
    $('#fb').className='feedback bad';
    $('#fb').innerHTML = `❌ ${esc(res?.explanation || 'Есть ошибка.')}<br>Сверьте: ${highlightDiff(a, correctForm)}${cTr}` + sayBtn(correctForm) + `<br>🧠 Запомните и введите верный вариант, чтобы продолжить.`;
    speak(correctForm, DB.profile.targetLang);
    showErrorRule(res);
    $('#ans').value=''; $('#ans').focus();
  };
  function passOK(res) {
    $('#fb').className='feedback ok';
    const note = res && res.note ? `<br><span style="color:var(--orange);font-size:13px">💡 ${esc(res.note)}</span>` : '';
    $('#fb').innerHTML = `✅ <b>${esc(correctForm)}</b>` + sayBtn(correctForm) + note;
    speak(correctForm, DB.profile.targetLang);
    if (res && res.articleSlip) {   // пункт 14: копим промахи по артиклям в адаптивное правило
      let r = DB.rules.find(x=>norm(x.title)==='артикли' || (x.categories||[]).includes('Артикли'));
      if (!r) { r = { title:'Артикли', summary:'Род существительного определяет артикль (der/die/das). Обращайте внимание на артикль при заучивании слова.', table:[], examples:[], categories:['Артикли'], cefr:'A1', lesson:L.code, status:'на закреплении', errors:0, date_added:today() }; DB.rules.push(r); }
      r.errors = (r.errors||0) + 1; r.status='на закреплении'; Storage.save(DB);
    }
    if (res && res.note && res.rule_title) saveErrorRule(ruleFromCheck(res));
    $('#check').textContent='Дальше'; $('#check').disabled=false;
    $('#check').onclick = () => { L.i++; renderStep(); };
  }
}

/* =====================================================================
   КВЕСТ — интерактивный рассказ с развилками 2×2 (раздел 5.A).
   Каркас жёсткий (приложение), реакция живая (Gemini). Anti-Frustration:
   после 2 ошибок — режим напарника и Graceful Exit.
   ===================================================================== */
// Длина квеста растёт с уровнем: связный рассказ 8–12+ предложений (версия 4.12)
function questScenes(lvl){ return ({A1:8, A2:9, B1:11, B2:13, C1:15, C2:15})[lvl] || 8; }
// QUEUE-42: проверка согласованности сцены перед показом.
// Структурная (код): не показан ли каркас уже достроенным иным словом в сцене (праймящая коллизия).
// Семантическая (Gemini-валидатор): отвечает ли expected_target на prompt_for_user по смыслу.
// Графичный fallback: при любом сбое валидатора возвращаем исходную сцену — поток не блокируется.
async function validateScene(sc, p, cefr) {
  if (!sc || !sc.expected_target || !sc.prompt_for_user) return sc; // финальная сцена без задания — нечего проверять
  // 0) QUEUE-72: эталон в формулировке задания — списать вместо ответа. Запрет живёт в промпте
  //    с v55 (levelPromptBlock) и всё равно протекает, поэтому чистит код, до всех проверок.
  sc.prompt_for_user = stripAnswerLeak(sc.prompt_for_user, sc.expected_target);
  // 1) Структурная проверка кодом
  let structuralCollision = false;
  try {
    const stem = String(sc.scaffold||'').split('___')[0];           // видимая часть до первого прочерка
    const stemN = norm(stem).replace(/\s+/g,' ').trim();
    if (stemN && stemN.split(' ').length >= 2) {                    // нужен осмысленный стем (≥2 слова)
      const sceneN = norm(sc.scene_text||'').replace(/\s+/g,' ');
      const expN   = norm(sc.expected_target||'').replace(/\s+/g,' ').trim();
      // стем каркаса есть в сцене, а эталон целиком — нет → сцена достроила конструкцию иначе
      if (sceneN.includes(stemN) && expN && !sceneN.includes(expN)) structuralCollision = true;
    }
  } catch(_) {}
  /* 1б) Уровень задания и плотность каркаса — код (4.30).
     Маркеры ищем ТОЛЬКО в выходе (эталон + каркас): проверка по короткой фразе надёжна,
     по абзацу сцены дала бы ложные срабатывания, да и сцена потолком не ограничена. */
  let hitMarkers = [], overload = false;
  try {
    hitMarkers = GrammarCore.hitMarkers(String(sc.expected_target||'') + ' ' + String(sc.scaffold||''), cefr);
    overload = scaffoldOverloaded(sc.scaffold, cefr);
  } catch(_) {}
  /* 1в) Голое существительное в эталоне (4.35). Запрет жил только текстом критерия (3) и протекал:
     на SUPER_A1.1.13 эталоном стало «Motor startet nicht», при том что в глоссарии честно лежало
     «der Motor» — ученик написал верно и был забракован. Код ищет и поднимает флаг; чинит модель,
     потому что нулевой артикль в языке бывает законным (имена, вещественные, устойчивые обороты). */
  let bareNouns = [];
  try { bareNouns = bareNounHits(String(sc.expected_target||'')); } catch(_) {}
  // 1г) Слово эталона, которого нет ни в глоссарии, ни в каркасе (4.36, QUEUE-85)
  let gaps = [];
  try { gaps = glossaryGaps(String(sc.expected_target||''), sc.answer_glossary, sc.scaffold); } catch(_) {}
  // 2) Семантический валидатор (Gemini)
  let v = null;
  try {
    v = await Gemini.call({
      task:'validate_quest_scene', target_lang:p.targetLang, native_lang:p.nativeLang, cefr:cefr,
      scene_text: sc.scene_text, prompt_for_user: sc.prompt_for_user,
      expected_target: sc.expected_target, scaffold: String(sc.scaffold||''),
      structural_collision: structuralCollision,
      bare_nouns: bareNouns,
      glossary_gaps: gaps,
      banned_markers: GrammarCore.bannedMarkers(cefr),
      hit_markers: hitMarkers, scaffold_overload: overload,
      scaffold_cap: SCAFFOLD_CAP[cefr] || 0,
      rules:'Проверь согласованность задания по ПЯТИ критериям и при нарушении ПОЧИНИ. '
        + '(1) СМЫСЛ: expected_target обязан быть прямым ответом на prompt_for_user — на том же уровне вопроса. Если вопрос «кто делает: сам или коллега?» — ответ про того, кто делает (ich … selbst / ich rufe den Kollegen), а НЕ про режим работы. Если вопрос «что выбираешь: аэропорт или кафе?» — ответ называет аэропорт или кафе. Если эталон отвечает не на тот вопрос — приведи prompt_for_user и expected_target в соответствие, сохранив смысл сцены (обычно проще поправить вопрос под эталон). '
        + '(2) КОЛЛИЗИЯ: конструкция каркаса не должна быть уже показана в scene_text достроенной ДРУГИМ словом (если structural_collision=true — это уже обнаружено кодом, обязательно почини). Почини так, чтобы expected_target был выводим из контекста, а сцена не праймила неверное завершение. '
        + '(3) УЗУАЛЬНОСТЬ И КОРРЕКТНОСТЬ СЛОВ: expected_target обязан быть живой, употребимой фразой носителя БЕЗ битых/несуществующих слов и без калек. Проверь каждое слово эталона: существует ли оно в такой форме (например «weiterlauf» НЕ существует — есть глагол «weiterlaufen» или существительное «das Weiterlaufen»; «das Programm weiterlaufend» — не по-немецки). Если в эталоне битое слово или неидиоматичная конструкция — перепиши задание под ПРОСТУЮ употребимую фразу строго уровня CEFR '+cefr+' (лучше упростить, чем сохранить кривую конструкцию). ОТДЕЛЬНО ПРОВЕРЬ АРТИКЛИ (4.31, критично): голое существительное там, где артикль обязателен, — ошибка эталона («Ich kaufe Buch» ❌ → «Ich kaufe das Buch» ✅). Если bare_nouns непусто — код уже нашёл в эталоне существительные без артикля и определителя и передал их вместе со словарным артиклем; по каждому реши, законен ли нулевой артикль в этой позиции (имя собственное, вещественное, устойчивый оборот, множественное неопределённое), и если нет — поставь артикль в нужном падеже и приведи scaffold с глоссарием в соответствие. Эталон, который учит неверной фразе, хуже отсутствия задания: ученик пишет правильно и получает в ответ кривой образец. '
        + '(4) СОГЛАСОВАННОСТЬ ГЛОССАРИЯ: слова в answer_glossary и форма, которую требует expected_target, обязаны совпадать — что показано ученику, то и в ответе (нельзя дать в глоссарии «weiterlauf», а в эталоне ждать «weiterlaufend»). ПОЛНОТА ГЛОССАРИЯ (4.36, критично): если glossary_gaps непусто — код нашёл в эталоне знаменательные слова, которых нет ни в answer_glossary, ни в видимой части каркаса; ученику их негде взять. По каждому: либо добавь слово в answer_glossary в словарной форме (существительное — с артиклем рода), либо перепиши expected_target через то, что уже показано. Особый случай — составное существительное: показать в глоссарии его часть («die Automatik», когда в ответе нужен «den Automatikmodus») НЕЛЬЗЯ, это подсказывает ещё и чужой род; в глоссарий идёт слово целиком. ЗАПРЕТ ОТКРЫТОГО ВЫБОРА (4.31, критично): задание обязано иметь РОВНО ОДИН верный ответ, выводимый из scene_text. Если prompt_for_user предлагает выбрать одно из двух («работа или пауза?»), а сцена не говорит, что герой выбрал, — ученик даст верный ответ и будет забракован эталоном. Чини ТОЛЬКО переформулировкой: убери выбор из prompt_for_user и спроси о том, что в сцене уже определено. ЗАПРЕЩЕНО «починить» это добавлением второго варианта в answer_glossary — глоссарий не делает второй ответ допустимым, эталон всё равно один. Выбор живёт только в сюжетной развилке (choices), а не в языковом задании. '
        + '(5) УРОВЕНЬ И ПЛОТНОСТЬ ЗАДАНИЯ (4.30, критично): в expected_target и scaffold не должно быть НИ ОДНОГО слова или формы из banned_markers — это маркеры тем, которых ученик ещё не проходил. Если hit_markers непусто, значит запрещённое уже найдено кодом — обязательно перепиши задание так, чтобы обойтись без него (сменить конструкцию, а не подставить синоним той же непройденной темы). В scene_text эти слова допустимы и трогать сцену НЕ нужно. '
        + 'Если scaffold_overload=true — прочерков в каркасе больше потолка (scaffold_cap): перестрой задание под потолок, раскрыв лишние прочерки видимыми словами или упростив эталон до одного смыслового шага. Каркас — опора, а не пустая строка. '
        + 'ТЕКСТ СЦЕНЫ НЕ ПРАВИТСЯ НИКОГДА: scene_text — рецептивный вход, он намеренно свободен от потолка уровня. Чини только задание, эталон, каркас и глоссарий. '
        + 'После починки expected_target, scaffold и answer_glossary обязаны остаться согласованными между собой и строго на уровне CEFR '+cefr+'. scaffold — это expected_target с ___ на месте ключевых слов. Если всё уже согласовано — верни ok=true, остальные поля можно вернуть прежними.'
    },
    '{"ok":true,"prompt_for_user":"задание на родном (исправленное или прежнее)","expected_target":"эталон на целевом (исправленный или прежний)","scaffold":"каркас с ___ согласованный с эталоном","answer_glossary":[{"term":"слово","translit":"[транскрипция]","translation":"перевод"}]}');
  } catch(_) { return sc; }
  if (v && v.ok === false) {
    if (v.prompt_for_user) sc.prompt_for_user = v.prompt_for_user;
    if (v.expected_target) sc.expected_target = v.expected_target;
    if (v.scaffold) sc.scaffold = v.scaffold;
    if (Array.isArray(v.answer_glossary) && v.answer_glossary.length) sc.answer_glossary = v.answer_glossary;
  }
  return sc;
}

async function runQuest(cfg) {
  const p = DB.profile;
  const Q = { scene:1, errors:0, summary:'', choice:null, branchesUsed:0 };
  // QUEUE-46: возобновление квеста внутри урока. Позиция квеста хранится на L (L.qResume)
  // и сериализуется вместе с уроком через LessonCache. При возврате к уроку восстанавливаем сцену.
  if (L && L.qResume) {
    Q.scene = L.qResume.scene || 1;
    Q.summary = L.qResume.summary || '';
    Q.choice = L.qResume.choice || null;
    Q.errors = L.qResume.errors || 0;
    Q.branchesUsed = L.qResume.branchesUsed || 0;
  }
  nextScene();

  function saveQuestPos() {
    // 4.29: позиция квеста — в снимок урока ПЕРЕД показом сцены (а не только при переходе дальше),
    // иначе выход на первой же сцене квеста терял бы её.
    if (!L) return;
    L.qResume = { scene:Q.scene, summary:Q.summary, choice:Q.choice, errors:Q.errors, branchesUsed:Q.branchesUsed };
    LessonCache.save();
  }

  async function nextScene() {
    saveQuestPos();
    Screen.loader(`Сцена ${Q.scene} из ${cfg.maxScenes}…`);
    let sc;
    try {
      sc = await Gemini.call({
        task:'quest_step', target_lang:p.targetLang, native_lang:p.nativeLang, cefr:cfg.cefr,
        topic:cfg.topic, must_use:cfg.mustUse, scene_index:Q.scene, max_scenes:cfg.maxScenes,
        user_choice:Q.choice, story_so_far:Q.summary,
        known_rules:(DB.rules||[]).map(r=>r.title).slice(-40),
        rules:'СЦЕНА — ТОЛЬКО НОВОЕ (критично, 4.43): story_so_far дан, чтобы ты ЗНАЛ предысторию, а НЕ чтобы её пересказывать. scene_text содержит только НОВЫЕ события, продолжающие историю с того места, где она остановилась. Повторять предложения из story_so_far ЗАПРЕЩЕНО: ученик читает одно и то же по три раза и теряет интерес, а объём чтения растёт впустую. ЯЗЫК УСЛОВИЯ (критично, 4.43): prompt_for_user — СТРОГО на native_lang. Неверно: «Sie sind in der Pause. Was machen Sie?». Верно: «Вы на перерыве. Что вы делаете?». На target_lang — только scene_text, scaffold и сам ожидаемый ответ. НЕ ДУБЛИРУЙ ТРЕБУЕМЫЕ СЛОВА (4.43): приложение само показывает их строкой «Используйте: …» над полем ввода, поэтому в prompt_for_user не пиши «используя слово „gut“» — условие должно называть только ЗАДАЧУ. Всего в истории ровно 2 развилки по 2 варианта; развилок уже использовано: '+Q.branchesUsed+'. РАЗВИЛКА — СЮЖЕТНАЯ, НЕ ГРАММАТИЧЕСКАЯ (QUEUE-48, критично): когда is_branch=true, два варианта choices — это РАЗНЫЕ поступки/повороты сюжета (что герой делает дальше), ведущие к разным продолжениям истории. ОБА варианта грамматически верны и естественны. ЗАПРЕЩЕНО делать выбор между правильной и неправильной формой (артикль/падеж/окончание/спеллинг) или между двумя формулировками одного и того же — это не развилка, а квиз. label_target — осмысленное действие в мире истории (напр. «К реке» / «Остаться в лагере»), label_native — его перевод. Языковое задание сцены (expected_target) отдельно и НЕ является выбором ветки. Конкретная чувственная сцена в сфере интересов. is_final=true ТОЛЬКО когда scene_index === max_scenes (последняя сцена акта). До этого — is_final=false ВСЕГДА, история продолжается. На последней сцене заверши историю (is_final=true, без развилки). '+levelPromptBlock(cfg.cefr)+'ГРАММАТИКА СЦЕНЫ (критично): scene_text ОБЯЗАН быть грамматически безупречным — каждый глагол спрягается правильно (ich berechne, не ich berechnen), артикли согласованы, порядок слов верный. УЗУАЛЬНОСТЬ (QUEUE-34, критично): scene_text и expected_target обязаны быть такими, как реально говорит носитель целевого языка — живая, употребимая фраза, а НЕ формально-правильная дословная сборка слов. Перед выдачей перечитай каждое предложение и спроси себя: «так действительно говорят в живой речи?» — если фраза грамматически верна, но неупотребима, переформулируй естественнее. Пример калька↔живое (нем.): «das Ankratzen im Manuell» ❌ → «im Handbetrieb» / «manuell» / «im manuellen Betrieb» ✅. Не заставляй ученика заучивать кальку. SCAFFOLD (обязательно на A1–A2): поле scaffold ВСЕГДА заполняй — каркас expected_target с ___ на месте ключевых слов которые нужно вспомнить/вставить; минимум 1 прочерк. КАРКАС И ВЫБОР (критично): если prompt_for_user предлагает выбор из двух и более слов разного рода/падежа — артикль (der/die/das/den/dem...) НЕЛЬЗЯ выносить за прочерк, он входит в прочерк вместе с существительным («Ich nutze ___.», а НЕ «Ich nutze den ___.»). Прочерк обязан поглощать всё что различается между допустимыми ответами (артикль, род, падежное окончание); видимая часть каркаса одинаково верна для любого допустимого варианта. prompt_for_user ОБЯЗАН быть напрямую связан с содержимым scene_text — спрашивай ТОЛЬКО о том что упомянуто в сцене; ответ пользователя должен быть выводим из текста сцены. Запрещено задавать вопросы о вещах которых нет в тексте. АНТИ-КОЛЛИЗИЯ ПОДСКАЗКИ (QUEUE-36, критично): конструкция/глагол, который задание просит достроить (например «Ich wähle ___», «Ich bezahle ___»), НЕ должна встречаться в scene_text уже достроенной с ДРУГИМ объектом. Если задание просит достроить «Ich wähle (аэропорт/кафе)» — в сцене ЗАПРЕЩЕНО писать «Ich wähle das Ziel»; если просит «Ich bezahle ___» — в сцене не должно быть «Ich bezahle das Ticket». Иначе сцена учит одному завершению, а эталон требует другого, и ответ становится невыводимым из контекста. Перед выдачей проверь: expected_target согласован с тем, как эта конструкция (не) показана в сцене. ЯВНЫЙ НАБОР ОТВЕТОВ (QUEUE-36): если задание — выбор из перечисленных слов (например аэропорт или кафе), prompt_for_user обязан прямо называть этот ограниченный набор («Выберите: аэропорт или кафе?»), а не давать размытое «используя конструкцию Ich wähle ___». prompt_for_user должен быть логически точным на native_lang: если задание про транспорт — «на чём вы едете», не «куда едете»; вопрос должен точно соответствовать ожидаемому ответу. Задание которое пользователь МОЖЕТ выполнить зная только слова урока и конструкции из known_rules. ЗАПРЕЩЕНО использовать технические коды, аббревиатуры, цифровые команды (G01, T010101, CNC-команды и т.п.) как целевые слова — только обычные слова целевого языка. ПЕРЕВОД (native_hint): на A1–A2 переводи корректно по-русски сохраняя ВСЕ смысловые слова оригинала. Служебные глаголы которые в русском опускаются (sein/быть) — опускай ("Ich bin dort" → "Я там", не "Я есть там"). Порядок слов — русский, не немецкий. Если конструкция принципиально не переводится прямо — добавь пояснение в скобках ("stehen здесь = находиться"). В answer_glossary — ВСЕ ключевые слова для ответа с транскрипцией и переводом. СЛОВА ЗАДАНИЯ С АРТИКЛЕМ (критично): в answer_glossary и encountered_words поле term для СУЩЕСТВИТЕЛЬНЫХ целевого языка обязано включать артикль рода в словарной форме (нем.: die Automatik, der Handbetrieb, das Auto). Прилагательным, наречиям, глаголам артикль НЕ добавляется (manuell, schneiden). Если в целевом языке артиклей нет — не добавляется. ПЕРЕВОД В ГЛОССАРИИ ТОЖЕ СЛОВАРНЫЙ (4.31): «das Buch — книга», а НЕ «книгу» по форме из фразы — иначе ученик заучивает падежную форму как исходную. В encountered_words — значимые слова сцены (до 5). translit — ТОЛЬКО буквами native_lang, НЕ приводи пример на другом языке и НЕ копируй письменность этой инструкции.'
      },
      '{"scene_text":"текст сцены на целевом языке (объём по CEFR)","native_hint":"перевод-подсказка на родном","prompt_for_user":"внятное задание на родном: что сказать","expected_target":"эталонная фраза на целевом","scaffold":"каркас предложения с ___ на месте ключевых слов которые нужно подставить (напр. Ich ___ auch mit dem Bus ___), или null если задание простое","answer_glossary":[{"term":"слово нужное для ответа","translit":"[транскрипция]","translation":"перевод"}],"encountered_words":[{"term":"слово на целевом","translit":"[транскрипция]","translation":"перевод"}],"is_branch":false,"choices":[{"id":"A","label_target":"вариант на целевом","label_native":"перевод варианта А на родном"},{"id":"B","label_target":"вариант на целевом","label_native":"перевод варианта Б на родном"}],"is_final":false}');

    attachTapAll(null, [...(sc.encountered_words||[]), ...(sc.answer_glossary||[])]);

    $('#check').onclick = async () => {

      }
      $('#check').disabled = true; $('#fb').className='feedback ok'; $('#fb').textContent='Проверяю…';
      let res = null;
      try {
