          compound_hints: (()=>{ try { return compoundHints(String(correctForm||'')); } catch(_) { return []; } })(),
          allow_creative:true, rules:'Creative Path: проверяй ГРАММАТИКУ и СМЫСЛ КОММУНИКАЦИИ, не точность совпадения с expected_target. Если в answer_glossary слова даны через слэш (Not-Aus / Notschalter) — это синонимы, любой один вариант = correct=true. Если задание — описание местонахождения, действия или ситуации — любой грамматически верный ответ подходящий по смыслу = correct=true, даже если конкретная локация/формулировка отличается от expected_target (например: задание «где G01?» → «в программе», «в станке», «в коде» — все верны если грамматически правильно). Равноценные формы (in dem=im, zum, am) — верны. Мелкие опечатки — верны. Только грубая грамматическая ошибка или полное несоответствие смыслу задания = correct=false. Если есть ошибка — rule_title/rule_summary точно под эту ошибку на native_lang. ТОЧНОСТЬ ГРАММАТИКИ (критично): explanation, rule_summary и rule_table обязаны быть фактически верны — род существительного, падеж и спряжение проверь прежде чем называть; запрещено приписывать существительному неверный род. Если задание — выбор из вариантов (например «ручной режим или автоматика») — любой из предложенных вариантов с грамматически верным артиклем = correct=true. ОШИБКА НАЗЫВАЕТСЯ ИЛИ ЕЁ НЕТ (критично, 4.42): прежде чем признать ответ неверным, сформулируй ошибку ОДНОЙ ясной фразой: что именно не так и как правильно. Если такой фразы не получается, ответ ВЕРЕН. Запрещено выносить вердикт «неверно», а затем подбирать под него объяснение: получается текст, противоречащий сам себе («допустили ошибку в артикле… „zu dem Auto“ верно… но требует правильного сочетания»), и ученик теряет доверие к разбору. Противоречивое объяснение — признак того, что ошибки нет. РАВНОЦЕННЫЕ ФОРМЫ И СИНОНИМЫ (критично, 4.42): слитная и раздельная форма («zum» и «zu dem»), другой порядок слов, синоним того же значения — это НЕ ошибки, а варианты. Ответ засчитывается верным; при желании добавь note о том, какой вариант употребительнее. Ошибкой считается только нарушение грамматики или смысла. ЭТАЛОН МОЖЕТ БЫТЬ НЕВЕРЕН (критично, 4.41): если ответ ученика грамматически правильный, а эталон нет — прав УЧЕНИК. Верни verdict как верный, поставь reference_wrong=true и НЕ показывай эталон как образец: ученик запомнит ошибку как правило. Пример: ученик «Thomas kocht im Alltag», эталон «Thomas kochen im Alltag» — ученик прав, эталон неверен. РАЗНИЦА В ФОРМЕ — НЕ ОПЕЧАТКА (критично, 4.41): расхождение, меняющее лицо, число, род, падеж или артикль, НИКОГДА не называй опечаткой, даже если отличается одна буква. Опечатка — это промах пальцем, а не другая грамматическая форма. НЕВЕРНЫЙ ОТВЕТ НЕ ЗАСЧИТЫВАЕТСЯ (критично, 4.41): если ответ расходится с правильной формой глагола или артиклем — это ошибка, а не «верно». Молча принять неверный ответ хуже, чем показать неверный эталон: ученик не получает даже повода усомниться. ПОЛЕ note (4.31): если ответ верен, заполняй note ТОЛЬКО когда есть заметно более естественная формулировка, и напиши её; если ответ ученика и так хорош — note оставь пустым. Приложение показывает ученику его собственную верную фразу, а note — единственный способ подсказать вариант получше. ПРАВИЛО ОБЯЗАНО ВЫВОДИТЬ ФОРМУ, А НЕ НАЗЫВАТЬ ЕЁ (4.36, критично): если род, падеж или форма эталона следуют из свойства слова — род составного существительного по ПОСЛЕДНЕМУ компоненту (der Modus → der Automatikmodus, при том что die Automatik женского рода и в составе свой род теряет), род по суффиксу (-ung, -heit — женский), чередование основы, — explanation и rule_summary обязаны показать сам вывод. Назвать результат («в винительном мужской род получает den»), не объяснив, откуда взялся мужской род, ЗАПРЕЩЕНО: ученик остаётся ровно с тем вопросом, с которого начал. Перечислять вместо вывода орфографию (заглавная буква, слитное написание) тоже запрещено — это сопутствующий факт, а не причина формы. Если передан compound_hints — код уже разложил составное слово и дал словарную запись последнего компонента; опирайся на неё.' },
          '{"correct":true,"error_type":"spelling|article|word_order|verb_conjugation|vocabulary_gap|none","note":"если ответ верен, но эталон естественнее — как звучит естественнее (на родном); иначе пусто","explanation":"короткий разбор именно этой ошибки на родном","correct_form":"верная фраза","correct_translit":"[транскрипция верной фразы родными буквами]","rule_title":"название правила под ошибку (на родном)","rule_summary":"правило целиком, 2-4 фразы на родном","rule_categories":["одна или несколько из: Артикли, Существительные, Глаголы, Времена, Падежи, Предлоги, Порядок слов, Местоимения, Прочее"],"rule_table":[{"form":"форма","translit":"[транскрипция]","translation":"перевод"}]}');
      } catch(e){}
      $('#check').disabled = false;
      if (!res) { toast('Связь барахлит — ответ засчитан', true); return pass(); }
      if (res.correct) return pass(a, res);   // QUEUE-74: хвалим фразу ученика, не эталон
      Q.errors++; cfg.onError && cfg.onError();
      const qTr = (res && res.correct_translit) ? ` <span style="color:var(--orange)">${esc(res.correct_translit)}</span>` : '';
      if (Q.errors >= 2) { // Graceful Exit: напарник даёт ответ с мнемоникой
        $('#fb').className='feedback ok';
        $('#fb').innerHTML = `🤝 Я подскажу как напарник: <b>${esc(res?.correct_form||correctForm)}</b>${qTr}` + sayBtn(res?.correct_form||correctForm) + `<br>🧠 ${esc(res?.explanation||'Запомните эту конструкцию — она встретится снова.')}`;
        speak(res?.correct_form||correctForm, p.targetLang);
        showErrorRule(res);
        $('#check').textContent = isFinal ? 'Завершить квест' : 'Дальше';
        $('#check').onclick = () => advance(sc, isFinal, true);
        return;
      }
      mustRetype = true; correctForm = res?.correct_form || correctForm || a;
      $('#fb').className='feedback bad';
      $('#fb').innerHTML = `❌ ${esc(res?.explanation||'Есть ошибка, попробуйте ещё раз.')}<br>Сверьте: ${highlightDiff(a, correctForm)}${qTr}` + sayBtn(correctForm) + ` — запомните и введите вручную.`;
      speak(correctForm, p.targetLang);
      showErrorRule(res);   // точное правило под ошибку — сразу
      $('#ans').value=''; $('#ans').focus();
    };
    /* QUEUE-74 (4.31): при верном ответе показываем ФРАЗУ УЧЕНИКА, а не эталон. Раньше экран
       рисовал expected_target — и если эталон был хуже (например «Ich kaufe Buch» без артикля),
       приложение хвалило и тут же переучивало на кривую фразу. Эталон приходит только через
       note проверки, то есть когда модель сама сказала, что так естественнее. */
    function pass(userAns, res) {
      $('#fb').className='feedback ok';
      const shown = (userAns && String(userAns).trim()) ? String(userAns).trim() : correctForm;
      const note = (res && res.note) ? `<br><span style="color:var(--orange);font-size:13px">💡 ${esc(res.note)}</span>` : '';
      $('#fb').innerHTML = shown ? `✅ Отлично! <b>${esc(shown)}</b>` + sayBtn(shown) + note : `✅ Отлично!`;
      // QUEUE-45: после верного ответа лампочка бессмысленна и затирает #fb (в т.ч. кнопки развилки) — прячем её.
      { const _qh = document.getElementById('qhint'); if (_qh) _qh.style.display='none'; }
      if (sc.is_branch && !isFinal && Array.isArray(sc.choices) && sc.choices.length>=2) {
        Q.branchesUsed++;
        $('#fb').innerHTML += `<div style="margin-top:10px">Развилка — что делаем дальше?</div>` +
          sc.choices.slice(0,2).map(c=>`<button class="opt" style="margin-top:8px;text-align:left" data-c="${esc(c.id)}"><b>${esc(c.label_target)}</b>${c.label_native?`<br><span style='font-size:12px;color:var(--dim)'>${esc(c.label_native)}</span>`:''}</button>`).join('');
        document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ Q.choice=b.dataset.c; advance(sc,false,false); });
        $('#check').style.display='none';
      } else {
        $('#check').textContent = isFinal ? 'Завершить квест' : 'Дальше';
        $('#check').onclick = () => advance(sc, isFinal, false);
      }
    }
  }
  function advance(sc, isFinal, partner) {
    // QUEUE-30: включаем выбор ветки в summary, чтобы Gemini продолжал выбранную линию
    const choiceNote = Q.choice ? ` [Пользователь выбрал: вариант ${Q.choice} — ${(sc.choices||[]).find(c=>c.id===Q.choice)?.label_target||Q.choice}]` : '';
    /* 4.43: в предысторию идёт ТОЛЬКО последняя сцена, а не склейка всех прошлых. Раньше
       накапливались 700 символов подряд идущих сцен, и модель, видя перед собой связный кусок
       рассказа, продолжала его пересказом — ученик читал одно и то же по три раза, а объём
       чтения рос от сцены к сцене. Модели достаточно знать, на чём остановились. */
    Q.summary = (String(sc.scene_text||'') + choiceNote).slice(-400);
    if (isFinal) {
      if (L) { delete L.qResume; LessonCache.save(); }   // QUEUE-46: квест пройден — позицию не храним
      Screen.show(`
        <div class="eyebrow">Квест завершён</div>
        <h1>${Q.errors>=2?'🤝 Дошли вместе!':'🏆 История пройдена!'}</h1>
        <p class="sub">${Q.errors>=2?'Ошибки — часть пути: трудные места вернутся в повторение.':'Лексика урока закреплена в живом сюжете.'}</p>
        <button class="btn btn-primary" id="go">Продолжить</button>`);
      $('#go').onclick = cfg.onDone;
    } else {
      Q.scene++; if (!sc.is_branch) Q.choice = null;
      nextScene();   // позицию пишет saveQuestPos() внутри nextScene (единая точка, 4.29)
    }
  }
}

/* =====================================================================
   ЗАВЕРШЕНИЕ УРОКА: автосохранение (5.1) + диагностика-адаптация (2.7)
   «Gemini советует — приложение решает»; защита с откатом к метрикам.
   ===================================================================== */
const DIAG_TYPES  = ['recognition','spelling','verb_conjugation','word_order','vocabulary_gap','none'];
const DIAG_TRENDS = ['improving','stable','declining'];

async function finishLesson() {
  LessonCache.clearLesson(L.code);   // урок завершён — снимок больше не нужен
  const acc = L.ft.total ? +(L.ft.ok / L.ft.total).toFixed(2) : 1;
  // QUEUE-62: сравниваем с последним замером, а не с последней записью: разговор точности не даёт.
  const scoredPrev = DB.analytics.filter(x => typeof x.accuracy_first_try === 'number');
  const prev = scoredPrev.length ? scoredPrev[scoredPrev.length-1].accuracy_first_try : null;
  const hard = Object.keys(L.wordErr).filter(t => L.wordErr[t] >= 2);

  // --- 1) Сбор: запись слов в «Словарь» ---
  L.words.forEach(w => {
    if (!DB.vocab.some(v => norm(v.term)===norm(w.term))) {
      DB.vocab.push({ term:w.term, translation:w.translation, translit:w.translit||'', emoji:w.emoji||'',
        part_of_speech: w.part_of_speech||'', article: w.article||'',
        is_irregular: !!w.is_irregular, forms: w.forms || w.irregular_forms || '', irregular_forms: w.irregular_forms||'',
        lesson: L.code, errors: L.wordErr[w.term]||0,
        status: (L.wordErr[w.term]||0) >= 2 ? 'на закреплении' : 'новое',
        mnemonic:'', date_added: today(), date_review: today(),
        srs_stage: 0, srs_due: _dayNum() + SRS_GAP[0] });   // 4.27: свежее слово → на лестницу, показ через 1 день
    }
  });
  hard.forEach(t => { if (!DB.reviewQueue.includes(t)) DB.reviewQueue.push(t); });
  // 4.27: старое авто-«освоено» (0 ошибок за один урок) УБРАНО — это оперативная память, не долговременная.
  //       Единственный вход в «освоено» теперь — вершина лестницы 1/3/7/30 (SRS.review).
  Core.markIssued(L.words);   // 4.26: слово переехало из Ядра в Словарь — обратно не возвращается

  // 4.27: итог повторения — двигаем ступени слов, показанных в Recap этого урока.
  //       Верно (0 ошибок на слове) → ступень выше; ошибка → сброс на день 1. Вершина → «освоено».
  (L.reviewWords || []).forEach(rw => {
    const v = DB.vocab.find(x => norm(x.term) === norm(rw.term));
    if (v) SRS.review(v, (L.wordErr[rw.term] || 0) === 0);
  });

  // 4.26 (раздел 2.7): выход из очереди повторения — два урока подряд без ошибок на слове.
  // До 4.26 очередь чистил только Суперквест и она росла монотонно, размывая повторение.
  const met = [...L.words.map(w=>w.term), ...((L.reviewWords||[]).map(w=>w.term))];
  [...new Set(met)].forEach(t => {
    const v = DB.vocab.find(x => norm(x.term)===norm(t));
    if (!v) return;
    if ((L.wordErr[t]||0) > 0) { v.cleanStreak = 0; return; }     // ошибка — счётчик обнуляется
    if (!DB.reviewQueue.includes(v.term)) return;
    v.cleanStreak = (v.cleanStreak||0) + 1;
    if (v.cleanStreak >= 2) {
      // 4.27: уход из СРОЧНОГО слоя ≠ «освоено». Слово возвращается на спокойную лестницу и крутится по датам.
      DB.reviewQueue = DB.reviewQueue.filter(x => x !== v.term);
      v.cleanStreak = 0;
      if (v.status === 'на закреплении') v.status = 'новое';
      if (v.status !== 'освоено' && !SRS.onLadder(v)) SRS.initLearned(v);   // не было расписания (старое слово) → на лестницу; вершину не трогаем
    }
  });

  // --- 2) Диагностика (Gemini, строго из словаря категорий) ---
  Screen.loader('Сохраняю и анализирую урок…');
  let diag = null;
  try {
    const d = await Gemini.call({ task:'diagnose', native_lang:DB.profile.nativeLang, cefr:curCefr(),
      summary:{ accuracy_first_try:acc, errors_by_type:L.errors, hard_words:hard, prev_accuracy:prev } },
      '{"dominant_error_type":"recognition|spelling|verb_conjugation|word_order|vocabulary_gap|none","risk_words":["..."],"confidence_trend":"improving|stable|declining","note_native":"1 короткое предложение на родном языке"}');
    if (DIAG_TYPES.includes(d.dominant_error_type) && DIAG_TRENDS.includes(d.confidence_trend)) diag = d;
  } catch(e){} // откат к чистым метрикам — обучение не блокируется

  // --- 3) Действие: жёсткие правила в коде ---
  (diag?.risk_words||[]).forEach(t => { if (DB.vocab.some(v=>norm(v.term)===norm(t)) && !DB.reviewQueue.includes(t)) DB.reviewQueue.push(t); });
  let next = nextAfterLesson(L.code), note = 'PASS';
  if (acc < 0.70) {                                   // слабый результат: идём дальше, но усиливаем повторение
    note = 'REVIEW';
    L.words.forEach(w => { if (!DB.reviewQueue.includes(w.term)) DB.reviewQueue.push(w.term); });
    DB.vocab.forEach(v => { if (L.words.some(w=>norm(w.term)===norm(v.term))) v.status = 'на закреплении'; });
  }

  // --- листы «Прогресс» и «Аналитика» ---
  DB.progress.push({ code:L.code, date:today(), words:L.words.map(w=>w.term).join(', '), next, note });
  DB.analytics.push({ lesson:L.code, date:today(), accuracy_first_try:acc, errors_by_type:L.errors,
    hard_words:hard, duration_sec: Math.round((Date.now()-L.t0)/1000), hints_used:L.hints,
    delta_accuracy: prev==null ? '' : ((acc-prev)>=0?'+':'')+ (acc-prev).toFixed(2) });
  DB.nextStage = next;
  DB.profile.cefr = parseCode(next.startsWith('EXAM_') ? next.replace('EXAM_','')+'.01' : next)?.lvl || DB.profile.cefr;
  Storage.save(DB);
  toast('Сохранено ✓');

  // --- завершающий экран (5.1): простая фраза, крупные кнопки ---
  const code = L.code, hintsUsed = L.hints; L = null;
  Screen.show(`
    <div class="eyebrow">Точность: ${Math.round(acc*100)}% · подсказок: ${hintsUsed}</div>
    <h1>Урок ${esc(code)} завершён, прогресс сохранён.</h1>
    <p class="sub">${diag?.note_native ? '💡 '+esc(diag.note_native) : (note==='REVIEW' ? 'Точность ниже 70% — лексика урока добавлена в усиленное повторение, но движемся вперёд.' : 'Что дальше?')}</p>
    ${hard.length?`<div class="chiplist">${hard.map(h=>`<span class="chip warn">⚠️ ${esc(h)}</span>`).join('')}</div><p class="note">Эти слова вернутся в Повторение и Суперквест.</p>`:''}
    <div style="height:8px"></div>
    <button class="btn btn-primary" id="bNext">${next.startsWith('EXAM_')?'Экзамен '+esc(next.replace('EXAM_','')):'Следующий урок '+esc(next)}</button>
    <button class="btn btn-ghost" id="bSuper">Суперквест (повторение)</button>
    ${IS_APPLE ? '' : `<button class="btn btn-ghost" id="bTalk">🎙️ Поговорить</button>`}
    <button class="btn btn-ghost" id="bExit">Выход в меню</button>`);
  $('#bNext').onclick  = () => next.startsWith('EXAM_') ? startExam(next) : startLesson(next);
  $('#bSuper').onclick = startSuperLesson;
  if ($('#bTalk')) $('#bTalk').onclick = startDialogue;
  $('#bExit').onclick  = mainMenu;
}

/* =====================================================================
   СУПЕРКВЕСТ (раздел 6, версия 4.15) — заменяет прежний «Супер-урок».
   Один цельный квест-погружение на 30–50 предложений вместо набора
   отдельных заданий: история разбита на 3–5 актов по CEFR, между актами —
   экран-итог (не сюжетный). Развилки не фиксированы числом — расставляет
   генерация истории по логике повествования (не больше 1–2 за акт).
   Лексика: 80% known_vocab / 20% новая служебная; баланс бытовое/интересы
   по CEFR. Anti-Frustration (Q.errors) обнуляется в начале каждого акта;
   итоговая точность (L.ft) — нет, копится за весь Суперквест.
   Движок переиспользует контракт quest_step (раздел 5.A, 2.5), расширенный
   полями act_index/acts_total/branches_used_in_act/branch_limit_in_act и
   ответным полем is_act_final (отдельно от is_final — конец ВСЕЙ истории).
   ===================================================================== */
// Шкала актов и общего объёма истории по CEFR (раздел 6.3)
const SUPERQUEST_ACTS   = { A1:3, A2:3, B1:4, B2:4, C1:5, C2:5 };
const SUPERQUEST_SCENES = { A1:30, A2:34, B1:40, B2:44, C1:50, C2:50 };
function splitScenesAmongActs(total, acts) {
  const base = Math.floor(total/acts), rem = total % acts;
  return Array.from({length:acts}, (_,i) => base + (i < rem ? 1 : 0));
}
// Тап-перевод: оборачивает встречающиеся в тексте сцены слова в кликабельные span'ы.
// Список 📒 «Слова задания» НЕ заменяется этим — тапы добавляются как дополнительный способ (раздел 6.5).
function tapWordsHTML(text, words) {
  let html = esc(text);
  const list = (words||[]).filter(w=>w && w.term).slice().sort((a,b)=>b.term.length-a.term.length);
  const used = new Set(), final = [];
  list.forEach(w => {
    const key = norm(w.term); if (used.has(key)) return;
    const escTerm = String(w.term).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    let re; try { re = new RegExp('('+escTerm+')','i'); } catch(_) { return; }
    if (re.test(html)) {
      used.add(key);
      const idx = final.length;
      html = html.replace(re, `<span class="tapword" data-tw="${idx}">$1</span>`);
      final.push(w);
    }
  });
  return { html, words: final };
}
// Служебные слова — не кликабельны при тапе всех слов в квестах
/* QUEUE-69 (4.31): список TAP_SKIP удалён. Служебные слова (артикли, союзы, предлоги,
   частицы, местоимения) исключались из тапа с v41, чтобы не засорять Словарь «встреченными»
   der и und. Ядро языка (v64) сняло эту цену: закрытые классы уже лежат локально с переводом
   и транскрипцией, тап отвечает без запроса и без записи в Словарь. Спека 4.28 требует тап
   на всех словах, включая служебные, — теперь это выполняется и в тексте сцены, не только
   в наборе «Собери фразу». Части речи закрытых классов в Словарь не пишутся. */
const CLOSED_POS = new Set(['pron','prep','conj','part','art','det','particle','pronoun','preposition','conjunction']);

// QUEUE-61: откуда пришло слово, тапнутое вне урока ('dialogue' в режиме «Поговорить»).
// Ставится при входе в режим, снимается при выходе; null → прежнее поведение ('quest').
let TAP_ORIGIN = null;

// Разбить текст на кликабельные токены (все слова, кроме служебных)
function tapAllWordsHTML(text) {
  if (!text) return '';
  // Токенизация: слова и не-слова (пунктуация, пробелы)
  const tokens = text.match(/[\wÄäÖöÜüß\u00C0-\u024F\u0400-\u04FF]+|[^\wÄäÖöÜüß\u00C0-\u024F\u0400-\u04FF]+/g) || [];
  return tokens.map(tok => {
    if (/^[\wÄäÖöÜüß\u00C0-\u024F\u0400-\u04FF]+$/.test(tok) && !/^_+$/.test(tok)) {
      return `<span class="tapword tapall" data-word="${esc(tok)}">${esc(tok)}</span>`;
    }
    return esc(tok);
  }).join('');
}

// Поиск слова: сначала словарь, потом Gemini
/* =====================================================================
   4.32 — КАРТОЧКА ТАПНУТОГО СЛОВА (QUEUE-75, QUEUE-76, QUEUE-77; билд v74)
   Прогон Суперквеста SUPER_A1.1.13 вскрыл три связанных дефекта тап-перевода:
   (1) КОНТЕКСТ НЕ ПЕРЕДАВАЛСЯ. Контракт translate_word получал голый токен без
       предложения — межъязыковой омограф разрешался наугад: тап по «plant»
       (форма нем. planen) вернул английское чтение «die Pflanze / растение».
   (2) ЗАГОЛОВОК БРАЛСЯ ОТ МОДЕЛИ. Попап рисовал term ИЗ ОТВЕТА, а не тапнутый
       токен, поэтому подмена слова доходила до экрана; дальше 📘 разбирал уже
       подменённое слово и честно отвечал «„die Pflanze“ нет в тексте». Ошибка
       ещё и уходила в Словарь как «встреченное» и попадала в очередь SRS.
   (3) РАЗБОР ТРЕБОВАЛ ВТОРОГО ТАПА. Неопределённая форма глагола, множественное
       число, формы неправильного глагола открывались только через 📘.
   Лечение по конституции: привязка карточки к тапнутому токену и проверка
   родства словарной формы — код; содержание карточки — Gemini. Карточка
   заполняется одним запросом и кэшируется в Словаре навсегда.
   ===================================================================== */
const TAP_CARD_V = 2;                       // версия схемы карточки; запись старее — дозаполняется на месте
const stripArtG = x => String(x||'').trim().replace(/^(der|die|das|ein|eine)\s+/i,'');

const TAP_CARD_SCHEMA = '{"surface":"форма ровно как в тексте","term":"словарная форма","translit":"[транскрипция буквами native_lang]",'
  + '"translation":"перевод формы из текста на native_lang","part_of_speech":"noun|verb|adj|adv|pron|prep|conj|part|other",'
  + '"morph":"одна короткая строка о форме на native_lang или пусто","forms":"три формы неправильного глагола или пусто","is_irregular":true}';

const TAP_CARD_RULES =
    'КОНТЕКСТ (критично): слово word стоит в предложении sentence и является словом target_lang. Разбирай его ТОЛЬКО как слово target_lang в этом предложении. '
  + 'ЗАПРЕЩЕНО читать его как слово другого языка, даже если написание совпадает: нем. «plant» — форма глагола planen («планирует»), а НЕ английское plant («растение»). Если sentence пуст — всё равно считай word словом target_lang. '
  + 'surface — ровно та форма, что стоит в тексте, без изменений. '
  + 'term — словарная форма: существительное с артиклем рода (das Buch), глагол в неопределённой форме (planen), прилагательное в начальной форме. Если форма из текста и есть словарная — повтори её. '
  + 'translation — перевод формы так, как она стоит в предложении («планирует», а не «планировать»). '
  + 'morph — ОДНА короткая строка на native_lang об этой форме, простыми словами, БЕЗ лингвистических терминов (запрещены «падеж», «спряжение», «инфинитив», «аккузатив»). Для глагола: словарная форма с переводом и лицо/время — «planen — планировать; здесь: он/она/оно, настоящее время». Для существительного: множественное число — «мн. ч.: die Abenteuer». Для прилагательного/наречия: степени сравнения, если они особые («groß — größer — am größten»), иначе пусто. Для служебного слова — пусто. '
  + 'forms — ТОЛЬКО для неправильного глагола: три основные формы («fahren – fuhr – ist gefahren»). Для правильного глагола и других частей речи — пустая строка. is_irregular — true только для неправильного глагола. '
  + 'ТРАНСКРИПЦИЯ (критично): translit — буквами native_lang, без знаков IPA, и передаёт звучание формы surface. Перед выдачей сверь звук за звуком: КАЖДЫЙ согласный слова surface обязан быть отражён в транскрипции. Пропуск согласной — брак: Abenteuer → [абэнтойэр], а НЕ [абэнойэр].';

/* QUEUE-76: словарная форма обязана быть родственна тапнутому токену. Это гарантия кода,
   а не просьба к модели: приложение знает, по чему тапнули, и не имеет права показать
   вместо этого другое слово. Проверка нарочно терпима к аблауту (liest → lesen):
   помимо общего начала принимается совпадение по полю forms из Ядра языка/Словаря. */
function tapRelated(tapped, dict) {
  const a = norm(stripArtG(tapped)), b = norm(stripArtG(dict));
  if (!a || !b) return false;
  if (a === b || a.indexOf(b) === 0 || b.indexOf(a) === 0) return true;
  let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
  if (i >= 3) return true;                                    // общий корень: plant ↔ planen
  try {                                                       // аблаут/супплетивизм — по локальным формам
    const pool = [].concat((typeof Core!=='undefined' && Core.list) ? Core.list() : [], (DB && DB.vocab) || []);
    const rec = pool.find(w => w && w.term && norm(stripArtG(w.term)) === b);
    if (rec && rec.forms) {
      const esc0 = a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      if (new RegExp('(^|[^\\wÄäÖöÜüß])' + esc0 + '([^\\wÄäÖöÜüß]|$)').test(norm(rec.forms))) return true;
    }
  } catch(_) {}
  return false;
}

// Совпадение записи с тапнутым токеном: словарная форма, форма без артикля или запомненная словоформа
function tapMatch(rec, t) {
  if (!rec || !rec.term) return false;
  return norm(rec.term) === norm(t) || norm(stripArtG(rec.term)) === norm(stripArtG(t))
      || (Array.isArray(rec.surfaces) && rec.surfaces.indexOf(norm(t)) >= 0);
}

// Запись сделана до 4.32 (нет морфологии) — её надо дозаполнить. Служебные слова пропускаем:
// закрытые классы полностью описаны в Ядре языка (v64), контекст даёт 📘.
function tapNeedsCard(w) {
  if (!w || w.mv >= TAP_CARD_V) return false;
  return !CLOSED_POS.has(String(w.part_of_speech||'').toLowerCase());
}

async function fetchWordCard(token, sentence, strict) {
  const p = DB.profile;
  let out = null;
  try {
    out = await Gemini.call({
      task:'translate_word', target_lang:p.targetLang, native_lang:p.nativeLang,
      word: token, sentence: sentence || '',
      rules: TAP_CARD_RULES + (strict
        ? ' ПОВТОРНАЯ ПОПЫТКА: прошлый ответ дал словарную форму, не связанную со словом «'+token+'». «'+token+'» — слово target_lang из sentence; верни term, формой которого «'+token+'» действительно является.'
        : '')
    }, TAP_CARD_SCHEMA);
  } catch(e) { return null; }
  if (!out || typeof out !== 'object') return null;
  out.surface = token;                       // гарантия кода: карточка всегда о тапнутом токене
  out.mv = TAP_CARD_V;
  if (out.term && !tapRelated(token, out.term)) {
    if (!strict) return await fetchWordCard(token, sentence, true);
    out.term = ''; out.morph = ''; out.forms = ''; out.unverified = true;   // непроверяемое не показываем и не храним
  }
  return out;
}

function mergeWordCard(w, f) {
  ['term','surface','translit','translation','part_of_speech','morph','forms'].forEach(k => { if (f[k]) w[k] = f[k]; });
  if (typeof f.is_irregular === 'boolean') w.is_irregular = f.is_irregular;
  if (f.unverified) w.unverified = true; else w.mv = f.mv;
}

// Запись «встреченного» в Словарь. Служебные слова не пишем (QUEUE-69);
// непроверенную словарную форму не пишем тем более (QUEUE-76) — иначе SRS учит чужому слову.
function saveTappedWord(w, tapped) {
  try {
    if (!w || !w.term || w.unverified) return;
    if (CLOSED_POS.has(String(w.part_of_speech||'').toLowerCase())) return;
    const ex = DB.vocab.find(v => norm(v.term) === norm(w.term) || norm(stripArtG(v.term)) === norm(stripArtG(w.term)));
    const rec = ex || { term:w.term, translation:'', translit:'', emoji:'', part_of_speech:'', is_irregular:false,
      forms:'', morph:'', lesson: L ? L.code : (TAP_ORIGIN || 'quest'), errors:0, status:'встреченное',
      mnemonic:'', date_added:today(), date_review:today() };
    // старая запись (нет mv) чинится целиком: транскрипция v73 могла потерять согласную
    const repair = !(rec.mv >= TAP_CARD_V);
    ['translit','translation','part_of_speech','forms','morph'].forEach(k => { if (w[k] && (repair || !rec[k])) rec[k] = w[k]; });
    if (typeof w.is_irregular === 'boolean') rec.is_irregular = w.is_irregular;
    rec.mv = TAP_CARD_V;
    const sf = norm(tapped||'');
    if (sf && sf !== norm(stripArtG(rec.term))) rec.surfaces = [...new Set([...(rec.surfaces||[]), sf])].slice(0,8);
    if (!ex) DB.vocab.push(rec);
    Storage.save(DB);
  } catch(_) {}
}

// Поиск слова: сначала локальные источники, потом Gemini
async function lookupAndShowWord(raw, anchorEl, sceneWords) {
  const term = raw.replace(/[.,!?;:"'«»()]/g,'').trim();
  if (!term) return;
  // explain_element: контекст для кнопки «почему так?» — целевое предложение из контейнера сцены
  const ctx = (anchorEl && anchorEl.closest('.target'))
    ? anchorEl.closest('.target').textContent.replace(/🔊/g,'').replace(/\s+/g,' ').trim()
    : '';
  // QUEUE-19: добавляем sceneWords в кэш сцены
  if (sceneWords && L) { if (!L.encounteredCache) L.encounteredCache = []; sceneWords.forEach(w=>{ if(w&&w.term&&!L.encounteredCache.find(x=>norm(x.term)===norm(w.term))) L.encounteredCache.push(w); }); }
  // 1. Слова ТЕКУЩЕЙ сцены — контекст важнее общего словаря (QUEUE-19: иначе 'plane' → 'самолёт')
  const sc0 = Array.isArray(sceneWords) ? sceneWords.find(w => tapMatch(w, term)) : null;
  if (sc0 && (sc0.translit || sc0.translation)) { showTapPopup(sc0, anchorEl, ctx, term); return; }
  // 2. Словарь пользователя. Показываем только полную запись; неполную дозаполняет Gemini.
  const found = DB.vocab.find(v => tapMatch(v, term));
  if (found && (found.translit || found.translation)) { showTapPopup(found, anchorEl, ctx, term); return; }
  // 3. encountered_words текущего урока (сохранены в L.encounteredCache)
  const enc = (L && L.encounteredCache) ? L.encounteredCache.find(w => tapMatch(w, term)) : null;
  if (enc && (enc.translit || enc.translation)) { showTapPopup(enc, anchorEl, ctx, term); return; }
  // 4. Ядро языка (QUEUE-69): закрытые классы — предлоги, союзы, частицы, местоимения, артикли —
  // сгенерированы при создании профиля и лежат локально. Тап по служебному слову отвечает
  // мгновенно, без запроса к Gemini и без записи в Словарь. Контекстное значение — по 📘.
  const inCore = (typeof Core!=='undefined' && Core.list) ? Core.list().find(w => tapMatch(w, term)) : null;
  if (inCore && (inCore.translit || inCore.translation)) { showTapPopup(inCore, anchorEl, ctx, term); return; }
  // 5. Запрашиваем Gemini — показать нечего, ждём под лоадером
  const bar = document.getElementById('tapOverlay'); if (bar) bar.remove();
  const loading = document.createElement('div'); loading.id = 'tapOverlay';
  loading.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;justify-content:center;pointer-events:none';
  loading.innerHTML = `<div style="pointer-events:auto;width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:12px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 -4px 24px rgba(0,0,0,.4)"><span style="color:var(--faint);font-size:14px">🔍 ${esc(term)}…</span></div>`;
  document.body.appendChild(loading);
  const w = await fetchWordCard(term, ctx);
  loading.remove();
  if (!w) { showTapPopup({ term:'', surface:term, translit:'', translation:'?' }, anchorEl, ctx, term); return; }
  saveTappedWord(w, term);
  showTapPopup(w, anchorEl, ctx, term);
}

// Подключить тап-обработчики на все .tapall в контейнере
function attachTapAll(container, _sceneWords) {
  (container || document).querySelectorAll('.tapall').forEach(el => {
    el.onclick = e => { e.stopPropagation(); lookupAndShowWord(el.dataset.word, el, _sceneWords); };
  });
}

/* Тело карточки (4.32). Порядок строк фиксирован: слово → транскрипция → перевод →
   форма → формы неправильного глагола. Заголовок — тапнутый токен; словарная форма
   рядом в скобках. Для существительного, тапнутого в словарной форме, заголовком
   служит форма с артиклем (правило v53), скобка не дублируется. */
function tapCardRows(w, tok, tts, whyBtn) {
  const dict = w.term ? String(w.term) : '';
  const same = dict && norm(stripArtG(dict)) === norm(stripArtG(tok));
  const head = same ? dict : tok;
  const paren = (dict && !same) ? ` <span style="color:var(--faint);font-weight:400;font-size:14px">(${esc(dict)})</span>` : '';
  const morph = w.morph ? `<div style="margin-top:5px;color:var(--faint);font-size:12px;line-height:1.45">${esc(w.morph)}</div>` : '';
  const forms = w.forms ? `<div style="margin-top:3px;color:var(--faint);font-size:12px;line-height:1.45">${w.is_irregular?'⚡ ':''}${esc(w.forms)}</div>` : '';
  return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-weight:600;font-size:15px">${esc(head)}${paren}</span>
      ${tts}
      <span style="color:var(--orange);font-size:13px;flex:1">${esc(w.translit||'')}</span>
      ${whyBtn}
      <button id="tapClose" aria-label="Закрыть" style="background:none;border:none;font-size:18px;line-height:1;color:var(--faint);cursor:pointer;padding:0">✕</button>
    </div>
    <div style="margin-top:4px;font-size:13px;line-height:1.45">${esc(w.translation||'')}</div>${morph}${forms}`;
}

function showTapPopup(w, anchorEl, ctx, tapped) {
  // QUEUE-18: попап рядом со словом, не снизу экрана
  if (!w || !(w.term || w.surface)) return;
  const tok = tapped || w.surface || w.term;
  let old = document.getElementById('tapOverlay'); if (old) old.remove();
  const popup = document.createElement('div');
  popup.id = 'tapOverlay';
  const tts = hasTTS(DB.profile.targetLang)
    ? `<button id="tapSay" aria-label="Озвучить" style="background:none;border:none;font-size:18px;cursor:pointer;padding:0 2px;flex-shrink:0">🔊</button>`
    : '';
  // explain_element: кнопка «почему так?» — только когда есть контекст предложения (тап внутри сцены)
  const whyBtn = ctx
    ? `<button id="tapWhy" aria-label="Объяснить почему так" title="Почему так?" style="background:none;border:none;font-size:16px;cursor:pointer;padding:0 2px;flex-shrink:0">📘</button>`
    : '';
  popup.innerHTML = `<div id="tapBody"></div>`
    + `<div id="tapWhyBox" style="display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--line,#333);font-size:13px;line-height:1.5"></div>`;
  popup.style.cssText = [
    'position:fixed',
    'z-index:200',
    'max-width:320px',
    'background:var(--panel,#1e2130)',
    'border:1px solid var(--line,#333)',
    'border-radius:12px',
    'padding:10px 14px',
    'box-shadow:0 4px 24px rgba(0,0,0,.6)',
    'backdrop-filter:blur(8px)',
    '-webkit-backdrop-filter:blur(8px)',
    'pointer-events:auto'
  ].join(';');
  document.body.appendChild(popup);
  // Позиционирование относительно тапнутого слова (переиспользуемое — попап может вырасти после раскрытия правила)
  const rect = anchorEl ? anchorEl.getBoundingClientRect() : {top:window.innerHeight/2, left:window.innerWidth/2, bottom:window.innerHeight/2, width:0};
  const margin = 8;
  function clampPopup() {
    const pw = popup.offsetWidth || 280;
    const ph = popup.offsetHeight || 60;
    // По горизонтали: центрируем над словом, не выходим за края
    let left = rect.left + rect.width/2 - pw/2;
    left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
    // По вертикали: если слово в верхней половине — попап под словом, иначе — над
    let top = (rect.bottom < window.innerHeight / 2) ? rect.bottom + margin : rect.top - ph - margin;
    top = Math.max(margin, Math.min(top, window.innerHeight - ph - margin));
    popup.style.left = left + 'px';
    popup.style.top  = top  + 'px';
  }
  // Перерисовка тела: карточка может дозаполниться морфологией уже после открытия
  function render() {
    const body = popup.querySelector('#tapBody');
    if (!body) return;
    body.innerHTML = tapCardRows(w, tok, tts, whyBtn);
    const sayEl = popup.querySelector('#tapSay');
    if (sayEl) sayEl.onclick = () => speak(w.surface || w.term, DB.profile.targetLang);
    popup.querySelector('#tapClose').onclick = () => popup.remove();
    // explain_element разбирает ТУ форму, по которой тапнули, а не словарную (QUEUE-76)
    const whyEl = popup.querySelector('#tapWhy');
    if (whyEl) whyEl.onclick = () => explainElement(tok, ctx, popup, clampPopup);
    clampPopup();
  }
  render();
  // QUEUE-77: разбор формы не требует второго тапа. Если запись сделана до 4.32 —
  // карточка дозаполняется в фоне и обновляется на месте; экран не блокируется.
  if (tapNeedsCard(w)) {
    (async () => {
      const fresh = await fetchWordCard(tok, ctx);
      if (!fresh) return;
      mergeWordCard(w, fresh);
      saveTappedWord(w, tok);
      if (document.getElementById('tapOverlay') === popup) render();
    })();
  }
  // Закрывать при тапе вне попапа
  setTimeout(() => { document.addEventListener('click', function h(e){ if(!popup.contains(e.target)){popup.remove(); document.removeEventListener('click',h);} }); }, 50);
}

// explain_element (спецификация 4.22): второй уровень тап-попапа — объяснение, почему слово/форма стоит в предложении именно так.
// Перевод даётся мгновенно (первый уровень); правило подтягивается только по тапу 📘 — лишний запрос к Gemini лишь по факту нажатия (RPM не страдает).
async function explainElement(term, sentence, popup, reposition) {
  const box = popup.querySelector('#tapWhyBox');
  const btn = popup.querySelector('#tapWhy');
  if (!box) return;
  if (box.dataset.loaded === '1') {          // повторный тап — сворачиваем/разворачиваем
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
    if (reposition) reposition();
    return;
  }
  box.style.display = 'block';
  box.style.maxHeight = '42vh'; box.style.overflowY = 'auto';
  box.innerHTML = `<span style="color:var(--faint)">📘 Разбираю…</span>`;
  if (btn) btn.disabled = true;
  if (reposition) reposition();
  const p = DB.profile;
  let r = null;
  try {
    r = await Gemini.call({
      task:'explain_element', target_lang:p.targetLang, native_lang:p.nativeLang, cefr:curCefr(),
      sentence: sentence, element: term,
      rules:'Объясни на native_lang, ПОЧЕМУ слово/форма «'+term+'» стоит В ЭТОМ предложении (sentence) именно так. '
        + 'КРИТИЧНО (QUEUE-41): разбирай ровно ту форму, что в sentence. Если в sentence у слова НЕТ артикля — не объясняй артикль, которого нет («Мы используем den» запрещено, если в sentence нет den). Если форма в sentence отличается от словарной — объясняй именно форму из sentence. Поле example — это ДРУГОЕ предложение, его грамматика может отличаться от sentence; НЕЛЬЗЯ переносить разбор примера на sentence и выдавать грамматику примера за объяснение исходной фразы. Если пример показывает иную форму (напр. с артиклем, когда в sentence его нет) — упомяни это только как явный контраст («а в другом случае…»), но explanation и detail всегда строго про sentence. '
        + 'СТРОГО БЕЗ лингвистических терминов — аудитория дети и взрослые без подготовки. Запрещены слова: «падеж/аккузатив/датив/родительный», «нулевой/определённый/неопределённый артикль», «абстрактное существительное», «спряжение», «отделяемая приставка», «адвербиальный/наречный оборот», «предложное управление». Заменяй смыслом: «слово-свойство» вместо «абстрактное существительное»; «здесь артикль не нужен» вместо «нулевой артикль»; «отвечает на вопрос как?» вместо «наречный оборот»; «кусочек глагола уехал в конец» вместо «отделяемая приставка». '
        + 'Верни ДВА уровня. explanation — короткая суть, 1–2 предложения простыми словами (показывается сразу). detail — развёрнутый разбор по структуре: (1) почему именно так в sentence, из чего вытекает по смыслу; (2) 2–3 примера ТОЙ ЖЕ модели на target_lang с переводом (например для «mit Sorgfalt»: mit Ruhe — спокойно, mit Geduld — терпеливо); (3) контраст «а когда было бы иначе» — короткий пример, где форма или артикль изменились бы, с пояснением почему. 3–5 предложений, без терминов. '
        + 'Если «'+term+'» — кусочек составного глагола: в explanation назови глагол целиком и скажи, что часть уехала в конец. Не пересказывай перевод всего предложения. '
        + 'example — один короткий пример той же конструкции на target_lang (для озвучки), или "". Помни: грамматика example не отменяет разбор формы из sentence.'
    }, '{"explanation":"короткая суть, 1-2 предложения на native_lang, без терминов","detail":"развёрнутый разбор без терминов: почему так + 2-3 примера той же модели + контраст когда иначе","example":"короткий пример той же конструкции на target_lang или пусто"}');
  } catch(e) {
    box.innerHTML = `<span style="color:var(--faint)">Не удалось получить объяснение. Попробуйте ещё раз.</span>`;
    if (btn) btn.disabled = false;
    if (reposition) reposition();
    return;
  }
  if (btn) btn.disabled = false;
  const expl = (r && r.explanation) ? r.explanation : 'Объяснение недоступно.';
  const detail = (r && r.detail) ? r.detail : '';
  const ex = (r && r.example) ? r.example : '';
  const exRow = ex ? `<div style="margin-top:6px;color:var(--orange)">${esc(ex)} ${hasTTS(p.targetLang)?`<button aria-label="Озвучить пример" onclick="speak(${JSON.stringify(ex).replace(/"/g,'&quot;')}, '${p.targetLang}')" style="background:none;border:none;font-size:14px;cursor:pointer;padding:0">🔊</button>`:''}</div>` : '';
  // Вариант Б: суть сразу, развёрнутый разбор — по кнопке «подробнее» (оба уровня уже получены, без второго запроса)
  const moreBlock = detail
    ? `<button id="tapMore" style="margin-top:8px;background:none;border:none;color:var(--accent,#6ea8fe);font-size:13px;cursor:pointer;padding:0">подробнее ▼</button>`
      + `<div id="tapDetail" style="display:none;margin-top:6px;line-height:1.5">${esc(detail).replace(/\n/g,'<br>')}</div>`
    : '';
  box.innerHTML = `<div>${esc(expl)}</div>` + exRow + moreBlock;
  box.dataset.loaded = '1';
  const moreBtn = box.querySelector('#tapMore');
  if (moreBtn) moreBtn.onclick = () => {
    const d = box.querySelector('#tapDetail');
    const open = d.style.display === 'none';
    d.style.display = open ? 'block' : 'none';
    moreBtn.textContent = open ? 'свернуть ▲' : 'подробнее ▼';
    if (reposition) reposition();
  };
  if (reposition) reposition();
}
// Подбор слов для must_use на конкретный акт: ротация приоритетных + известных + стартовой служебной лексики.
function superquestActMustUse() {
  const pri = pick(L.sp.priority||[], Math.min(3, (L.sp.priority||[]).length));
  const restPool = (L.sp.knownSample||[]).filter(t=>!pri.includes(t));
  const rest = pick(restPool, Math.min(4, restPool.length));
  const func = L.sp.functionalNew||[];
  return [...new Set([...pri, ...rest, ...func])].slice(0,8);
}

async function startSuperLesson() {
  const p = DB.profile, lvl = p.cefr;
  const base = DB.nextStage.startsWith('EXAM_') ? DB.nextStage.replace('EXAM_','')+'.25' : DB.nextStage;
  Screen.loader('Готовлю Суперквест…');
  LessonCache.clearSuper();   // 4.29: новый Суперквест заменяет прежний незавершённый; урок в своём слоте не страдает
  // 4.27: спокойный слой кормит и Суперквест — подошедшие по дате слова идут первыми, затем случайный добор
  const dueWords = DB.vocab.filter(w=>SRS.due(w)).sort((a,b)=>SRS.overdue(b)-SRS.overdue(a)).map(w=>w.term);
  const knownSample = [...new Set([...dueWords, ...pick(DB.vocab, Math.min(20, DB.vocab.length)).map(w=>w.term)])].slice(0,20);
  const imported = DB.vocab.filter(w=>w.priority || w.source==='import').map(w=>w.term);
  const riskQueue = DB.vocab.filter(w=>DB.reviewQueue.includes(w.term)).map(w=>w.term);
  const riskFirst = [...new Set([...imported, ...riskQueue])];
  const intensiveTopic = DB.intensive && imported.length
    ? (p.interests ? p.interests + '; ' : '') + 'прикладная отработка импортированных профессиональных терминов в реальных рабочих сценариях'
    : p.interests;
  const acts = SUPERQUEST_ACTS[lvl] || 3;
  const scenesTotal = SUPERQUEST_SCENES[lvl] || 30;
  const scenesPerAct = splitScenesAmongActs(scenesTotal, acts);
  const survShare = SURVIVAL_SHARE[lvl] ?? 0.3;
  const topicMode = `бытовое ≈${Math.round(survShare*100)}% / интересы ≈${Math.round((1-survShare)*100)}% (бытовое: ориентирование и транспорт, магазин, деньги, еда, вежливость, время, здоровье); бытовое вплетать в сюжет, не отдельным списком`;

  // небольшой стартовый набор новой служебной лексики (раздел 6.2) — войдёт в must_use по ходу истории
  // Запрос идёт параллельно с подготовкой данных (Promise выполняется пока мы собираем L)
  let functionalNew = [];
  const functionalNewPromise = Gemini.call({
    task:'super_lesson_plan', part:'functional', target_lang:p.targetLang, native_lang:p.nativeLang, cefr:lvl,
    known_vocab:knownSample,
    rules:'Ровно 2 новых служебных слова (предлоги/союзы/частицы), которых нет в known_vocab — будут вплетены в историю Суперквеста по ходу повествования.'
  }, '{"functional_new":[{"term":"связка/предлог","emoji":"эмодзи","translit":"[родными буквами]","translation":"перевод"}] — ровно 2}')
    .then(r => { functionalNew = (r.functional_new||[]).filter(w=>w && w.term); })
    .catch(e => {
      if (String(e.message||'').startsWith('KEY:')) throw e;
      // стартовый набор необязателен — история всё равно введёт новые слова по ходу (encountered_words)
    });
  try { await functionalNewPromise; } catch(e) {
    if (String(e.message||'').startsWith('KEY:')) return keyWizard(true);
  }
  functionalNew.forEach(w => {
    if (w.term && !DB.vocab.some(v=>norm(v.term)===norm(w.term)))
      DB.vocab.push({ term:w.term, translation:w.translation||'', translit:w.translit||'', emoji:w.emoji||'',
        is_irregular:false, forms:'', lesson:'SUPER_'+base, errors:0, status:'новое', mnemonic:'', date_added:today(), date_review:today() });
  });
  Storage.save(DB);

  L = { code:'SUPER_'+base, isSuper:true, words:[],
        sp: { p, lvl, base, knownSample, priority: riskFirst.slice(0,7), topic:intensiveTopic,
              functionalNew: functionalNew.map(w=>w.term), reviewDue: dueWords },   // 4.27: подошедшие по дате — для оценки ступеней в finishSuper
        sqMustUsed: [],   // 4.27: копим активно требуемые (must_use) слова по актам — их двигаем по лестнице
        actsTotal: acts, scenesPerAct, topicMode,
        superStory: { summary:'', arc:null },
        errors:{recognition:0,writing:0,construction:0,quest:0},
        ft:{ok:0,total:0}, hints:0, t0:Date.now(), wordErr:{}, firstTryDone:{} };
  // СЮЖЕТНЫЙ ДВИЖОК (раздел 6, ред. 4.21): один раз строим скелет истории-новеллы на весь суперквест
  Screen.loader('Готовлю историю…');
  try {
    const ar = await Gemini.call({
      task:'generate_story_arc', target_lang:p.targetLang, native_lang:p.nativeLang, cefr:lvl,
      topic:intensiveTopic, topic_mode:topicMode, acts_total:acts, scenes_per_act:scenesPerAct, scenes_total:scenesTotal,
      priority_words:riskFirst.slice(0,7), known_sample:knownSample,
      rules:'Построй СКЕЛЕТ цельной истории-новеллы, которую интересно читать: живой герой от первого лица, смена мест и действий, юмор и яркие образы, развязка. Это приключение, а не описание одной комнаты. '
        +'Верни РОВНО scenes_total битов (по одному на сцену), пронумерованных по актам согласно scenes_per_act (акт 1 — первые scenes_per_act[0] сцен и т.д.). Каждый бит — КОРОТКИЕ фразы, НЕ проза: place (где), action (что делает герой/что происходит), shift (что меняется к следующему биту), опц. twist (поворот). '
        +'Арка через все акты: завязка -> нарастание -> кульминация -> развязка. Размечай 1-2 развилки на акт (is_branch_point=true) в логически уместных точках, с branch_hint о чём выбор; последствие выбора подразумевай в последующих битах. Развилка (QUEUE-48) — это выбор между двумя РАЗНЫМИ поступками/направлениями сюжета (что герой делает дальше), а НЕ языковой/грамматический выбор; branch_hint описывает именно расхождение сюжета. '
        +'priority_words/known_sample — МЯГКАЯ опора: раскидай естественные поводы их употребить по битам; новые слова допустимы и желательны для живости. CEFR ('+lvl+') ограничивает ТОЛЬКО будущую грамматику заданий, НЕ богатство мира и образов. '
        +'hero — уникальный под эту историю: краткие name, role, voice (манера/характер). tone — живой, с юмором. '
        +'title (4.39) — короткое название ЭТОЙ истории на native_lang, 1-3 слова, без кавычек и без слова «квест»: то, что человек увидит на кнопке. hook — одна фраза-зацепка на native_lang, обрывающаяся на интриге, без спойлера развязки.'
    }, '{"title":"короткое название истории на родном языке","hook":"фраза-зацепка на родном языке","logline":"одна фраза о чём история","hero":{"name":"имя","role":"роль","voice":"манера/характер кратко"},"tone":"живой, с юмором","beats":[{"act":1,"scene":1,"place":"где","action":"что происходит","shift":"что меняется","twist":"","is_branch_point":false,"branch_hint":""}]}');
    if (ar && Array.isArray(ar.beats) && ar.beats.length) L.superStory.arc = ar;
  } catch(e) {
    if (String(e.message||'').startsWith('KEY:')) return keyWizard(true);
    // арка необязательна: без неё работает прежний режим «сцена за сценой» по story_so_far
  }
  startSuperquestAct(1);
}

function resumeSuper(cached) {
  // QUEUE-46: возобновление Суперквеста из снимка. Восстанавливаем L (арка, сводка, акт,
  // накопители) и перезаходим в сохранённый акт; runSuperquestAct поднимет сцену из L._resumeScene.
  L = LessonCache.hydrate(cached);
  L._resumeScene = L.sqScene || 1;
  startSuperquestAct(L.actIndex || 1);
}

function startSuperquestAct(actIndex) {
  L.actIndex = actIndex;
  const scenesInAct = L.scenesPerAct[actIndex-1];
  const isLastAct = actIndex >= L.actsTotal;
  const _mu = superquestActMustUse();
  L.sqMustUsed = [...new Set([...(L.sqMustUsed||[]), ..._mu])];   // 4.27: активно требуемые слова — их и двигаем по лестнице в finishSuper
  runSuperquestAct({
    actIndex, actsTotal: L.actsTotal, scenesInAct, isLastAct,
    cefr: L.sp.lvl, topic: L.sp.topic, topicMode: L.topicMode,
    mustUse: _mu
  });
}

// Цикл сцен ОДНОГО акта. История (L.superStory.summary) копится сквозным образом через все акты —
// это одна непрерывная история, а не три разных квеста, как в прежней реализации.
async function runSuperquestAct(cfg) {
  const p = DB.profile;
  const Q = { scene:1, errors:0, branchesUsedInAct:0, choice:null, newWordsInAct:new Set() };
  // QUEUE-46: возобновление Суперквеста. Позиция (акт+сцена+сводка+арка) живёт на L и
  // сериализуется через LessonCache. L._resumeScene выставляется при входе из меню «Продолжить».
  if (L && L._resumeScene) {
    Q.scene = L._resumeScene;
    Q.choice = L.sqChoice || null;
    Q.branchesUsedInAct = L.sqBranches || 0;
    Q.newWordsInAct = new Set(L.sqNewWords || []);
    delete L._resumeScene;   // одноразово
  }
  nextScene();

  function saveSuperPos() {
    // снимок позиции Суперквеста перед показом сцены (акт уже в L.actIndex; сводка в L.superStory.summary)
    if (!L) return;
    L.sqScene = Q.scene; L.sqChoice = Q.choice;
    L.sqBranches = Q.branchesUsedInAct; L.sqNewWords = [...Q.newWordsInAct];
    LessonCache.save();
  }

  async function nextScene() {
    saveSuperPos();
    Screen.loader(`Акт ${cfg.actIndex}/${cfg.actsTotal} · сцена ${Q.scene} из ${cfg.scenesInAct}…`);
    let sc;
    // СЮЖЕТНЫЙ ДВИЖОК: бит текущей сцены из арки (глобальный индекс сквозь акты)
    const _arc = L.superStory.arc;
    const _priorScenes = (L.scenesPerAct||[]).slice(0, cfg.actIndex-1).reduce((a,b)=>a+b,0);
    const _beatObj = (_arc && Array.isArray(_arc.beats)) ? _arc.beats[_priorScenes + (Q.scene-1)] : null;
    const _hero = _arc ? _arc.hero : null;
    const _tone = _arc ? (_arc.tone||'живой, с юмором') : '';
    try {
      sc = await Gemini.call({
        task:'quest_step', target_lang:p.targetLang, native_lang:p.nativeLang, cefr:cfg.cefr,
        topic:cfg.topic, must_use:cfg.mustUse, scene_index:Q.scene, max_scenes:cfg.scenesInAct,
        act_index:cfg.actIndex, acts_total:cfg.actsTotal,
        branches_used_in_act:Q.branchesUsedInAct, branch_limit_in_act:2,
        vocab_balance:'сюжет важнее повторения: знакомая лексика — опора, новая лексика — для образности и действия; без жёсткой квоты',
        topic_mode: cfg.topicMode,
        known_rules:(DB.rules||[]).map(r=>r.title).slice(-40),
        user_choice:Q.choice, story_so_far:L.superStory.summary, beat:_beatObj, hero:_hero, story_tone:_tone,
        rules:'СЦЕНА — ТОЛЬКО НОВОЕ (критично, 4.43): story_so_far дан, чтобы ты знал, на чём остановились, а НЕ чтобы пересказывать. Повторять предложения предыдущих сцен ЗАПРЕЩЕНО. prompt_for_user — СТРОГО на native_lang; требуемые слова приложение показывает само строкой «Используйте: …», в условии их не называй. Это ОДНА непрерывная история Суперквеста: акт '+cfg.actIndex+' из '+cfg.actsTotal+', сцена '+Q.scene+' из '+cfg.scenesInAct+'. НАРРАТИВ (по биту): тебе передан beat — конкретные place/action/shift текущей сцены из заранее построенной арки истории. Разверни ИМЕННО этот бит в живую сцену (новое место/действие/событие), НЕ описывай предыдущую ситуацию заново. Опирайся на story_so_far для непрерывности и на hero (name/role/voice) — голос героя постоянен через все сцены. Тон story_tone: живой, с юмором и яркими сенсорными образами (образность простыми словами, в рамках CEFR-грамматики). Если beat.is_branch_point=true — здесь уместна развилка. '
          +'Развилка — ТОЛЬКО в логически уместный момент сюжета, не больше branch_limit_in_act развилок за акт (в этом акте уже использовано: '+Q.branchesUsedInAct+'); основная линия должна оставаться прямой — не превращай историю в лабиринт выборов. РАЗВИЛКА СЮЖЕТНАЯ, НЕ ГРАММАТИЧЕСКАЯ (QUEUE-48, критично): при is_branch=true два варианта choices — РАЗНЫЕ поступки/повороты сюжета (что герой делает дальше), ведущие к разным продолжениям. ОБА варианта грамматически верны и естественны; ЗАПРЕЩЕНО выбирать между верной и неверной формой (артикль/падеж/окончание) или между двумя формулировками одного и того же. label_target — осмысленное действие в мире истории, не языковой тест. Языковое задание сцены (expected_target) отдельно от выбора ветки. '

      $('#check').disabled = false;
      if (!res) { toast('Связь барахлит — ответ засчитан', true); return pass(); }
      if (res.correct) return pass(a, res);   // QUEUE-74: хвалим фразу ученика, не эталон
      sceneWrong = true; Q.errors++; L.errors.quest++;
      const qTr = (res && res.correct_translit) ? ` <span style="color:var(--orange)">${esc(res.correct_translit)}</span>` : '';
      if (Q.errors >= 2) { // Graceful Exit: напарник даёт ответ с мнемоникой (счётчик свой на каждый акт)
        firstTry(stepKey, false);
        $('#fb').className='feedback ok';
        $('#fb').innerHTML = `🤝 Я подскажу как напарник: <b>${esc(res?.correct_form||correctForm)}</b>${qTr}` + sayBtn(res?.correct_form||correctForm) + `<br>🧠 ${esc(res?.explanation||'Запомните эту конструкцию — она встретится снова.')}`;
        speak(res?.correct_form||correctForm, p.targetLang);
        showErrorRule(res);
        $('#check').textContent = isWholeFinal ? 'Завершить Суперквест' : (isActFinal ? 'Завершить главу' : 'Дальше');
        $('#check').onclick = () => advance(sc, isActFinal, isWholeFinal);
        return;
      }
      mustRetype = true; correctForm = res?.correct_form || correctForm || a;
      $('#fb').className='feedback bad';
      $('#fb').innerHTML = `❌ ${esc(res?.explanation||'Есть ошибка, попробуйте ещё раз.')}<br>Сверьте: ${highlightDiff(a, correctForm)}${qTr}` + sayBtn(correctForm) + ` — запомните и введите вручную.`;
      speak(correctForm, p.targetLang);
      showErrorRule(res);
      $('#ans').value=''; $('#ans').focus();
    };
    function pass(userAns, res) {
      firstTry(stepKey, !sceneWrong);
      $('#fb').className='feedback ok';
      const shown = (userAns && String(userAns).trim()) ? String(userAns).trim() : correctForm;   // QUEUE-74
      const note = (res && res.note) ? `<br><span style="color:var(--orange);font-size:13px">💡 ${esc(res.note)}</span>` : '';
      $('#fb').innerHTML = shown ? `✅ Отлично! <b>${esc(shown)}</b>` + sayBtn(shown) + note : `✅ Отлично!`;
      // QUEUE-45: после верного ответа лампочка бессмысленна и затирает #fb (в т.ч. кнопки развилки) — прячем её.
      { const _qh = document.getElementById('qhint'); if (_qh) _qh.style.display='none'; }
      if (sc.is_branch && !isActFinal && !isWholeFinal && Array.isArray(sc.choices) && sc.choices.length>=2) {
        Q.branchesUsedInAct++;
        $('#fb').innerHTML += `<div style="margin-top:10px">Развилка — что делаем дальше?</div>` +
          sc.choices.slice(0,2).map(c=>`<button class="opt" style="margin-top:8px;text-align:left" data-c="${esc(c.id)}"><b>${esc(c.label_target)}</b>${c.label_native?`<br><span style='font-size:12px;color:var(--dim)'>${esc(c.label_native)}</span>`:''}</button>`).join('');
        document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ Q.choice=b.dataset.c; advance(sc,false,false); });
        $('#check').style.display='none';
      } else {
        $('#check').textContent = isWholeFinal ? 'Завершить Суперквест' : (isActFinal ? 'Завершить главу' : 'Дальше');
        $('#check').onclick = () => advance(sc, isActFinal, isWholeFinal);
      }
    }
  }
  function advance(sc, isActFinal, isWholeFinal) {
    // QUEUE-30: включаем выбор пользователя в summary чтобы Gemini знал что выбрано
    const choiceNote = Q.choice ? ` [Пользователь выбрал: вариант ${Q.choice} — ${(sc.choices||[]).find(c=>c.id===Q.choice)?.label_target||Q.choice}]` : '';
    // 4.43: та же причина, что в квесте — предыстория это последняя сцена, а не склейка всех
    L.superStory.summary = (String(sc.scene_text||'') + choiceNote).slice(-600);
    if (isWholeFinal) return finishSuper();
    if (isActFinal) {
      const learned = Q.newWordsInAct.size;
      Screen.show(`
        <div class="eyebrow">Суперквест</div>
        <h1>${Q.errors>=2?'🤝 Прошли главу вместе!':'📖 Глава '+cfg.actIndex+' пройдена!'}</h1>
        <div class="chapter-card">
          <p class="sub" style="margin:0">Слов закреплено: <b style="color:var(--ink)">${learned}</b></p>
        </div>
        <button class="btn btn-primary" id="goAct">Продолжить</button>`);
      $('#goAct').onclick = () => startSuperquestAct(cfg.actIndex+1);
      return;
    }
    Q.scene++; Q.choice = null; nextScene(); // сбрасываем после передачи в summary
  }
}

async function finishSuper() {
  const acc = L.ft.total ? +(L.ft.ok/L.ft.total).toFixed(2) : 1;
  const hard = Object.keys(L.wordErr).filter(t=>L.wordErr[t]>=2);
  hard.forEach(t=>{ if(!DB.reviewQueue.includes(t)) DB.reviewQueue.push(t); });
  // 4.27: двигаем лестницу по итогу Суперквеста.
  //   • активно требуемые слова (must_use) — верно (0 ошибок) → ступень выше; ошибка → сброс;
  //   • любое подошедшее по дате слово, на котором ошиблись, — тоже сброс (даже если не было в must_use).
  const _scored = new Set(L.sqMustUsed || []);
  _scored.forEach(t => { const v = DB.vocab.find(x=>norm(x.term)===norm(t)); if (v) SRS.review(v, (L.wordErr[t]||0) === 0); });
  (L.sp && L.sp.reviewDue || []).forEach(t => {
    if ((L.wordErr[t]||0) > 0 && !_scored.has(t)) { const v = DB.vocab.find(x=>norm(x.term)===norm(t)); if (v) SRS.review(v, false); }
  });
  // выход из СРОЧНОГО слоя без ошибок — просто из очереди (освоено ставит только вершина лестницы)
  DB.vocab.forEach(v => { if (DB.reviewQueue.includes(v.term) && !(L.wordErr[v.term])) {
    DB.reviewQueue = DB.reviewQueue.filter(x=>x!==v.term); if (v.status==='на закреплении') v.status='новое'; if (v.status!=='освоено' && !SRS.onLadder(v)) SRS.initLearned(v); }});
  DB.progress.push({ code:L.code, date:today(), words:hard.join(', '), next:DB.nextStage, note:'PASS' });
  DB.analytics.push({ lesson:L.code, date:today(), accuracy_first_try:acc, errors_by_type:L.errors,
    hard_words:hard, duration_sec:Math.round((Date.now()-L.t0)/1000), hints_used:L.hints, delta_accuracy:'' });
  Storage.save(DB); toast('Сохранено ✓');
  LessonCache.clearSuper(L.code);   // Суперквест пройден — снимок больше не нужен
  const code = L.code; L = null;
  Screen.show(`
    <h1>Суперквест завершён, прогресс сохранён.</h1>
    <p class="sub">Точность: ${Math.round(acc*100)}%. Повторение — половина успеха. Что дальше?</p>
    <button class="btn btn-primary" id="bN">Следующий этап: ${esc(DB.nextStage)}</button>
    <button class="btn btn-ghost" id="bE">Выход в меню</button>`);
  $('#bN').onclick = () => DB.nextStage.startsWith('EXAM_') ? startExam(DB.nextStage) : startLesson(DB.nextStage);
  $('#bE').onclick = mainMenu;
}

/* =====================================================================
   ЭКЗАМЕНЫ (раздел 7) и работа над ошибками (раздел 8)
   ===================================================================== */
const EXAM_QUESTIONS = 50;
function buildExamQuestions() {
  const pool = DB.vocab.slice();
  const n = Math.min(EXAM_QUESTIONS, Math.max(10, pool.length * 2));
  const qs = [];
  for (let i=0;i<n;i++) {
    const w = pool[i % pool.length];
    if (i % 3 === 2 && pool.length >= 4) {           // письмо
      qs.push({ kind:'write', w });
    } else {                                          // выбор
      const fill = pick(pool.filter(x=>x.term!==w.term), 3);
      qs.push({ kind:'mcq', w, opts: shuffle([w, ...fill]) });
    }
  }
  return shuffle(qs);
}
function startExam(examCode) {
  if (DB.vocab.length < 4) { toast('Слишком мало слов для экзамена', true); return mainMenu(); }
  const qs = buildExamQuestions();
  const E = { code:examCode, qs, i:0, ok:0, wrong:[] };
  Screen.show(`
    <div class="eyebrow">Экзамен</div>
    <h1>${esc(examCode.replace('EXAM_',''))} · ${qs.length} вопросов</h1>
    <p class="sub">По одному вопросу на экран, без подсказок. Порог сдачи — 85%. Результат объявлю после последнего ответа.</p>
    <button class="btn btn-accent" id="go">Начать экзамен</button>
    <button class="btn btn-ghost" id="back">Позже</button>`, { back: mainMenu });
  $('#go').onclick = () => examStep(E);
  $('#back').onclick = mainMenu;
}
function examStep(E) {
  if (E.i >= E.qs.length) return examResult(E);
  const q = E.qs[E.i], w = q.w;
  const head = `<div class="eyebrow">Экзамен · ${E.i+1} / ${E.qs.length}</div>`;
  if (q.kind==='mcq') {
    Screen.show(`${head}<div class="card">
      <div class="task-text">${esc(w.emoji||'')} ${esc(w.translation)}</div>
      ${q.opts.map(o=>`<button class="opt" data-t="${esc(o.term)}">${esc(o.term)}</button>`).join('')}</div>`);
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if (norm(b.dataset.t)===norm(w.term)) E.ok++; else E.wrong.push(w);
      E.i++; examStep(E);
    });
  } else {
    Screen.show(`${head}<div class="card">
      <div class="task-text">Напишите: ${esc(w.emoji||'')} ${esc(w.translation)}</div>
      <input type="text" id="ans" autocomplete="off" autocapitalize="off">
      <button class="btn btn-primary" id="ok" style="margin-top:12px">Ответить</button></div>`);
    $('#ok').onclick = () => {
      if (norm($('#ans').value)===norm(w.term)) E.ok++; else E.wrong.push(w);
      E.i++; examStep(E);
    };
  }
}
function examResult(E) {
  const pct = E.ok / E.qs.length;
  const lvlKey = E.code;
  const passed = pct >= EXAM_PASS;
  if (passed) {
    DB.examAttempts[lvlKey] = 0;
    const next = nextAfterExamPass(E.code);
    DB.progress.push({ code:E.code+'_PASS', date:today(), words:'', next, note:`${E.ok}/${E.qs.length}` });
    DB.nextStage = next; DB.profile.cefr = parseCode(next).lvl;
    Storage.save(DB); toast('Сохранено ✓');
    Screen.show(`<h1>🏆 Экзамен сдан: ${E.ok}/${E.qs.length}</h1>
      <p class="sub">Переход на новый уровень. Следующий урок: <b style="color:var(--ink)">${esc(next)}</b>.</p>
      <button class="btn btn-primary" id="go">Дальше</button>`);
    $('#go').onclick = mainMenu;
    return;
  }
  DB.examAttempts[lvlKey] = (DB.examAttempts[lvlKey]||0) + 1;
  const attempt = DB.examAttempts[lvlKey];
  if (attempt === 1) {
    DB.progress.push({ code:E.code+'_FAIL-1', date:today(), words:'', next:E.code, note:`${E.ok}/${E.qs.length}` });
    Storage.save(DB); toast('Сохранено ✓');
    Screen.show(`<h1>Результат: ${E.ok}/${E.qs.length}</h1>
      <p class="sub">До порога 85% не хватило. Это первая попытка — экзамен можно пересдать сразу или после повторения.</p>
      <button class="btn btn-primary" id="re">Пересдать экзамен</button>
      <button class="btn btn-ghost" id="sup">Суперквест перед пересдачей</button>
      <button class="btn btn-ghost" id="m">В меню</button>`);
    $('#re').onclick = () => startExam(E.code); $('#sup').onclick = startSuperLesson; $('#m').onclick = mainMenu;
  } else {
    // второй провал → режим работы над ошибками (раздел 8)
    startRemedial(E);
  }
}
function startRemedial(E) {
  const items = [];
  E.wrong.slice(0, 12).forEach(w => { items.push({w, pass:1}); items.push({w, pass:2}); }); // 2 штрафных на ошибку
  let i = 0;
  Screen.show(`<h1>Работа над ошибками</h1>
    <p class="sub">Второй провал — не приговор, а сигнал. Разберём каждую ошибку: по два задания на слово, по одному на экран. Двигаемся только после верного ответа.</p>
    <button class="btn btn-primary" id="go">Начать разбор</button>`);
  $('#go').onclick = step;
  function step() {
    if (i >= items.length) return done();
    const {w, pass} = items[i];
    if (DB.reviewQueue.indexOf(w.term)<0) DB.reviewQueue.push(w.term);
    ensureMnemonic(DB.vocab.find(v=>v.term===w.term)||w);
    Screen.show(`<div class="eyebrow">Разбор · ${i+1} / ${items.length}</div>
      <div class="card">
        <div class="task-text">${esc(w.emoji||'')} ${esc(w.translation)} <span style="color:var(--orange);font-size:14px">${esc(w.translit||'')}</span></div>
        ${pass===1?`<div class="feedback ok" style="display:block;margin-bottom:10px">🧠 Верный ответ: <b>${esc(w.term)}</b>${w.mnemonic?'<br>'+esc(w.mnemonic):''} — введите его вручную.</div>`:''}
        <input type="text" id="ans" autocomplete="off" autocapitalize="off" placeholder="${pass===1?'Перепишите слово':'Теперь по памяти'}">
        <div class="feedback" id="fb"></div>
        <button class="btn btn-primary" id="ok" style="margin-top:12px">Проверить</button>
      </div>`);
    $('#ok').onclick = () => {
      if (norm($('#ans').value)===norm(w.term)) { speak(w.term, DB.profile.targetLang); i++; step(); }
      else { $('#fb').className='feedback bad'; $('#fb').innerHTML=`❌ Верно: <b>${esc(w.term)}</b> — введите ещё раз.`; $('#ans').value=''; }
    };
  }
  function done() {
    DB.examAttempts[E.code] = 0; // после remedial — снова к экзамену
    DB.progress.push({ code:E.code.replace('EXAM_','EXAM_')+'_REMEDIAL', date:today(),
      words: E.wrong.map(w=>w.term).join(', '), next:E.code, note:'' });
    Storage.save(DB); toast('Сохранено ✓');
    Screen.show(`<h1>Разбор завершён, прогресс сохранён.</h1>
      <p class="sub">Исправленные слова добавлены в очередь повторения. Возвращаемся к экзамену.</p>
      <button class="btn btn-primary" id="re">Пересдать экзамен</button>
      <button class="btn btn-ghost" id="m">В меню</button>`);
    $('#re').onclick = () => startExam(E.code); $('#m').onclick = mainMenu;
  }
}

/* =====================================================================
   ГОЛОСОВОЙ ДИАЛОГ «Поговорить» (раздел 5.B): STT → Gemini → TTS,
   двойной ввод (голос/текст), напарник, а не судья.
   ===================================================================== */
function startDialogue() {
  if (IS_APPLE) return mainMenu();   // входа нет, но на случай старой ссылки/эпизода — не открываем нерабочий режим
  const p = DB.profile;
  TAP_ORIGIN = 'dialogue';   // QUEUE-61: слова, тапнутые здесь, помечаются в словаре как пришедшие из диалога
  const mustUse = pick(DB.vocab.slice(-15).map(w=>w.term), Math.min(2, DB.vocab.length));
  const history = [];
  let turns = 0;
  Screen.show(`
    <div class="eyebrow">Поговорить · тема: ${esc(String(p.interests).split(/[,;]/)[0]||'')}</div>
    <div class="chat" id="chat"></div>
    <div class="chat-input">
      <button class="mic" id="mic" aria-label="Говорить">🎙️</button>
      <input type="text" id="msg" placeholder="Или напишите ответ…">
      <button class="btn btn-primary btn-mini" id="send" style="margin:0">➤</button>
    </div>
    <button class="btn btn-ghost" id="endD" style="margin-top:10px">Завершить диалог</button>`,
    { back: endDialogue });
  const chat = $('#chat');
  // QUEUE-61: реплика ИИ идёт на целевом языке — её слова тапабельны так же, как в сцене
  // Квеста и Суперквеста (перевод + 📘 «почему так?»). Обёртка .target нужна, чтобы
  // lookupAndShowWord взял из неё контекст предложения для explain_element; перевод на
  // родной (<small>) остаётся ВНЕ .target — иначе в контекст уедет родной язык.
  // plain=true — служебные строки (плейсхолдер «…», обрыв связи): их не тапаем и не озвучиваем.
  const add = (role, text, sub, plain) => {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    const tappable = (role === 'ai' && !plain);
    // QUEUE-44: реплику ИИ (на целевом языке) можно переслушать сколько нужно — кнопка 🔊.
    // sayBtn сам скрывается, если у целевого языка нет озвучки. Свои реплики не озвучиваем.
    const replay = tappable ? sayBtn(text) : '';
    const body = tappable ? `<span class="target">${tapAllWordsHTML(text)}</span>` : esc(text);
    d.innerHTML = body + replay + (sub?`<small>${esc(sub)}</small>`:'');
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
    if (tappable) attachTapAll(d);
  };
  // QUEUE-62: inputMode — 'voice' | 'text' | null (первая реплика). Приложение знает,
  // микрофон это был или клавиатура, и обязано сообщить модели: от этого зависит,
  // считать расхождение ошибкой ученика или шумом распознавания.
  async function aiTurn(userText, inputMode, alts) {
    if (userText) { add('user', userText); history.push({role:'user', text:userText}); }
    add('ai', '…', null, true);
    let r = null;
    const known = (DB.vocab || []).map(w => w.term).slice(-60);
    try {
      r = await Gemini.call({ task:'dialogue', target_lang:p.targetLang, native_lang:p.nativeLang, cefr:p.cefr,
        topic:p.interests, must_use:mustUse, history: history.slice(-10),
        known_vocab: known, input_mode: inputMode || 'text',
        user_speech_alternatives: (inputMode === 'voice' && alts && alts.length > 1) ? alts : undefined,
        rules:'Ты — доброжелательный напарник, а не судья. Цель режима — чтобы ученик перестал бояться говорить и говорил больше, поэтому поддержка важнее замечаний. '
          + dialogueLevelBlock(p.cefr)
          + dialogueToleranceBlock(inputMode || 'text', alts)
          + 'known_vocab — опора, а не ограда: опирайся на знакомые слова, но новые вводить можно. После 6–8 обменов плавно завершай (is_final=true).' },
        '{"reply_target":"реплика на целевом языке","reply_native":"перевод на родной","understood":true,"gentle_correction":"мягкая поправка на родном или null","is_final":false}');
    } catch(e){}
    chat.lastChild.remove();
    if (!r) { add('ai','Связь прервалась — попробуйте ещё раз.', null, true); return; }
    add('ai', r.reply_target, r.reply_native + (r.gentle_correction ? '\n🤝 ' + r.gentle_correction : ''));
    history.push({role:'ai', text:r.reply_target});
    speak(r.reply_target, p.targetLang);
    turns++;
    // QUEUE-61: подсказку показываем после ПЕРВОЙ реплики — на пустом экране тапать нечего
    if (turns === 1) Hints.show('dialogue', HintTexts.dialogue);
    if (r.is_final) setTimeout(endDialogue, 2500);
  }
  function endDialogue() {
    TAP_ORIGIN = null;
    try { speechSynthesis.cancel(); } catch(e){}
    if (turns > 0) {
      // QUEUE-62: разговор — тренировка устной речи, а не замер. Точность НЕ пишется вообще:
      // прежде здесь стоял masteryPercent()/100 || 0.8 — выдуманное число, которое попадало
      // и в среднюю точность, и в сравнение «лучше/хуже прошлого раза» следующего урока.
      // Запись остаётся ради факта занятия (серия, активность), поле accuracy_first_try отсутствует.
      DB.analytics.push({ lesson:'DIALOGUE', date:today(), turns:turns,
        errors_by_type:{dialogue:0}, hard_words:[], duration_sec:0, hints_used:0, delta_accuracy:'' });
      Storage.save(DB); toast('Сохранено ✓');
    }
    mainMenu();
  }
  $('#send').onclick = () => { const v = $('#msg').value.trim(); if (v){ $('#msg').value=''; aiTurn(v, 'text');} };
  $('#msg').onkeydown = e => { if (e.key==='Enter') $('#send').click(); };
  $('#endD').onclick = endDialogue;
  const mic = $('#mic');
  const rec = makeRecognizer(p.targetLang, (t, alts) => { mic.classList.remove('rec'); if (t) aiTurn(t, 'voice', alts); }, () => mic.classList.remove('rec'));
  mic.onclick = () => {
    if (!rec) return toast('Распознавание речи недоступно — пишите текстом', true);
    if (mic.classList.contains('rec')) { rec.stop(); mic.classList.remove('rec'); }
    else { mic.classList.add('rec'); try { rec.start(); } catch(e){ mic.classList.remove('rec'); } }
  };
  aiTurn(null); // AILEX начинает разговор
}

/* ---------- запуск ---------- */
I18N.init();
syncSysStatus();
// автоперевод интерфейса на язык устройства (если не ru/en и есть ключ) — фоном
if (I18N.lang !== 'ru') setTimeout(()=>{ I18N.ensure().then(()=>{ try{ localizeDOM(document.getElementById('screen')); }catch(_){} }); }, 1500);
splashScreen(boot);

</script>
