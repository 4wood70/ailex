/* =====================================================================
   ЯДРО ЯЗЫКА (раздел 2.3-Я + 4.4 + 5, спека 4.26)
   Склад слов целевого языка в локальной базе. Не Словарь: Словарь — что человек
   уже видел в уроке, Ядро — сырьё, из которого приложение САМО набирает порцию.
   Человеку списком не показывается никогда (таблица глаголов отвергнута, 4.26).
   Gemini делает свою работу один раз (generate_core) — в уроке лексику не подбирает.
   ===================================================================== */
const CORE_LEVELS = ['A1','A2','B1','B2','C1','C2'];
const CORE_LEVEL_TOTAL = 600;   // открытый класс на уровень (раздел 4.4)
const CORE_BATCH = 120;         // слов за запрос — потолок объёма ответа модели
const SURVIVAL_TOPICS = 'ориентирование и транспорт, магазин и покупки, деньги и числа, еда, базовая вежливость, время, дни недели и даты, здоровье, дом и быт, работа и учёба, погода';
// закрытые классы: список в языке конечен — грузим целиком один раз при создании профиля
const CLOSED_BATCHES = [
  { part:'function_words', count:100, hint:'служебный костяк языка: местоимения (личные, притяжательные, указательные, вопросительные), предлоги, союзы, частицы, артикли, базовые наречия места и времени' },
  /* 4.35: артикли отдельной партией и с захватом списка. Раньше набор артиклей лежал в коде
     двенадцатью немецкими словами — на всех прочих языках проверка артикля молча не работала.
     Список конечен и принадлежит языку, поэтому его отдаёт модель один раз при создании профиля.
     Языку без артиклей (русский, польский, японский) приходит пусто — и вся логика артиклей
     в приложении выключается сама, без отдельного условия «а есть ли они тут». */
  { part:'articles', count:24, exact:false, capture:'articles',
    hint:'ВСЕ формы артиклей целевого языка: определённые и неопределённые, во всех родах, числах и падежах, а также слитные с предлогами формы, если они в языке есть (нем. im, zum, zur). Каждая форма — отдельным объектом, term строго одно слово. ЕСЛИ АРТИКЛЕЙ В ЦЕЛЕВОМ ЯЗЫКЕ НЕТ — верни "words":[] и ничего не выдумывай.' },
  { part:'irregular_verbs_1', count:100, hint:'неправильные (сильные) глаголы — ПЕРВАЯ сотня по употребимости в живой речи' },
  { part:'irregular_verbs_2', count:100, hint:'неправильные (сильные) глаголы — ВТОРАЯ сотня по употребимости; не повторяй то, что в exclude' }
];
const CORE_SCHEMA = '{"words":[{"term":"слово на целевом языке","emoji":"один эмодзи-якорь","translit":"[транскрипция буквами родного языка]","translation":"перевод на родной","part_of_speech":"noun|verb|adj|adv|pron|prep|conj|part|other","article":"der|die|das или пусто","is_irregular":false,"forms":"паспорт форм","cefr":"A1|A2|B1|B2|C1|C2","topic":"тема одним словом","freq_rank":1}]}';
const CORE_RULES = 'Слова упорядочь по употребимости в живой речи: freq_rank=1 — самое частое. '
  + 'Для КАЖДОГО слова заполни forms («паспорт»): глаголам — три основные формы и 3-е лицо при смене корня (пример: "sieht, sah, hat gesehen"); '
  + 'существительным — артикль рода и множественное число (пример: "der Tisch, die Tische"); прочим — пусто. '
  + 'is_irregular=true ТОЛЬКО для неправильных (сильных) глаголов. article заполняется только для существительных; если в целевом языке артиклей нет — пусто. '
  + 'cefr — уровень, начиная с которого слово уместно. Транскрипция — ТОЛЬКО буквами native_lang в квадратных скобках, IPA СТРОГО ЗАПРЕЩЁН (НЕ копируй письменность этой инструкции — пиши буквами native_lang). '
  + 'Исключи всё, что перечислено в exclude. Никаких технических кодов, аббревиатур и цифровых команд — только обычные слова целевого языка.';

const Core = {
  _pf: false, _failed: false,
  list(){ return (DB && Array.isArray(DB.core)) ? DB.core : []; },
  meta(){ if (!Array.isArray(DB.core)) DB.core = [];
          if (!DB.coreMeta) DB.coreMeta = { closedDone:false, levels:[], topicKey:'' };
          if (!Array.isArray(DB.coreMeta.levels)) DB.coreMeta.levels = []; return DB.coreMeta; },
  // уровень, для которого нужен открытый класс: на A0 ядро не используется (у A0 свой контракт a0_lesson),
  // но как только человек переходит на A1 — сборка запускается сама (см. needsBuild)
  lvlFor(p){ const l = (p && p.cefr) || 'A1'; return (l === 'A0' || !CORE_LEVELS.includes(l)) ? 'A1' : l; },
  topicKey(){ return norm(String((DB.profile && DB.profile.interests) || '')).slice(0,80); },
  _known(){ const s = new Set();
    this.list().forEach(w => s.add(norm(w.term)));
    (DB.vocab||[]).forEach(w => s.add(norm(w.term)));
    return s; },
  // exclude — помощь модели, а НЕ гарантия: гарантию даёт сверка на устройстве при записи (_add)
  _exclude(){ const a = this.list().map(w=>w.term).slice(-160).concat((DB.vocab||[]).map(w=>w.term).slice(-90));
              return [...new Set(a)]; },

  _add(words, tag){
    if (!Array.isArray(DB.core)) DB.core = [];
    const seen = this._known(); let n = 0;
    (words||[]).forEach(w => {
      if (!w || !w.term || !w.translation) return;
      const term = String(w.term).trim(); const k = norm(term);
      if (!k || k.length > 40 || seen.has(k)) return;
      seen.add(k); n++;
      DB.core.push({ term, translation: String(w.translation).trim(), translit: w.translit||'', emoji: w.emoji||'',
        part_of_speech: w.part_of_speech||'', article: w.article||'', forms: w.forms||'',
        is_irregular: w.is_irregular === true,
        cefr: CORE_LEVELS.includes(w.cefr) ? w.cefr : (tag.cefr || 'A1'),
        topic: w.topic||'', freq_rank: (+w.freq_rank || 999),
        klass: tag.klass, layer: tag.layer, status: 'склад',
        topicKey: tag.layer === 'interests' ? this.topicKey() : '' });
    });
    return n;
  },

  async _batch(o){
    const p = DB.profile;
    const req = { task:'generate_core', target_lang:p.targetLang, native_lang:p.nativeLang,
                  cefr:o.cefr, class:o.class, count:o.count, exclude:this._exclude(), rules:CORE_RULES };
    if (o.layer) req.layer = o.layer;
    if (o.part)  req.part  = o.part;
    if (o.hint)  req.hint  = o.hint;
    if (o.topic) req.topic = o.topic;
    const r = await Gemini.call(req, CORE_SCHEMA + (o.exact === false
      ? ' — не более ' + o.count + ' объектов; если таких слов в языке нет, верни "words":[]'
      : ' — ровно ' + o.count + ' объектов'));
    return r.words || [];
  },

  // закрытые классы целиком + открытый класс уровня (раздел 4.4)
  async build(onStep){
    const meta = this.meta(), total = CLOSED_BATCHES.length + 5;
    if (!meta.closedDone){
      for (let i=0; i<CLOSED_BATCHES.length; i++){
        const b = CLOSED_BATCHES[i];
        // 4.38 (v81): счётчик вынесен из переводимой строки — узел со вставленным «1/9»
        // не совпал бы ни с одним ключом и остался бы русским на любом языке.
        onStep && onStep(t('Собираю основу языка — служебные слова и неправильные глаголы…') + ' ' + (i+1) + '/' + total);
        const w = await this._batch({ class:'closed', part:b.part, hint:b.hint, count:b.count, cefr:'A1', exact:b.exact });
        if (b.capture === 'articles') this._captureArticles(w);
        this._add(w, { klass:'closed', layer:'general', cefr:'A1' });
        Storage.save(DB);
      }
      meta.closedDone = true; Storage.save(DB);
    }
    await this.buildLevel(this.lvlFor(DB.profile), onStep, CLOSED_BATCHES.length, total);
  },

  // открытый класс одного уровня: пропорция бытовое/интересы берётся из раздела 5
  async buildLevel(lvl, onStep, done, total){
    const meta = this.meta();
    if (meta.levels.includes(lvl)) return;
    const p = DB.profile, share = SURVIVAL_SHARE[lvl] ?? 0.3;
    const nGen = Math.round(CORE_LEVEL_TOTAL * share), nInt = CORE_LEVEL_TOTAL - nGen;
    const plan = [];
    for (let left=nGen; left>0; left-=CORE_BATCH) plan.push({ layer:'general',   count: Math.min(CORE_BATCH,left) });
    for (let left=nInt; left>0; left-=CORE_BATCH) plan.push({ layer:'interests', count: Math.min(CORE_BATCH,left) });
    for (let i=0; i<plan.length; i++){
      const b = plan[i];
      onStep && onStep(t('Собираю словарь уровня') + ' ' + lvl + '… ' + ((done||0)+i+1) + '/' + (total || plan.length));
      const w = await this._batch({ class:'open', layer:b.layer, cefr:lvl, count:b.count,
        topic: b.layer==='interests' ? (p.interests || 'повседневная жизнь') : SURVIVAL_TOPICS });
      this._add(w, { klass:'open', layer:b.layer, cefr:lvl });
      Storage.save(DB);
    }
    meta.levels.push(lvl); Storage.save(DB);
  },

  /* Артикли языка (4.35): список кладётся в coreMeta.articles, пустой список — законный ответ
     и означает «в этом языке артиклей нет». Слова с пробелом внутри отбрасываем: артикль — одно
     слово, а всё длинное в этом поле почти всегда пояснение модели, а не форма. */
  _captureArticles(words){
    const meta = this.meta(), out = [];
    (words||[]).forEach(w => { const t = String((w && w.term) || '').trim();
      if (t && !/\s/.test(t) && t.length <= 14) out.push(t); });
    meta.articles = [...new Set(out)];
    meta.articlesDone = true;
    ART._k = '';                       // набор пересоберётся при следующем обращении
  },
  // профиль, созданный до 4.35, артиклей не получал: догружаем один раз фоном, ожидания не видно
  ensureArticles(){
    try {
      const m = this.meta();
      if (m.articlesDone || this._artPf || this._failed || !DB || !DB.profile) return;
      if (!m.closedDone) return;       // на первой сборке артикли идут общим потоком
      const b = CLOSED_BATCHES.find(x => x.capture === 'articles'); if (!b) return;
      this._artPf = true;
      this._batch({ class:'closed', part:b.part, hint:b.hint, count:b.count, cefr:'A1', exact:false })
        .then(w => { this._captureArticles(w); this._add(w, { klass:'closed', layer:'general', cefr:'A1' }); Storage.save(DB); })
        .catch(()=>{})                 // не помечаем сделанным — попробуем в следующий заход
        .then(()=>{ this._artPf = false; });
    } catch(e){}
  },

  /* 4.39: транскрипция чужой письменностью успевала записаться в Словарь и Ядро (до v83 проверка
     не ловила кириллицу при родном языке на латинице). Сама она не исправится: слово уже сохранено
     и всплывает в карточках, подтверждениях и повторении. Разовый проход гасит негодные значения —
     карточка добирает транскрипцию заново при следующем показе. */
  purgeBadTranslit(){
    try {
      const m = this.meta(); if (m.translitPurged) return;
      const nat = (DB.profile && DB.profile.nativeLang) || '';
      if (!nat) return;
      let n = 0;
      [].concat(DB.core || [], DB.vocab || []).forEach(w => {
        if (w && w.translit && isBadTranslit(w.translit, nat)) { w.translit = ''; n++; }
      });
      m.translitPurged = true;
      Storage.save(DB);
      if (n) console.log('[AILEX] сброшено негодных транскрипций:', n);
    } catch(_) {}
  },

  needsBuild(){
    if (this._failed || !DB || !DB.profile) return false;
    if (DB.profile.cefr === 'A0') return false;          // на A0 ядро не нужно — соберём при переходе на A1
    const m = this.meta();
    return !m.closedDone || !m.levels.includes(this.lvlFor(DB.profile));
  },

  // догрузка следующего уровня фоном (раздел 4.4): человек ожидания не видит
  maybePrefetch(){
    try {
      if (this._pf || this._failed || !DB || !DB.profile) return;
      const m = this.meta(); if (!m.closedDone) return;
      const lvl = this.lvlFor(DB.profile), li = CORE_LEVELS.indexOf(lvl);
      const left = this.list().filter(w => w.status==='склад' && w.klass==='open'
        && CORE_LEVELS.indexOf(w.cefr) <= li).length;
      if (left >= 100) return;
      const next = CORE_LEVELS[li+1];
      if (!next || m.levels.includes(next)) return;
      this._pf = true;
      this.buildLevel(next).catch(()=>{}).then(()=>{ this._pf = false; });
    } catch(e){}
  },

  // смена интересов (раздел 4.4): перегенерируется ТОЛЬКО тематический слой
  async retopic(){
    const key = this.topicKey(); let arch = 0;
    this.list().forEach(w => {
      if (w.layer !== 'interests') return;
      if (w.status === 'склад' && w.topicKey !== key) { w.status = 'архив'; arch++; }   // невыданное старой темы → архив
      else if (w.status === 'архив' && w.topicKey === key) w.status = 'склад';          // тема вернулась → без генерации
    });
    Storage.save(DB);
    const have = this.list().filter(w => w.layer==='interests' && w.status==='склад' && w.topicKey===key).length;
    if (have >= 100) { toast('Тема обновлена ✓'); return; }
    const lvl = this.lvlFor(DB.profile);
    try {
      for (let i=0; i<2; i++){
        Screen.loader(`Подбираю лексику новой темы… ${i+1}/2`);
        const w = await this._batch({ class:'open', layer:'interests', cefr:lvl, count:100, topic: DB.profile.interests||'' });
        this._add(w, { klass:'open', layer:'interests', cefr:lvl });
        Storage.save(DB);
      }
      toast('Лексика темы обновлена ✓');
    } catch(e){ toast('Тему доберём позже — урок работает', true); }
  },

  // порция урока (раздел 5): 5 новых + 2 неправильных глагола, гарантированно
  pickPortion(lvl){
    try {
      const m = this.meta(); if (!m.closedDone) return null;
      const li = CORE_LEVELS.indexOf(CORE_LEVELS.includes(lvl) ? lvl : 'A1');
      const inVocab = new Set((DB.vocab||[]).map(w => norm(w.term)));
      const avail = f => this.list().filter(w => w.status === 'склад'
        && CORE_LEVELS.indexOf(w.cefr) <= li && !inVocab.has(norm(w.term)) && f(w));
      const byFreq = a => a.slice().sort((x,y) => (x.freq_rank||999) - (y.freq_rank||999));
      // 2 неправильных глагола — не «если уместны», а всегда, пока класс не исчерпан
      const irr = byFreq(avail(w => w.is_irregular === true)).slice(0,2);
      const taken = new Set(irr.map(w => norm(w.term)));
      const need = 7 - irr.length;
      const share = SURVIVAL_SHARE[lvl] ?? 0.3;
      const nGen = Math.round(need * share);
      // общий слой = бытовое + служебные слова закрытого класса (они наконец доходят до урока)
      const gen  = byFreq(avail(w => w.layer==='general'   && !w.is_irregular && !taken.has(norm(w.term))));
      const intr = byFreq(avail(w => w.layer==='interests' && !w.is_irregular && !taken.has(norm(w.term))));
      const out = [];
      gen.slice(0, nGen).forEach(w => { out.push(w); taken.add(norm(w.term)); });
      intr.slice(0, need - out.length).forEach(w => { out.push(w); taken.add(norm(w.term)); });
      if (out.length < need){   // одного слоя не хватило — добираем вторым, порция важнее пропорции
        byFreq(avail(w => !w.is_irregular && !taken.has(norm(w.term)))).slice(0, need - out.length)
          .forEach(w => { out.push(w); taken.add(norm(w.term)); });
      }
      const portion = [...irr, ...out];
      if (portion.length < 7) return null;           // Ядро исчерпано → резервный путь (раздел 5)
      return portion.map(w => ({ term:w.term, translation:w.translation, translit:w.translit, emoji:w.emoji,
        part_of_speech:w.part_of_speech, article:w.article, forms:w.forms, is_irregular:w.is_irregular }));
    } catch(e){ return null; }
  },

  // слово переезжает из Ядра в Словарь в момент записи урока и никогда не наоборот
  markIssued(words){
    (words||[]).forEach(x => {
      const c = this.list().find(w => norm(w.term) === norm(x.term));
      if (c) c.status = 'выдано';
    });
  }
};

/* =====================================================================
   ЯДРО ГРАММАТИКИ (раздел 2.3-Г + 4.4 + 5.0, спека 4.30)
   Карта грамматических тем языковой пары. До 4.30 «что такое уровень A1»
   жило текстом внутри промптов и в памяти модели — то есть менялось вместе
   с моделью, вопреки конституции. Теперь потолок лежит в базе.
   Карта ВЕДЁТ курс: приложение берёт следующую непройденную тему и говорит
   grammar_rule «раскрой вот эту». Человеку списком не показывается никогда.
   Область действия — только ВЫХОД (задание, эталон, каркас). Текст сцены
   не ограничивается сознательно: вход выше уровня — это развитие (раздел 5.0).
   ===================================================================== */
const GCORE_LEVELS = ['A1','A2','B1','B2'];
const GCORE_MAX_BANNED = 60;    // потолок списка маркеров в запрос (4.40: было 40 — не хватало на старшие уровни)
const SCAFFOLD_CAP = { A1:2, A2:3 };   // потолок прочерков в каркасе (раздел 5.0)
const GCORE_SCHEMA = '{"themes":[{"order":1,"title":"служебное название темы на родном","gist":"одна фраза сути на родном","cefr":"A1|A2|B1|B2","requires":[],"foundation":true,"markers":["слово или форма целевого языка"]}]}';
const GCORE_RULES = 'Верни карту грамматических тем для пары target_lang→native_lang по уровням levels, В МЕТОДИЧЕСКОМ ПОРЯДКЕ изучения. '
  + 'order — сквозная нумерация с 1 по возрастанию сложности. requires — номера тем, которые ОБЯЗАНЫ быть пройдены раньше; ссылаться вперёд (на больший order) ЗАПРЕЩЕНО. '
  + 'foundation=true — ТОЛЬКО для тем, без которых в этом языке предложение не строится физически (личные местоимения, настоящее время, базовый порядок слов, именительная форма существительного). '
  + 'Признак означает «разрешено требовать в задании с первого урока», поэтому раздавай его скупо — обычно 3–5 тем на весь A1. '
  + 'markers — КОНКРЕТНЫЕ слова и формы целевого языка, по которым тему видно в тексте (для темы «предлоги с дательным» в немецком: mit, aus, zu, nach, bei, von, dem, der, mir, dir). '
  + 'Для СТРУКТУРНЫХ тем (порядок слов, интонация вопроса), которые словами не опознаются, markers — ПУСТОЙ массив: это законное значение, а не ошибка. '
  + 'Не пиши в markers слова, которые в языке значат и что-то другое вне темы, если это создаст ложное срабатывание чаще, чем верное. '
  + 'ФОРМА МАРКЕРА ЗАВИСИТ ОТ УСТРОЙСТВА ЯЗЫКА (критично). Если грамматика выражается ОТДЕЛЬНЫМИ СЛОВАМИ — предлогами, артиклями, частицами, вспомогательными глаголами — маркер это слово целиком (mit, dem, the, ne, pas). '
  + 'Если грамматика выражается ОКОНЧАНИЯМИ или суффиксами (турецкий, финский, венгерский, эстонский и подобные) — записывай маркер как суффикс с ведущим дефисом: "-den", "-lar", "-ssa". '
  + 'Если в языке нет пробелов между словами (китайский, японский, тайский) — записывай маркер ровно той цепочкой знаков, какой он встречается в тексте. '
  + 'В одном маркере не смешивай слово и окончание. Для языков с богатой морфологией перечисляй реальные употребимые формы, а не словарную. '
  + 'title и gist — на native_lang. Они служебные, человеку не показываются, поэтому title может быть точным и терминологичным; gist — одна короткая фраза без терминов. '
  + 'Тем на уровень — сколько их реально есть в этой паре, число не подгоняй. '
  + 'ПАРАДИГМА НЕ ДРОБИТСЯ (критично, QUEUE-64). Одна тема = ОДНА ЦЕЛАЯ парадигма. ЗАПРЕЩЕНО разносить один и тот же набор форм по отдельным темам по роду, числу, лицу или падежу: '
  + '«неопределённый артикль (мужской род)», «неопределённый артикль (женский род)», «неопределённый артикль (средний род)» — ОДНА тема «неопределённый артикль» со всеми формами в markers. '
  + 'Так же: спряжение глагола — одна тема на все лица, а не тема на каждое лицо; склонение — одна тема на всю таблицу. '
  + 'Причина методическая: формы парадигмы различаются между собой, и учащийся понимает их только в сопоставлении. Разрезанная парадигма учит ложному правилу — в немецком «ein» одинаков для мужского и среднего рода, и тема «ein = мужской род» прямо дезинформирует. '
  + 'Разделять на разные темы можно только то, что в языке действительно изучается порознь и различается по СУТИ (определённый и неопределённый артикль — разные темы; настоящее и прошедшее время — разные темы).';

/* QUEUE-64: поколение карты грамматики. Поднимается, когда меняются ПРАВИЛА построения
   карты (не содержание одной темы). Карты прежних поколений пересобираются один раз. */
const GCORE_GEN = 2;

const GrammarCore = {
  _failed: false,
  list(){ return (DB && Array.isArray(DB.gcore)) ? DB.gcore : []; },
  meta(){ if (!Array.isArray(DB.gcore)) DB.gcore = [];
          if (!DB.gcoreMeta) DB.gcoreMeta = { built:false, migrated:false };
          if (DB.gcoreMeta.built && !DB.gcoreMeta.gen) DB.gcoreMeta.gen = 1;   // карта, собранная до QUEUE-64
          return DB.gcoreMeta; },
  lvlFor(){ const l = (DB && DB.profile && DB.profile.cefr) || 'A1';
            return GCORE_LEVELS.includes(l) ? l : 'A1'; },
  // индекс уровня темы относительно текущего: тема выше текущего уровня в расчёт не идёт
  _upTo(lvl){ const i = GCORE_LEVELS.indexOf(GCORE_LEVELS.includes(lvl) ? lvl : 'A1');
              return this.list().filter(t => GCORE_LEVELS.indexOf(t.cefr) <= i); },

  needsBuild(){
    if (this._failed || !DB || !DB.profile) return false;
    if (DB.profile.cefr === 'A0') return false;      // на A0 своя методика (a0_lesson), карта не нужна
    return !this.meta().built;
  },

  /* Карта собрана по прежним правилам (например, с парадигмой, разрезанной по родам) —
     пересобрать один раз. Уроки, словарь и Свод правил не трогаются: меняется только карта тем. */
  needsRebuild(){
    if (this._failed || !DB || !DB.profile) return false;
    if (DB.profile.cefr === 'A0') return false;
    const m = this.meta();
    return !!m.built && (m.gen || 1) < GCORE_GEN;
  },

  async build(onStep){
    const p = DB.profile;
    onStep && onStep(t('Строю карту грамматики языка…'));
    const r = await Gemini.call({
      task:'generate_grammar_core', target_lang:p.targetLang, native_lang:p.nativeLang,
      levels: GCORE_LEVELS, rules: GCORE_RULES
    }, GCORE_SCHEMA);
    const raw = (r && Array.isArray(r.themes)) ? r.themes : [];
    if (!raw.length) throw new Error('empty grammar core');
    DB.gcore = raw.filter(t => t && t.title).map((t,i) => ({
      order: (+t.order || i+1),
      title: String(t.title).trim(),
      gist: String(t.gist||'').trim(),
      cefr: GCORE_LEVELS.includes(t.cefr) ? t.cefr : 'A1',
      requires: Array.isArray(t.requires) ? t.requires.map(Number).filter(n=>n>0) : [],
      foundation: t.foundation === true,
      markers: Array.isArray(t.markers) ? t.markers.map(m=>String(m||'').trim()).filter(Boolean).slice(0,20) : [],
      status: 'не пройдена', lesson: ''
    })).sort((a,b)=>a.order-b.order);
    this.meta().built = true;
    this.meta().gen = GCORE_GEN;
    this.migrateProgress();
    Storage.save(DB);
  },

  /* Пересборка карты с сохранением прогресса (QUEUE-64).
     Правило переноса: новая тема считается пройденной, только если старая пройденная тема
     совпадает с ней по названию ТОЧНО. Совпадение «по куску» намеренно НЕ засчитывается:
     старая «Неопределённый артикль (мужской род)» — лишь фрагмент новой «Неопределённый
     артикль», полную парадигму человек ещё не видел, и показать её надо один раз.
     Темы уровней НИЖЕ текущего считаются пройденными без сверки — как при миграции 4.30.
     Уроки, счётчик прогресса, словарь и Свод правил не затрагиваются. */
  async rebuild(onStep){
    const before = this.list().map(t => ({ title: t.title, status: t.status, lesson: t.lesson }));
    const passed = new Set(before.filter(t => t.status === 'пройдена').map(t => norm(t.title)));
    const m = this.meta();
    // Флаги built/migrated НЕ сбрасываем: при сбое запроса карта и прогресс остаются нетронутыми,
    // поколение не поднимается, и пересборка честно повторится при следующем запуске.
    // Сброс флагов отправил бы повтор по пути первичной сборки, где перенос идёт сопоставлением
    // по подстроке — а оно как раз пометило бы слитую парадигму пройденной.
    await this.build(onStep);
    const cur = this.lvlFor(), ci = GCORE_LEVELS.indexOf(cur);
    this.list().forEach(t => {
      const ti = GCORE_LEVELS.indexOf(t.cefr);
      if (ti < ci) { t.status = 'пройдена'; t.lesson = t.lesson || 'до пересборки'; return; }
      if (ti === ci && passed.has(norm(t.title))) { t.status = 'пройдена'; t.lesson = 'до пересборки'; return; }
      t.status = 'не пройдена'; t.lesson = '';      // в т.ч. слитая парадигма: покажем целиком один раз
    });
    m.migrated = true;
    Storage.save(DB);
  },

  /* Миграция профиля, созданного до 4.30 (раздел 4.4). Пройденными считаем все темы
     уровней НИЖЕ текущего; внутри текущего уровня — совпавшие по названию со Сводом правил.
     Сопоставление по названию заведомо неточное (до 4.30 заголовки правил модель
     формулировала свободно) — принято сознательно: цена ошибки одно лишнее или одно
     пропущенное правило внутри уровня, дальше карта ведёт точно. */
  migrateProgress(){
    const m = this.meta(); if (m.migrated) return;
    const cur = this.lvlFor(), ci = GCORE_LEVELS.indexOf(cur);
    const titles = (DB.rules||[]).map(r => norm(r.title));
    this.list().forEach(t => {
      const ti = GCORE_LEVELS.indexOf(t.cefr);
      if (ti < ci) { t.status = 'пройдена'; t.lesson = 'до 4.30'; return; }
      if (ti === ci && titles.some(x => x && (x === norm(t.title) || x.includes(norm(t.title)) || norm(t.title).includes(x)))) {
        t.status = 'пройдена'; t.lesson = 'до 4.30';
      }
    });
    m.migrated = true;
  },

  // следующая непройденная тема текущего уровня, у которой закрыты предпосылки
  next(lvl){
    const pool = this._upTo(lvl || this.lvlFor());
    const done = new Set(pool.filter(t=>t.status==='пройдена').map(t=>t.order));
    const open = pool.filter(t => t.status !== 'пройдена');
    // страховка от тупика: модель может выдать циклические или ссылающиеся вперёд requires,
    // и тогда ни одна тема не «готова» — курс молча вернулся бы к выбору темы моделью
    return open.find(t => (t.requires||[]).every(n => done.has(n))) || open[0] || null;
  },
  markPassed(order, code){
    const t = this.list().find(x => x.order === order);
    if (!t) return;
    t.status = 'пройдена'; t.lesson = code || '';
    Storage.save(DB);
  },

  /* Маркеры НЕпройденных тем — то, чего в задании быть не должно.
     Идут в запрос списком конкретных слов (превентивно) и проверяются кодом
     в эталоне и каркасе (постфактум). Абстрактное «не используй дательный»
     модель игнорировала полтора десятка билдов (QUEUE-11/16). */
  /* QUEUE-66: запрещаем маркеры непройденных тем ЛЮБОГО уровня, а не только «до текущего».
     Прежний _upTo давал дыру наизнанку: чем дальше тема от учащегося, тем свободнее её можно
     было требовать. Немецкое будущее время лежит на A2, поэтому на A1 маркер `wird` в запреты
     не попадал вовсе — и в уроке A1.1.12 появилось задание «Sie wird hier sein».
     Порядок: сначала непройденное своего уровня и ниже, потом старшие уровни — при упоре
     в GCORE_MAX_BANNED отсекается дальнее, а не ближнее.
     ЗАЩИТА (без неё правка опаснее болезни): слово, которое входит в маркеры пройденной темы
     или темы-фундамента, не запрещается никогда. Одно слово бывает приметой двух тем сразу —
     `ist` примета и настоящего времени (A1, пройдено), и перфекта (A2, нет). Забанив его
     заодно со старшей темой, мы обрушили бы весь A1. */
  bannedMarkers(lvl){
    const cur = lvl || this.lvlFor();
    const ci = GCORE_LEVELS.indexOf(GCORE_LEVELS.includes(cur) ? cur : 'A1');
    const all = this.list();
    // слова, разрешённые пройденным или фундаментом — иммунитет к запрету
    const safe = new Set();
    all.forEach(t => {
      if (t.status === 'пройдена' || t.foundation)
        (t.markers||[]).forEach(m => { const n = norm(m); if (n) safe.add(n); });
    });
    /* 4.40. Прежде список собирался «все маркеры ближних тем, затем дальних» и обрезался общим
       потолком. Одна тема могла занять двадцать мест из сорока, и темы старших уровней вылетали
       целиком — так в задание A1 попал möchte, маркер модальных глаголов уровня A2: модель про
       запрет попросту не слышала. Теперь от каждой темы берём не больше трёх маркеров, а ближние
       и дальние чередуем: ширина охвата важнее глубины по одной теме. */
    const PER_THEME = 3;
    const near = [], far = [];
    all.forEach(t => {
      if (t.status === 'пройдена' || t.foundation) return;
      const ti = GCORE_LEVELS.indexOf(t.cefr);
      const mk = (t.markers||[]).filter(m => !safe.has(norm(m))).slice(0, PER_THEME);
      (ti <= ci ? near : far).push(mk);
    });
    const out = [];
    for (let i = 0; i < PER_THEME; i++) {
      near.forEach(mk => { if (mk[i]) out.push(mk[i]); });
      far.forEach(mk  => { if (mk[i]) out.push(mk[i]); });
    }
    return [...new Set(out)].slice(0, GCORE_MAX_BANNED);
  },
  // названия разрешённого — пройденное плюс фундамент (для формулировки запроса)
  allowedTitles(lvl){
    return this._upTo(lvl || this.lvlFor())
      .filter(t => t.status === 'пройдена' || t.foundation)
      .map(t => t.title);
  },
  // Найденные маркеры в тексте. Три способа сопоставления, потому что грамматика
  // в 72 парах живёт по-разному: отдельными словами (нем., англ., фр.), окончаниями
  // (тур., фин., венг.) и вообще без пробелов между словами (кит., яп., тайск.).
  hitMarkers(text, lvl){
    const banned = this.bannedMarkers(lvl); if (!banned.length) return [];
    const t = norm(text);
    const toks = t.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
    const set = new Set(toks);
    // язык без пробелов: весь текст схлопывается в один токен, пословно искать нечего
    const nonSeg = toks.length <= 1 && t.length > 8;
    return banned.filter(m => {
      const raw = String(m||'').trim();
      // дефис проверяем ДО norm(): norm срезает дефисы вместе с прочей пунктуацией
      const isSuffix = /^[-‑–—]/.test(raw);
      const mn = norm(raw); if (!mn) return false;
      if (isSuffix) {                                  // суффикс-маркер: -den, -lar, -ssa
        return toks.some(x => x.length > mn.length && x.endsWith(mn));
      }
      const parts = mn.split(/\s+/).filter(Boolean);
      if (parts.length > 1) return t.includes(mn);     // многословный оборот
      if (set.has(parts[0])) return true;              // обычное слово по границам
      return nonSeg && t.includes(parts[0]);           // иероглифика: только подстрокой
    });
  }
};
/* Единый блок правил уровня для quest_step — и для Квеста, и для Суперквеста (4.30).
   Раньше эти правила были вписаны в два промпта по отдельности и разошлись:
   «одно простое предложение на A1» и «запрет выдачи ответа» жили ТОЛЬКО в Суперквесте,
   отсюда перегруз обычного квеста. Теперь источник один — разойтись больше нечему. */
function levelPromptBlock(cefr){

  const allowed = GrammarCore.allowedTitles(cefr);

/* Потолок уровня для живого разговора (QUEUE-62, ред. 4.30 раздела 5.B).
   Ключевое отличие от задания урока: ограничение стоит на СЛОЖНОСТИ вопроса,
   а не на лексике. Новые слова в реплике свободны — их закрывают тап-перевод и 📘.
   Запрещено другое: спрашивать так, что ответить можно только непройденной

function dialogueLevelBlock(cefr){
  const banned  = GrammarCore.bannedMarkers(cefr);

  let s = 'УРОВЕНЬ РАЗГОВОРА (критично, QUEUE-62). Ограничение — на СЛОЖНОСТИ вопроса, НЕ на словах. '

  if (cefr === 'A1') s += 'На A1 реплика = ОДНО-ДВА коротких предложения и РОВНО ОДИН вопрос. Два вопроса в одной реплике ЗАПРЕЩЕНЫ («Что ты любишь? Читаешь книги или любишь путешествовать?» — неверно: это два смысловых шага). Спрашивать о двух вещах сразу ЗАПРЕЩЕНО. ';

/* Как относиться к ответу ученика (QUEUE-62). Разговор развивает устную речь:
   задача — чтобы человек перестал бояться говорить, поэтому придирки вреднее ошибок.
   Плюс вход шумный: модель получает ТЕКСТ распознавания, а не голос. */
function dialogueToleranceBlock(inputMode, alts){
  let s = 'ОЦЕНКА ОТВЕТА — ТОЛЬКО СМЫСЛ И ГРАММАТИКА (критично, QUEUE-62). '
    + 'Жёсткой привязки к одной формулировке НЕТ: любой ответ, который подходит по смыслу к твоему вопросу и грамматически верен, — правильный. '
    + 'ЗАПРЕЩЕНО переписывать верный ответ ученика на свой «предпочтительный» или «более естественный» вариант. gentle_correction заполняй ТОЛЬКО в двух случаях: (1) ответ не подходит по смыслу к вопросу; (2) грамматика действительно сломана (неверное спряжение, порядок слов, рассогласование). Во всех остальных случаях gentle_correction = null и поддержи ученика. '
    + 'РЕГИОНАЛЬНЫЕ И РАЗГОВОРНЫЕ ВАРИАНТЫ — НЕ ОШИБКА: местные приветствия, диалектные формы, просторечие и стилистические различия целевого языка законны. Считать единственно верным один вариант ЗАПРЕЩЕНО. ';
  if (inputMode === 'voice') {
    s += 'ВХОД — РАСПОЗНАВАНИЕ РЕЧИ (критично). Ученик говорил ГОЛОСОМ; ты получаешь текст автоматического распознавания, а не саму речь. Ошибки распознавания неизбежны: акцент, местное произношение, слипшиеся слова, похожие по звучанию слова, пропавшие или лишние окончания. '
      + 'Расхождение, объяснимое созвучием или сбоем распознавания, — это ШУМ, а НЕ ошибка ученика: понимай по смыслу разговора и НЕ поправляй такое никогда. Поправляй только то, что не объяснить распознаванием. Ученик не должен получить замечание за то, чего не говорил. '
      + 'Орфографию и заглавные буквы при голосовом вводе не оценивай вообще. ';
    if (alts && alts.length > 1) s += 'ВАРИАНТЫ РАСПОЗНАВАНИЯ: устройство вернуло несколько гипотез одной и той же фразы (поле user_speech_alternatives, по убыванию уверенности). Выбери ту, которая осмысленна в контексте разговора, и отвечай на неё; остальные игнорируй. Разночтения между гипотезами — шум распознавания, не ошибки. ';
  } else {
    s += 'ВХОД — КЛАВИАТУРА: ученик напечатал ответ сам, опечатки оценивай мягко, по смыслу. ';
  }
  return s;
}

/* 4.41 (QUEUE-106): тема текущего урока. Раньше в запрос уходили только пройденные темы и

// прочерки в каркасе: опора не должна превращаться в пустую строку (раздел 5.0)
function scaffoldBlanks(sc){ return (String(sc||'').match(/___+/g) || []).length; }
function scaffoldOverloaded(sc, lvl){
  const cap = SCAFFOLD_CAP[lvl]; if (!cap) return false;
  return scaffoldBlanks(sc) > cap;
}

// экран сборки Ядра: один раз при создании профиля и разово при миграции старого профиля
async function coreBuildScreen(next){
  Screen.loader(t('Собираю словарь языка — это один раз…'));
  try { await Core.build(msg => Screen.loader(msg)); }
  catch(e){
    Core._failed = true;                                  // не зацикливаемся: урок пойдёт резервным путём
    if (String(e.message||'').startsWith('KEY:')) return keyWizard(true);
    toast('Словарь языка соберём позже — урок будет работать', true);
  }
  // 4.30: карта грамматики — один запрос, тем же экраном ожидания
  if (GrammarCore.needsBuild()) {
    try { await GrammarCore.build(msg => Screen.loader(msg)); }
    catch(e){
      GrammarCore._failed = true;                         // курс идёт прежним путём: тему выбирает модель
      if (String(e.message||'').startsWith('KEY:')) return keyWizard(true);
    }
  } else if (GrammarCore.needsRebuild()) {
    // QUEUE-64: карта прежнего поколения (парадигмы разрезаны по родам) — пересобрать один раз.
    // Сбой не критичен: остаётся прежняя карта, пересборку повторим при следующем запуске.
    try { await GrammarCore.rebuild(msg => Screen.loader(msg || 'Обновляю карту грамматики — это один раз…')); }
    catch(e){
      if (String(e.message||'').startsWith('KEY:')) return keyWizard(true);
      toast('Карту грамматики обновим позже — занятия работают', true);
    }
  }
  next();
}

function boot() {

  Episodes.migrate();                                  // 4.29: снимок прежнего формата — в эпизоды
  if (!Storage.getKey()) return keyWizard();
  const profs = Storage.listProfiles();
  if (profs.length === 0) return onboardingIntro();    // новый пользователь
  /* 4.38: экран выбора показывается ВСЕГДА, в том числе при единственном профиле. Одно
     устройство на нескольких человек — обычное дело, и заход сразу в чужой профиль означал бы
     чужой язык интерфейса ещё до того, как человек скажет, кто он. Этот экран — единственное

/* ---------- Экран выбора профиля (раздел 2.8 / 3.2) ---------- */
/* ---------- Экран выбора профиля (раздел 2.8 / 3.2; оформление 4.38, v81) ----------
   Первое, что человек видит после заставки, и единственное место, где язык принадлежит
   устройству. Оформление продолжает язык заставки: та же нейросеть на canvas, но тише —
   узлов меньше, движение медленнее, линии слабее; экран для выбора, а не для разглядывания.
   Опознавательный знак: каждый профиль несёт постоянный оттенок, выведенный из пары языков,
   — свой профиль в списке узнаётся раньше, чем прочитано имя. Кнопка создания намеренно
   тише карточек: сперва «кто я», и только потом «завести нового».
   `create:false` — вход из главного меню «Сменить профиль»: только выбор, без создания. */
function profileHue(p){
  const src = String((p&&p.nativeLang)||'') + '>' + String((p&&p.targetLang)||'');
  let h = 0; for (let i=0;i<src.length;i++) h = (h*31 + src.charCodeAt(i)) % 360;
  return h;
}
function ambientNet(cv){
  if (!cv || !cv.getContext) return;
  const slow = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ctx = cv.getContext('2d'), DPR = Math.min(window.devicePixelRatio||1, 2);
  let W=0, H=0, nodes=[];
  function measure(){
    W = cv.clientWidth || window.innerWidth || 360;
    H = cv.clientHeight || window.innerHeight || 640;
    cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  function seed(){
    const N = Math.max(14, Math.min(26, Math.round(W*H/34000)));   // вдвое реже, чем на заставке
    nodes = [];
    for (let i=0;i<N;i++) nodes.push({
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-.5)*0.10, vy: (Math.random()-.5)*0.10,   // и заметно медленнее
      r: 1 + Math.random()*1.4, ph: Math.random()*Math.PI*2
    });
  }
  function frame(now){
    if (!cv.isConnected) return;                                  // экран сменился — цикл гаснет
    ctx.clearRect(0,0,W,H);
    const t = now/1000;
    nodes.forEach(n => {
      if (!slow) { n.x += n.vx; n.y += n.vy; }
      if (n.x < 0 || n.x > W) n.vx *= -1;
      if (n.y < 0 || n.y > H) n.vy *= -1;
    });
    for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++){
      const a=nodes[i], b=nodes[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy);
      if (d > 150) continue;
      ctx.strokeStyle = 'rgba(65,184,255,' + (0.055*(1-d/150)).toFixed(3) + ')';
      ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    nodes.forEach(n => {
      const pulse = 0.35 + 0.25*Math.sin(t*0.7 + n.ph);
      ctx.fillStyle = 'rgba(138,92,255,' + (0.20*pulse).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  measure(); seed(); requestAnimationFrame(frame);
  window.addEventListener('resize', () => { measure(); seed(); }, { once:true });
}
function profileSelect(opts) {
  const allowCreate = !opts || opts.create !== false;
  I18N.useDeviceLang();                    // 4.36: профиль ещё не выбран — язык принадлежит устройству

    <div style="position:relative;z-index:1">

      <h1>Кто занимается?</h1>
      <p class="sub">${allowCreate ? 'Выберите профиль или создайте новый — для другого языка или другого человека.' : 'Выберите профиль для занятий.'}</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px">
        ${profs.map(p=>{
          const h = profileHue(p);
          return `

/* ---------- Заставка при запуске (Splash): логотип + нейросеть ----------
   Короткая (~2.5 с), показывается каждый раз, тап — пропустить. */
function splashScreen(done) {
  const ov = document.createElement('div');
  ov.id = 'splash';
  ov.style.cssText = 'position:fixed;inset:0;z-index:200;background:radial-gradient(120% 90% at 50% 40%,#0A1424 0%,#060A12 70%);'
    + 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;'
    + 'transition:opacity .5s ease;opacity:1;cursor:pointer';
  ov.innerHTML = `
    <canvas id="splashNet" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
    <div style="position:relative;display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(8px)"
         id="splashLogo">
      <div style="width:52px;height:52px;border-radius:14px;background:#0B1020;border:1px solid #1A2540;
        display:grid;place-items:center;box-shadow:0 0 30px rgba(65,184,255,.35)">
        <span style="font-family:'Chakra Petch';font-weight:700;font-size:30px;
          background:linear-gradient(135deg,#41B8FF,#8A5CFF 50%,#FF8A3C);-webkit-background-clip:text;
          background-clip:text;color:transparent">A</span>
      </div>
      <div style="font-family:'Chakra Petch';font-weight:700;font-size:34px;letter-spacing:.12em;color:#E8EDF7">AI<span
        style="background:linear-gradient(135deg,#41B8FF,#8A5CFF 50%,#FF8A3C);-webkit-background-clip:text;
        background-clip:text;color:transparent">LEX</span></div>
    </div>
    <div id="splashStatus" style="position:relative;font-family:'Chakra Petch';font-size:12px;letter-spacing:.28em;
      color:#5A6680;text-transform:uppercase;opacity:0;transition:opacity .6s">SYSTEM ONLINE · ${APP_VERSION}</div>`;
  document.body.appendChild(ov);

  // анимация логотипа и статуса
  const logo = ov.querySelector('#splashLogo');
  requestAnimationFrame(()=>{ logo.style.transition='opacity .7s ease,transform .7s ease'; logo.style.opacity='1'; logo.style.transform='none'; });
  setTimeout(()=>{ ov.querySelector('#splashStatus').style.opacity='1'; }, 700);

  // нейросеть на canvas: узлы вспыхивают и соединяются линиями
  const cv = ov.querySelector('#splashNet'), ctx = cv.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio||1, 2);
  let W=0, H=0, nodes = [], raf, t0 = performance.now(), running = true, seeded = false;
  function measure(){
    W = cv.clientWidth || window.innerWidth || 360;
    H = cv.clientHeight || window.innerHeight || 640;
    cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  function seed(){
    const N = Math.max(28, Math.min(48, Math.round(W*H/15000)));
    nodes = [];
    for (let i=0;i<N;i++) nodes.push({ x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-.5)*.28, vy:(Math.random()-.5)*.28, p:Math.random()*Math.PI*2 });
    seeded = true;
  }
  function draw(now){
    if (!running) return;
    // самовосстановление: если разметка ещё не дала размеры — измеряем и рассаживаем
    if (!seeded || W===0 || H===0){ measure(); if (W>0 && H>0) seed(); raf=requestAnimationFrame(draw); return; }
    ctx.clearRect(0,0,W,H);
    // линии между близкими узлами
    for (let i=0;i<nodes.length;i++){
      const a=nodes[i];
      for (let j=i+1;j<nodes.length;j++){
        const b=nodes[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy);
        if (d<130){ const al=(1-d/130)*0.4;
          ctx.strokeStyle=`rgba(65,184,255,${al})`; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      }
    }
    // узлы — вспыхивающие огоньки
    nodes.forEach(n=>{
      n.x+=n.vx; n.y+=n.vy; n.p+=0.05;
      if (n.x<0||n.x>W) n.vx*=-1; if (n.y<0||n.y>H) n.vy*=-1;
      const pulse=0.55+0.45*Math.sin(n.p), r=1.8+pulse*2;
      const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*4);
      const hot=(Math.sin(n.p*0.7)>0.6);
      g.addColorStop(0, hot?`rgba(255,138,60,${0.95*pulse})`:`rgba(120,200,255,${0.95*pulse})`);
      g.addColorStop(1,'rgba(10,20,36,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(n.x,n.y,r*4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=hot?'#FFB071':'#9ED7FF'; ctx.beginPath(); ctx.arc(n.x,n.y,r*0.6,0,Math.PI*2); ctx.fill();
    });
    raf=requestAnimationFrame(draw);
  }
  window.addEventListener('resize', measure);
  // старт после того, как браузер построил разметку оверлея (иначе размеры = 0)
  requestAnimationFrame(()=>{ measure(); if (W>0 && H>0) seed(); raf=requestAnimationFrame(draw); });

  let finished=false;
  function finish(){
    if (finished) return; finished=true; running=false;
    cancelAnimationFrame(raf);
    ov.style.opacity='0';
    setTimeout(()=>{ ov.remove(); done && done(); }, 500);
  }
  ov.onclick = finish;                 // тап — пропустить
  setTimeout(finish, 2500);            // авто-уход ~2.5 с
}

  Screen.show(`

    </div>
    <button class="btn btn-primary" id="retry">Проверить ещё раз</button>
    <button class="btn btn-ghost" id="anyway">Сохранить ключ и продолжить без проверки</button>`);
  $('#retry').onclick = async () => {
    Screen.loader('Проверяю связь…');
    try { await Gemini.validateKey(); toast('Ключ работает ✓'); boot(); }
    catch(e) { if (String(e.message).startsWith('KEY:')) { toast('Ключ не принят', true); keyWizard(true); } else networkBlocked(); }

  $('#anyway').onclick = () => { toast('Ключ сохранён', true); boot(); };
}

/* ============================================================
   СИСТЕМА ОДНОРАЗОВЫХ ПОДСКАЗОК (ONBOARDING HINTS)
   Показывается один раз при первом входе на экран.
   Флаги хранятся в localStorage под ключами hint_shown_*.
   ============================================================ */
const Hints = {
  shown(key) { return !!localStorage.getItem('hint_shown_' + key); },
  mark(key)  { localStorage.setItem('hint_shown_' + key, '1'); },
  reset()    { Object.keys(localStorage).filter(k=>k.startsWith('hint_shown_')).forEach(k=>localStorage.removeItem(k)); },

  show(key, html) {
    if (Hints.shown(key)) return;
    Hints.mark(key);
    const ov = document.createElement('div');
    ov.id = 'hintOverlay';
    ov.style.cssText = 'position:fixed;inset:0;z-index:80;background:rgba(4,7,14,.72);display:flex;align-items:flex-end;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0)';
    ov.innerHTML = `
      <div style="width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);
                  border-radius:20px 20px 0 0;padding:20px 20px 28px;position:relative">
        <div style="font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-bottom:10px">${t('Подсказка')}</div>
        <div id="hintBody" style="font-size:15px;line-height:1.55;color:var(--text)">${html}</div>
        <button id="hintClose" style="margin-top:18px;width:100%;padding:12px;border-radius:10px;
          background:var(--accent);border:none;color:#fff;font-size:15px;font-weight:600;cursor:pointer">
          ${t('Понятно ✓')}
        </button>
      </div>`;
    document.body.appendChild(ov);
    // 4.25: перевести абзац подсказки на язык профиля (путь блоков), с фолбэком на русский
    try { if (typeof localizeBlocks === 'function') localizeBlocks(ov.querySelector('#hintBody'), 'hint_'+key, html); } catch(_){}
    document.getElementById('hintClose').onclick = () => ov.remove();
    ov.onclick = e => { if (e.target === ov) ov.remove(); };
  }
};

/* 4.38: родной язык — ПЕРВЫЙ вопрос. Раньше он стоял вторым, и человек успевал ответить на
   вопрос об имени на языке устройства. Теперь язык устройства нужен ровно на двух экранах:
   выбор профиля и этот первый вопрос; всё остальное идёт уже на родном. */
const PROFILE_Q = [
  { k:'nativeLang', q:'Ваш родной язык?',                type:'lang' },
  { k:'targetLang', q:'Какой язык будем изучать?',       type:'lang' },
  { k:'name',       q:'Как вас зовут?',                  type:'text',   ph:'Имя' },
  { k:'age',        q:'Сколько вам лет?',                type:'number', ph:'Возраст' },
  { k:'interests',  q:'Ваши интересы и сфера деятельности?', type:'area',
    ph:'Например: наладка станков с ЧПУ, столярное дело, рыбалка…',
    note:'Самое важное поле: на нём строятся все квесты и рассказы.' },
];
/* Инициализация виджета выбора языка с поиском */
/* 4.44 (QUEUE-119): подпись языка в списке. Список показывал только самоназвание (`ქართული`,
   `മലയാളം`, `বাংলা`), и человеку, не читающему эту письменность, выбрать нужную строку почти
   невозможно. Два списка решают разные задачи, поэтому устроены по-разному:

   • выбор РОДНОГО — кто перед нами, ещё неизвестно, интерфейс на языке устройства: основным
     идёт название на языке устройства, самоназвание в скобках («Georgian (ქართული)»);
   • выбор ИЗУЧАЕМОГО — родной язык уже известен, поэтому список пишется целиком на нём
     («chineză», «japoneză»), самоназвание там только мешает.

   Названия берутся у браузера (`Intl.DisplayNames`) — без сети, без модели, мгновенно.
   Скобки показываются, только если написание отличается от самоназвания: «Deutsch (Deutsch)»
   было бы шумом. */
function langDisplayName(code, inLang) {
  try {
    const dn = new Intl.DisplayNames([inLang], { type:'language' });
    const v = dn.of(code);
    return (v && v !== code) ? v : '';
  } catch(_) { return ''; }
}
function langLabel(l, questionKey) {
  const native = esc(l.n);
  if (questionKey === 'targetLang') {                     // родной уже выбран — пишем на нём
    const inNative = langDisplayName(l.c, I18N.lang || I18N.deviceLang());
    return esc(inNative || l.n);
  }
  const inDevice = langDisplayName(l.c, I18N.deviceLang());   // выбор родного — язык устройства
  if (!inDevice || norm(inDevice) === norm(l.n)) return native;
  return esc(inDevice) + ' <span style="color:var(--dim)">(' + native + ')</span>';
}
function _initLangPicker(defVal) {
  const hidden  = $('#val');
  const search  = $('#langSearch');
  const listEl  = $('#langList');
  const items   = Array.from(listEl.querySelectorAll('.lang-opt'));

  function select(c) {
    hidden.value = c;
    items.forEach(el => {
      const active = el.dataset.c === c;
      el.style.background = active ? 'var(--accent-dim, #1A2540)' : '';
      el.style.color = active ? 'var(--accent, #41B8FF)' : '';
    });
    // прокрутить выбранный в видимую область
    const active = listEl.querySelector(`.lang-opt[data-c="${c}"]`);
    if (active) active.scrollIntoView({block:'nearest'});
  }

  // клик по элементу
  items.forEach(el => el.onclick = () => {
    select(el.dataset.c);
    search.value = el.textContent.trim();
    // скрыть не выбранные, оставить только выбранный — как подтверждение
    filterList('');
  });

  // фильтр при вводе
  function filterList(q) {
    const s = q.toLowerCase();
    items.forEach(el => {
      const match = !s || el.textContent.toLowerCase().includes(s) || el.dataset.c.includes(s);
      el.style.display = match ? '' : 'none';
    });
  }
  search.oninput = () => filterList(search.value);

  // установить начальное значение
  select(defVal);
  const initEl = LANGS.find(l=>l.c===defVal);
  if (initEl) search.value = initEl.n;
}

function askProfile(i, acc) {
  if (i >= PROFILE_Q.length) return placementIntro(acc);
  const q = PROFILE_Q[i];
  let field = '';
  if (q.type === 'lang') {
    field = `
      <div class="lang-picker" id="langPicker">
        <input type="text" id="langSearch" placeholder="${esc(t('Поиск языка…'))}"
          autocomplete="off" autocorrect="off" spellcheck="false"
          style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
                 background:var(--card);color:var(--ink);font-size:16px;box-sizing:border-box;margin-bottom:8px">
        <div id="langList" style="max-height:240px;overflow-y:auto;border-radius:10px;border:1px solid var(--border)">
          ${LANGS.map(l=>`<div class="lang-opt" data-c="${l.c}" style="padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-size:15px">${langLabel(l, q.k)}</div>`).join('')}
        </div>
        <input type="hidden" id="val" value="">
      </div>`;
  } else if (q.type === 'area') {
    field = `<textarea id="val" rows="3" placeholder="${esc(t(q.ph))}"></textarea>`;
  } else {
    field = `<input type="${q.type}" id="val" placeholder="${esc(t(q.ph||''))}">`;
  }
  Screen.show(`
    <div class="eyebrow">${t('Анкета')} · ${i+1} / ${PROFILE_Q.length}</div>
    <h1>${esc(t(q.q))}</h1>
    ${q.note?`<p class="sub">${esc(t(q.note))}</p>`:'<div style="height:6px"></div>'}
    <div class="card">${field}</div>
    <button class="btn btn-primary" id="next">${t('Далее')}</button>`,
    { back: i>0 ? ()=>askProfile(i-1, acc) : null });
  if (q.type==='lang') {
    // дефолтное значение
    // 4.38: подставляем язык устройства, если он есть в списке — человеку чаще всего нужен именно он
    const dev = LANGS.some(l => l.c === I18N.deviceLang()) ? I18N.deviceLang() : 'en';
    const defVal = (q.k==='targetLang') ? (acc.nativeLang==='en' ? 'de' : 'en') : dev;
    const initVal = acc[q.k] || defVal;
    _initLangPicker(initVal);
  }
  $('#next').onclick = () => {
    const v = $('#val').value.trim();
    if (!v) return toast(t('Заполните поле'), true);
    if (q.k==='targetLang' && v===acc.nativeLang) return toast(t('Целевой язык должен отличаться от родного'), true);
    /* 4.36/4.38: единственная точка переключения языка интерфейса в анкете. До неё — язык
       устройства, после — выбранный родной. Ждём перевода строк анкеты здесь и сейчас: фоновая
       очередь не гарантирует, что следующий экран успеет стать родным, а анкету надо заполнять. */
    if (q.k === 'nativeLang' && v) {
      acc[q.k] = v;
      I18N.applyProfileLang({ nativeLang: v });
      return prepareUiLang(() => askProfile(i+1, acc));
    }
    acc[q.k] = q.type==='number' ? +v : v;
    askProfile(i+1, acc);
  };
}

/* Загрузка интерфейса на выбранный родной язык (4.38, v81). Перевод — живой запрос к Gemini,
   поэтому он занимает секунды и может не удаться. Экран честно показывает, что происходит:
   через шесть секунд — что связь медленная, при неудаче — что именно случилось и что делать.
   Молчаливого перехода на английский больше нет: человек либо ждёт, либо решает сам. */
function prepareUiLang(done) {
  if (I18N.lang === 'ru') return done();
  Screen.loader(t('Готовлю интерфейс…'));
  const line = () => document.querySelector('#screen .loader div:last-child');
  const slow = setTimeout(() => {
    const el = line();
    if (el && !/\d/.test(el.textContent)) el.textContent = t('Связь медленная — подождите ещё немного…');
  }, 8000);
  I18N.preloadOnboarding((n, total) => {           // 4.40: ход виден — загрузка занимает секунды
    const el = line();
    if (el) el.textContent = t('Готовлю интерфейс…') + ' ' + Math.min(n, total) + '/' + total;
  }).then(ok => {
    clearTimeout(slow);
    if (ok) return done();
    const why = I18N._lastError === 'KEY'
      ? t('Google не принял ключ доступа.')
      : t('Нет связи с сервером перевода.');
    Screen.show(`
      <div class="eyebrow">${t('Язык интерфейса')}</div>
      <h1>${t('Не удалось загрузить перевод')}</h1>
      <p class="sub">${why} ${t('Проверьте интернет и попробуйте снова — или продолжайте на английском, язык профиля от этого не изменится.')}</p>
      <button class="btn btn-primary" id="again">${t('Повторить')}</button>
      <button class="btn btn-ghost" id="skip">${t('Продолжить на английском')}</button>`);
    $('#again').onclick = () => prepareUiLang(done);
    $('#skip').onclick  = done;
  });
}
