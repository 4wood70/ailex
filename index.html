/* =====================================================================
   4.34 — PLACEMENT TEST: НАБОР ВОПРОСОВ ГАРАНТИРУЕТ ПРИЛОЖЕНИЕ (QUEUE-79)
   Порог подтверждения уровня («2 верных из 3» — большинство) был записан в коде
   числом, а фактическое число вопросов на уровень приходило от модели и никак не
   проверялось: единственной проверкой было qs.length < 6. Ответ из 10 вопросов
   (по 2 на уровень) молча превращал большинство в требование 100% — одна промашка
   на A2 роняла человека со школьным немецким на A1. Порог — это методика, а методика
   по конституции принадлежит приложению. Теперь набор нормализует код: группировка
   по уровням в порядке A1→C1, отсев брака и дублей, обрезка до трёх, добор
   недостающего отдельным запросом — и только потом тест.
   Заодно закрыты три спутника: порядок вопросов задаёт приложение (раньше шли в
   порядке ответа модели, и перемешанные уровни ломали лестницу); лексический вопрос
   больше не пополняет счётчик ошибок (по спеке он не участвует в ранней остановке,
   но его ошибка срабатывала на следующем грамматическом вопросе); уровень без
   вопросов не считается «проваленным» на пустом множестве.
   ===================================================================== */
const PLACEMENT_LEVELS    = ['A0','A1','A2','B1','B2','C1'];   // 4.40: лестница начинается с A0
const PLACEMENT_PER_LEVEL = 4;    // 2 грамматики + 1 лексика + 1 с печатью ответа (4.40)
/* 4.40: уровень засчитан, только если верны ОБА грамматических вопроса И вопрос с печатью
   ответа. Лексика на повышение не влияет вовсе: на родственной паре (румынский→итальянский)
   слова узнаются даром, и вопрос на узнавание не доказывает владения языком. Прежний порог
   «два из трёх при четырёх вариантах» проходился случайным угадыванием примерно в шестнадцати
   случаях из ста на уровень, а на родственной паре — заметно чаще. */
const PLACEMENT_NEED_GRAM = 2;    // оба грамматических
const PLACEMENT_PASS      = 2;    // (историческое имя, оставлено для совместимости)
const PLACEMENT_SCHEMA =
  `{"questions":[
      {"level":"A0","skill":"grammar","question":"вопрос на чтение: какой звук даёт буква / как читается короткое слово","options":["в1","в2","в3","в4"],"correct_index":0},
      {"level":"A0","skill":"produce","question":"условие на родном: напишите на целевом одно короткое слово","answer":"эталон одним словом","accept":["допустимый вариант"]},
      {"level":"A1","skill":"grammar","question":"вопрос на целевом: ТОЛЬКО структура/порядок слов/спряжение, лексика уровня НИЖЕ A1","options":["в1","в2","в3","в4"],"correct_index":1},
      {"level":"A1","skill":"vocab","question":"узнавание типичного слова A1","options":["в1","в2","в3","в4"],"correct_index":2},
      {"level":"A1","skill":"produce","question":"условие на родном: напишите фразу на целевом (1-4 слова)","answer":"эталонная фраза","accept":["равноценный вариант"]}
    ]} — РОВНО ПО 4 вопроса на КАЖДЫЙ запрошенный уровень: 2 grammar + 1 vocab + 1 produce. Меньше четырёх на уровень — брак ответа.
    ЯЗЫК УСЛОВИЯ (критично, 4.42): поле question — ВСЕГДА на native_lang, на ВСЕХ уровнях без исключения, включая A0 и C1.
    Человек проходит тест, ЧТОБЫ выяснить, знает ли он язык, — условие на целевом языке он прочитать не может по определению.
    Неверно: «Wie wird das 'ie' in 'Biene' ausgesprochen?» / «Scegli la forma corretta del verbo essere».
    Верно: «Как читается „ie“ в слове „Biene“?» / «Выберите правильную форму глагола essere: „Io ___ italiano“».
    На целевом языке остаётся ТОЛЬКО материал, который оценивается: сама буква, слово, фраза с пропуском, варианты ответа.
    ВАРИАНТЫ ОТВЕТА (критично, 4.42): в options не должно быть служебных слов целевого языка — только сам оцениваемый материал.
    Неверно: «wie 'e'», «wie 'ei'». Верно: «[e]», «[ei]», «[a]», «[i]».
    A0 — проверка ЧТЕНИЯ, а не грамматики: узнать звук буквы, прочитать короткое слово, понять простейшее слово. Никакой грамматики на A0 быть не должно.
    grammar: варианты на целевом языке, лексика строго из уровня НИЖЕ тестируемого — проверяется структура, а не словарный запас.
    vocab: узнавание слова целевого языка → перевод (или наоборот).
    produce (критично, 4.40): вопрос БЕЗ вариантов — человек печатает ответ сам. question — условие СТРОГО на native_lang, без единого слова target_lang и без самой целевой фразы. answer — короткий эталон на целевом (1-4 слова, на A0 — одно слово). accept — 1-3 равноценных варианта ответа (другой порядок слов, синоним), БЕЗ форм с ошибками. Ответ проверяется сравнением строк на устройстве, поэтому эталон обязан быть однозначным: не задавай вопросов, где верных ответов много.
    Сложность produce растёт с уровнем: A0 — одно слово, A1 — короткая фраза настоящего времени, A2 и выше — конструкция уровня.
    correct_index — индекс верного варианта для grammar и vocab. Вопросы по возрастанию сложности.`;

/* 4.40: вопрос с печатью ответа (produce) приходит без вариантов, поэтому нормализация
   разделена по типам. Пустой accept — законное значение: эталон один. */
function placementNormalize(list) {
  const by = {}; PLACEMENT_LEVELS.forEach(L => by[L] = []);
  (Array.isArray(list) ? list : []).forEach(q => {
    if (!q || !q.question) return;
    const L = String(q.level||'').toUpperCase().trim();
    if (!by[L]) return;                                    // уровень вне лестницы
    const text = String(q.question).trim();
    if (by[L].some(x => norm(x.question) === norm(text))) return;   // модель повторилась
    const skill = (q.skill === 'vocab') ? 'vocab' : (q.skill === 'produce') ? 'produce' : 'grammar';
    if (skill === 'produce') {
      const ans = String(q.answer||'').trim();
      if (!ans) return;                                    // без эталона вопрос бесполезен
      const accept = (Array.isArray(q.accept) ? q.accept : []).map(x => String(x||'').trim()).filter(Boolean).slice(0,3);
      by[L].push({ level:L, skill, question:text, answer:ans, accept });
      return;
    }
    if (!Array.isArray(q.options) || q.options.length < 2) return;
    const ci = +q.correct_index;
    if (!(ci >= 0 && ci < q.options.length)) return;        // без верного ответа вопрос бесполезен
    by[L].push({ level:L, skill, question:text, options:q.options.map(o => String(o)), correct_index:ci });
  });
  return by;
}

/* Проверка печатного ответа — на устройстве, без обращения к модели: ответ короткий и эталон
   однозначный, поэтому сравнения строк достаточно, а лишний сетевой запрос только добавил бы
   задержку иновый источник сбоев. Допуск: регистр, лишние пробелы, знаки препинания и одна опечатка. */
function placementAnswerOk(input, q) {
  const a = norm(String(input||'').replace(/[.,!?;:]/g,' '));
  if (!a) return false;
  const variants = [q.answer, ...(q.accept||[])].map(x => norm(String(x||'').replace(/[.,!?;:]/g,' '))).filter(Boolean);
  return variants.some(v => a === v || editDistance(a, v) <= 1);
}


async function runPlacement(profile) {
  Screen.loader(t('Готовлю вопросы теста…'));
  const req = extra => ({ task:'placement_test', target_lang: profile.targetLang, native_lang: profile.nativeLang,
                          levels: PLACEMENT_LEVELS, per_level: PLACEMENT_PER_LEVEL, ...extra });
  let by;
  try {
    const resp = await Gemini.call(req({}), PLACEMENT_SCHEMA);
    by = placementNormalize(resp && resp.questions);
  } catch(e) { toast(t('Не удалось получить тест — начнём с A1'), true); return finishOnboarding(profile, 'A1'); }

  // Добор: уровни, на которых пришло меньше трёх вопросов. Один дополнительный запрос,
  // и только когда есть что добирать — порог остаётся методическим решением, а не следствием
  // того, сколько строк вернула модель.
  const short = PLACEMENT_LEVELS.filter(L => by[L].length < PLACEMENT_PER_LEVEL);
  if (short.length) {
    try {
      const add = await Gemini.call(req({ levels: short,
        exclude: PLACEMENT_LEVELS.flatMap(L => by[L].map(q => q.question)).slice(0, 20) }), PLACEMENT_SCHEMA);
      const by2 = placementNormalize(add && add.questions);
      short.forEach(L => by2[L].forEach(q => {
        if (by[L].length < PLACEMENT_PER_LEVEL && !by[L].some(x => norm(x.question) === norm(q.question))) by[L].push(q);
      }));
    } catch(_) { /* добор не вышел — работаем тем, что есть, порог считается ниже по факту */ }
  }

  /* 4.40. Лестница A0→C1. Уровень засчитан, только если верны ОБА грамматических вопроса И
     вопрос с печатью ответа; лексика на повышение не влияет (на родственной паре слова
     узнаются даром). Лестница обрывается на первом непройденном уровне — дальше спрашивать
     нечего, и человек не тратит время на заведомо чужие вопросы. */
  // уровень попадает в лестницу, только если его есть чем проверить: иначе он «пройден» даром
  const testable = L => by[L].some(q => q.skill === 'grammar' || q.skill === 'produce');
  const ladder = PLACEMENT_LEVELS.filter(L => by[L].length >= 2 && testable(L));
  if (!ladder.length || ladder[0] !== 'A0') { toast(t('Не удалось получить тест — начнём с A1'), true); return finishOnboarding(profile, 'A1'); }
  const need = {};
  ladder.forEach(L => {
    by[L] = by[L].slice(0, PLACEMENT_PER_LEVEL);
    const g = by[L].filter(q => q.skill === 'grammar').length;
    const p = by[L].filter(q => q.skill === 'produce').length;
    need[L] = { gram: Math.min(PLACEMENT_NEED_GRAM, g), produce: p > 0 };   // требуем всё, что пришло
  });
  const qs = ladder.flatMap(L => by[L]);          // порядок задаёт приложение, а не ответ модели

  let idx = 0, okGram = {}, okProd = {}, stopped = false, lastLevel = null;

  // уровень провален, как только добрать нужное число верных уже невозможно
  const levelDone = (L) => by[L].every(q => qs.indexOf(q) < idx);
  const levelPassed = (L) => (okGram[L]||0) >= need[L].gram && (!need[L].produce || okProd[L]);

  const step = () => {
    if (stopped || idx >= qs.length) return done();
    const q = qs[idx];
    if (lastLevel && q.level !== lastLevel && !levelPassed(lastLevel)) { stopped = true; return done(); }
    lastLevel = q.level;
    const kind = q.skill === 'vocab' ? t('лексика') : q.skill === 'produce' ? t('напишите сами') : t('грамматика');
    const head = `
      <div class="eyebrow">${t('Тест уровня · вопрос')} ${idx+1} / ${qs.length}</div>
      <div class="card">
        <div class="drill-head">
          <span class="n">${esc(q.level)}</span>
          <span style="font-size:11px;color:var(--dim);margin-left:8px">${kind}</span>
        </div>
        <div class="task-text">${esc(q.question)}</div>`;
    if (q.skill === 'produce') {
      Screen.show(head + `
        <textarea id="pans" rows="2" placeholder="${t('Напишите ответ')}"></textarea>
        <button class="btn btn-primary" id="pgo">${t('Ответить')}</button>
        <button class="opt" id="pskip" style="color:var(--dim)">${t('Не знаю')}</button>
      </div>`);
      const send = (val) => {
        if (placementAnswerOk(val, q)) okProd[q.level] = true;
        idx++; step();
      };
      $('#pgo').onclick   = () => send($('#pans').value);
      $('#pskip').onclick = () => send('');
      setTimeout(()=>{ try { $('#pans').focus(); } catch(_){} }, 60);
      return;
    }
    const opts = q.options.map((o,i)=>({o,i}));
    Screen.show(head + `
        ${shuffle(opts).map(x=>`<button class="opt" data-i="${x.i}">${esc(x.o)}</button>`).join('')}
        <button class="opt" data-i="-1" style="color:var(--dim)">${t('Не знаю')}</button>
      </div>`);
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const chosen = +b.dataset.i;
      if (chosen === q.correct_index && q.skill === 'grammar') okGram[q.level] = (okGram[q.level]||0)+1;
      idx++; step();
    });
  };

  const done = () => {
    /* Уровнем считается последняя ПОЛНОСТЬЮ пройденная ступень. При сомнении ставим ниже:
       начать слишком низко — несколько лёгких дней, начать слишком высоко — человек читает
       фразу и не понимает, о чём речь, и бросает. */
    let level = 'A0';
    for (const L of ladder) {
      if (levelPassed(L)) level = L; else break;
    }
    finishOnboarding(profile, level);
  };
  step();
}

/* ---------- Шаг 3: создание базы ---------- */
async function finishOnboarding(profile, cefr) {
  ONBOARDING = false;                // 4.42: профиль создан — шапка снова показывает этап
  profile.cefr = cefr;
  DB = Storage.newDB(profile);
  if (cefr === 'A0') {
    const a0Total = getA0Total(profile.nativeLang, profile.targetLang);
    DB.profile.a0Total = a0Total;
    DB.nextStage = 'A0.1.01';
  } else {
    DB.nextStage = fmtCode(cefr==='C2'?'C1':cefr, 1, 1);
  }
  DB.progress.push({ code:'START', date: today(), words:'', next: DB.nextStage, note:'' });
  Storage.addProfile(DB);          // новый профиль, становится активным
  // 4.25: язык интерфейса привязывается к родному языку профиля; переводы надписей
  // и блоков-подсказок предзагружаются один раз здесь (ключ и язык уже известны) → офлайн далее.
  I18N.applyProfileLang(DB.profile);
  toast('Сохранено ✓');
  // 4.26: интересы уже известны — здесь и только здесь собирается Ядро языка (раздел 4.4)
  if (Core.needsBuild()) {
    Screen.loader(t('Собираю словарь языка — это один раз…'));
    try { await Core.build(msg => Screen.loader(msg)); }
    catch(e){ Core._failed = true; toast('Словарь языка соберём позже — урок будет работать', true); }
  }
  // 4.30: карта грамматики — один запрос там же (раздел 4.4). Сбой курс не блокирует
  if (GrammarCore.needsBuild()) {
    try { await GrammarCore.build(msg => Screen.loader(msg)); }
    catch(e){ GrammarCore._failed = true; }
  }
  const isA0 = cefr === 'A0';
  Screen.show(`
    <div class="eyebrow">Профиль создан</div>
    <h1>${isA0 ? '🔤 Начинаем с основ!' : '<span>Ваш уровень:</span> '+esc(cefr)}</h1>
    <p class="sub">${esc(profile.name)} · ${esc(langName(profile.nativeLang))} → ${esc(langName(profile.targetLang))}</p>
    <p class="sub">${isA0 ? t('Сначала освоим чтение и базовую лексику, затем перейдём к A1.') : t('Первый урок:')} <b style="color:var(--ink)">${esc(isA0 ? (DB.profile.a0Total + ' × A0') : DB.nextStage)}</b></p>
    <button class="btn btn-primary" id="go">К главному меню</button>`);
  $('#go').onclick = mainMenu;
}

/* =====================================================================
   ГЛАВНОЕ МЕНЮ (раздел 3.2, ветвь А) — кольцо Overall Mastery как на макете
   ===================================================================== */
function ringSVG(pct, lvl) {
  const R = 88, C = 2*Math.PI*R, on = C*pct/100;
  return `
  <div class="ring">
    <div class="ticks"></div>
    <svg viewBox="0 0 210 210">
      <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#41B8FF"/><stop offset=".55" stop-color="#2F7DF6"/><stop offset="1" stop-color="#FF8A3C"/>
      </linearGradient></defs>
      <circle cx="105" cy="105" r="${R}" fill="none" stroke="#16203A" stroke-width="10"/>
      <circle cx="105" cy="105" r="${R}" fill="none" stroke="url(#g1)" stroke-width="10"
        stroke-linecap="round" stroke-dasharray="${on} ${C}" style="filter:drop-shadow(0 0 8px rgba(65,184,255,.5))"/>
    </svg>
    <div class="core"><div><div class="lbl"><span>Уровень</span> ${esc(lvl||'')}</div><div class="pct">${pct}%</div></div></div>
  </div>`;
}
/* QUEUE-65: возврат в сохранённый урок. Вынесено из обработчика карточки — теперь точек входа две
   (карточка занятия и страховочная карточка «сироты»), логика должна быть одна. */
function resumeCachedLesson(snap) {
  L = snap;
  L.chunk2 = (L.chunk2 && L.chunk2.state === 'ready')
    ? { state:'ready', promise:null, err:null }
    : { state:'idle', promise:null, err:null };
  if (L.chunk2.state === 'idle') fetchLessonChunk2();
  renderStep();
}

function mainMenu() {
  DB = Storage.load();
  // v68: занятие закончилось — снимаем состояние урока. Иначе шапка (и «Продолжить»)
  // держали бы код уже завершённого занятия: L нигде не обнулялся с самого начала.
  L = null;
  // 4.26 / 4.30: профиль без Ядра языка или без карты грамматики (новый либо созданный раньше)
  if (Core.needsBuild() || GrammarCore.needsBuild() || GrammarCore.needsRebuild()) return coreBuildScreen(mainMenu);
  Core.maybePrefetch();                                      // следующий уровень — фоном, ожидания не видно
  Core.ensureArticles();                                     // 4.35: артикли языка старым профилям
  Core.purgeBadTranslit();                                   // 4.39: транскрипции чужой письменностью
  const p = DB.profile, acc = masteryPercent();
  const lp = levelProgress();
  const next = DB.nextStage;
  const isA0   = next.startsWith('A0.');
  const isExam = next.startsWith('EXAM_');
  const words = DB.vocab.length, mastered = DB.vocab.filter(w=>w.status==='освоено').length;
  const interests = String(p.interests||'').split(/[,;·]/).map(s=>s.trim()).filter(Boolean).slice(0,3);
  const segs = 10, lit = Math.round(lp.pct/100*segs);
  // --- незавершённые занятия (4.29, ред. QUEUE-63): по одному слоту на вид, без срока годности ---
  Episodes.sweepDone();   // снять снимки уже пройденных занятий (в т.ч. сирот от старой схемы хранения)
  const _cl = LessonCache.hydrate(Episodes.latest('lesson'));
  const _ca = Episodes.latest('a0');
  const _cs = Episodes.latest('super');
  const cachedLesson = (_cl && _cl.code && _cl.i > 0 && !_cl.isSuper) ? _cl : null;
  const cachedA0     = (_ca && _ca.code && Array.isArray(_ca.steps) && _ca.steps.length && _ca.stepIdx > 0) ? _ca : null;
  const cachedSuper  = (_cs && _cs.sqScene) ? _cs : null;
  const hasCached = !!cachedLesson;
  const cachedStep = hasCached ? cachedLesson.i : 0;
  const cachedTotal = hasCached ? (cachedLesson.steps||[]).length : 0;
  /* QUEUE-65: одно занятие — одна карточка. Прежде их было две: «Продолжить урок X» возвращала
     на сохранённое место, а «Урок X» вызывала startLesson() и начинала тот же урок ЗАНОВО, молча
     затирая снимок. Один тап не туда уничтожал десятки сделанных заданий без предупреждения.
     Теперь карточка занятия САМА становится продолжением, если по нему есть незавершённый эпизод.
     Отдельной кнопки «начать заново» нет: курс линейный, урок доводится до конца; Суперквест
     тоже сначала завершается, новый начинается после. Условие по коду — страховка: снимок другого
     урока при линейном курсе и одном слоте (QUEUE-63) невозможен, но если он вдруг есть,
     показываем прежние две карточки, чтобы ничего не потерять. */
  const resumeLesson = (hasCached && cachedLesson.code === next) ? cachedLesson : null;
  const resumeA0     = (cachedA0 && cachedA0.code === next) ? cachedA0 : null;
  const orphanLesson = hasCached && !resumeLesson;      // снимок урока, который сейчас не следующий
  const orphanA0     = !!cachedA0 && !resumeA0;
  Screen.show(`
    <h1><span>С возвращением,</span> ${esc(p.name)}!</h1>
    <p class="sub">${esc(langName(p.nativeLang))} → ${esc(langName(p.targetLang))} · <span>уровень</span> ${esc(p.cefr)} · <span>следующий этап:</span> <b style="color:var(--ink)">${esc(next)}</b></p>
    <div class="card glow">
      <div class="ring-wrap">${ringSVG(lp.pct, lp.lvl)}</div>
      <div class="segbar">${Array.from({length:segs},(_,i)=>`<i class="${i<lit?(i>=segs-2?'on hot':'on'):''}"></i>`).join('')}</div>
      <div style="text-align:center;font-size:12px;color:var(--dim);margin:2px 0 6px"><span>Прогресс уровня:</span> <b style="color:var(--ink)">${lp.done}</b> <span>из</span> ${lp.total} <span>уроков</span>${acc?`<span> · точность</span> ${acc}%`:''}</div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim)">
        <span><span>Слов в словаре:</span> <b style="color:var(--ink)">${words}</b></span>
        <span><span>Освоено:</span> <b style="color:var(--ink)">${mastered}</b></span>
      </div>
      ${interests.length?`<div class="chiplist">${interests.map(i=>`<span class="chip">› ${esc(i)}</span>`).join('')}</div>`:''}
    </div>
    <div class="menu-list">
      ${orphanLesson ? `<button class="menu-item" id="mResume" style="border:1px solid var(--accent)"><span class="ic">▶️</span><span class="t"><b><span>Продолжить урок</span> ${esc(cachedLesson.code)}</b><small><span>Задание</span> ${cachedStep} <span>из</span> ${cachedTotal} <span>· прогресс сохранён</span></small></span><span class="chev">›</span></button>` : ''}
      ${orphanA0 ? `<button class="menu-item" id="mResumeA0" style="border:1px solid var(--accent)"><span class="ic">▶️</span><span class="t"><b><span>Продолжить урок</span> ${esc(cachedA0.code)}</b><small><span>Шаг</span> ${esc(String(cachedA0.stepIdx+1))} <span>из</span> ${esc(String((cachedA0.steps||[]).length))} <span>· прогресс сохранён</span></small></span><span class="chev">›</span></button>` : ''}
      ${false ? `<button class="menu-item" id="mResumeSuper" style="border:1px solid var(--accent)"><span class="ic">▶️</span><span class="t"><b>Продолжить Суперквест</b><small>Глава ${esc(String(cachedSuper.actIndex||1))} из ${esc(String(cachedSuper.actsTotal||'?'))} · сцена ${esc(String(cachedSuper.sqScene))} · прогресс сохранён</small></span><span class="chev">›</span></button>` : ''}
      <button class="menu-item" id="mLesson"${resumeLesson||resumeA0?' style="border:1px solid var(--accent)"':''}><span class="ic">${resumeLesson||resumeA0?'▶️':(isA0?'🔤':'🎯')}</span><span class="t"><b>${
        resumeLesson ? '<span>Продолжить урок</span> '+esc(next)
        : resumeA0 ? '<span>Продолжить урок</span> '+esc(next)
        : isExam ? '<span>Экзамен</span> '+esc(next.replace('EXAM_',''))
        : isA0 ? '<span>Урок</span> '+esc(next)
        : 'Урок '+esc(next)}</b><small>${
        resumeLesson ? '<span>Задание</span> '+cachedStep+' <span>из</span> '+cachedTotal+' <span>· прогресс сохранён</span>'
        : resumeA0 ? 'Шаг '+esc(String(resumeA0.stepIdx+1))+' из '+esc(String((resumeA0.steps||[]).length))+' · прогресс сохранён'
        : isExam ? '50 вопросов · порог 85%'
        : isA0 ? 'Чтение, произношение, базовая лексика'
        : '<span>21 задание + рассказ-квест</span>'}</small></span><span class="chev">›</span></button>
      ${(()=>{
        /* 4.39: у режима больше нет служебного имени на экране. Есть история — на кнопке её
           собственное название и зацепка из арки, обе приходят на родном языке вместе с аркой,
           поэтому переводить их не нужно. Истории нет — «Приключение»: слово короткое, есть во
           всех языках без заимствования и не обещает больше, чем внутри. */
        const arc = (cachedSuper && cachedSuper.superStory && cachedSuper.superStory.arc) || null;
        const title = arc && arc.title ? esc(String(arc.title)) : null;
        const hook  = arc && arc.hook  ? esc(String(arc.hook))  : null;
        const head = title || (cachedSuper ? '<span>Приключение</span>' : '<span>Приключение</span>');
        const sub  = cachedSuper
          ? (hook || ('<span>Глава</span> '+esc(String(cachedSuper.actIndex||1))+' <span>из</span> '+esc(String(cachedSuper.actsTotal||'?'))+' <span>· прогресс сохранён</span>'))
          : '<span>Новая история по вашим интересам</span>';
        return `<button class="menu-item" id="mSuper"${cachedSuper?' style="border:1px solid var(--accent)"':''}><span class="ic">${cachedSuper?'▶️':'🔁'}</span><span class="t"><b>${head}</b><small>${sub}</small></span><span class="chev">›</span></button>`;
      })()}
      ${IS_APPLE ? '' : `<button class="menu-item" id="mTalk"><span class="ic">🎙️</span><span class="t"><b>Поговорить</b><small>Голосовой диалог по вашим темам</small></span><span class="chev">›</span></button>`}
      <button class="menu-item" id="mDict"><span class="ic">📒</span><span class="t"><b>Словарь</b><small>${words} <span>слов · трудные и мнемоники</span></small></span><span class="chev">›</span></button>
      <button class="menu-item" id="mRules"><span class="ic">📐</span><span class="t"><b>Свод правил</b><small>${(DB.rules||[]).length} <span>правил · грамматика с примерами</span></small></span><span class="chev">›</span></button>
      <button class="menu-item" id="mProf"><span class="ic">👥</span><span class="t"><b>Сменить профиль</b><small>выбрать другой профиль</small></span><span class="chev">›</span></button>
      <button class="menu-item" id="mSet"><span class="ic">⚙️</span><span class="t"><b>Настройки</b><small>Профиль · ключ · экспорт базы</small></span><span class="chev">›</span></button>
    </div>`);
  if (orphanA0 && document.getElementById('mResumeA0')) {
    document.getElementById('mResumeA0').onclick = () => runA0Lesson(cachedA0);   // 4.29: контент урока A0 в снимке — регенерации нет
  }
  if (orphanLesson && document.getElementById('mResume')) {
    document.getElementById('mResume').onclick = () => resumeCachedLesson(cachedLesson);
  }
  // QUEUE-65: карточка занятия ведёт в сохранённую точку, если она есть, и только иначе начинает заново
  $('#mLesson').onclick = () => {
    if (resumeA0) return runA0Lesson(resumeA0);            // 4.29: контент урока A0 лежит в снимке — регенерации нет
    if (resumeLesson) return resumeCachedLesson(resumeLesson);
    return isExam ? startExam(next) : isA0 ? startA0Lesson(next) : startLesson(next);
  };
  $('#mSuper').onclick  = () => {
    if (cachedSuper) return resumeSuper(cachedSuper);      // QUEUE-46 / QUEUE-65: сначала доводим начатый
    if (isA0) return toast('Суперквест откроется после завершения уровня A0 и первых уроков A1', true);
    DB.vocab.length >= 7 ? startSuperLesson() : toast('Сначала пройдите хотя бы один урок', true);
  };
  if ($('#mTalk')) $('#mTalk').onclick = () => DB.vocab.length >= 3 ? startDialogue() : toast('Сначала пройдите хотя бы один урок', true);
  $('#mDict').onclick   = showDictionary;
  $('#mRules').onclick  = showRules;
  $('#mProf').onclick   = () => profileSelect({ create:false });   // 4.38: создание живёт только на экране запуска
  $('#mSet').onclick    = showSettings;
  Hints.show('analytics', HintTexts.analytics);
}

/* ---------- Словарь (лист 2.3-С) ---------- */
function dictWordKey(w){ return (w.term||'?').trim().replace(/^(der|die|das)\s+/i,''); }   // без ведущего артикля
function dictFirstLetter(w){ return (dictWordKey(w).charAt(0)||'#').toUpperCase(); }
function isIrregularVerb(w){ return (w.part_of_speech==='verb' || /en$/.test(w.term||'')) && (w.is_irregular===true); }
function showDictionary(letter, irrOnly) {
  irrOnly = !!irrOnly;
  let all = DB.vocab.slice();
  if (irrOnly) all = all.filter(isIrregularVerb);
  // группировка по первой букве САМОГО СЛОВА (артикль der/die/das игнорируется)
  const groups = {};

// Разбор строки: "[Категория] Термин [транскрипция] — перевод" (категория/транскрипция необязательны)
function parseImportLine(line) {
  let s = String(line).trim();
  if (!s || s.startsWith('#') || s.startsWith('=') || /^[А-ЯA-Z0-9 .]+$/.test(s) && !s.includes('—') && !s.includes('-')) {
    // строка-заголовок/комментарий без пары термин-перевод — пропускаем
  }
  if (!s || s.startsWith('#') || s.startsWith('=')) return null;
  let category = '';
  const mCat = s.match(/^\[([^\]]+)\]\s*/);
  if (mCat) { category = mCat[1].trim(); s = s.slice(mCat[0].length); }
  // разделитель термин/перевод: тире (—, –, -) — берём первое " — " или " - "
  const sep = s.match(/\s[—–-]\s/);
  if (!sep) return null;
  const idx = s.indexOf(sep[0]);
  let left = s.slice(0, idx).trim();
  const translation = s.slice(idx + sep[0].length).trim();
  if (!left || !translation) return null;
  // транскрипция в [...] внутри левой части
  let translit = '';
  const mTr = left.match(/\[([^\]]+)\]/);
  if (mTr) { translit = '['+mTr[1].trim()+']'; left = left.replace(mTr[0], '').trim(); }
  const term = left;
  if (!term) return null;
  return { term, translit, translation, category };
}
function parseImportText(text) {
  const out = [], seen = {};
  String(text).split(/\r?\n/).forEach(l => {
    const w = parseImportLine(l);
    if (w && !seen[norm(w.term)]) { seen[norm(w.term)] = 1; out.push(w); }
  });
  return out;
}

/* =====================================================================
   A0 (Pre-A1): уровень фонетики и выживательной лексики (раздел 4.3).
   Используется для пользователей с нулевым знанием языка.

   РЕЖИМЫ: "alphabet" — полный алфавит таблицей + 12 упражнений;
           "standard"  — 5-7 тематических групп + 12 упражнений.
   ===================================================================== */
async function startA0Lesson(code) {
  const p = DB.profile;
  const nm = code.match(/^A0\.1\.(\d+)$/);
  if (!nm) return mainMenu();
  const lessonN = +nm[1];
  const total   = DB.profile.a0Total || 12;
  const blk     = getA0Block(lessonN, total);

  // 4.29: незавершённый урок A0 продолжается с сохранённого шага. Вместе с позицией в снимке лежит
  // и СОДЕРЖИМОЕ урока — иначе Gemini выдал бы при возврате другой урок и «продолжить» потеряло бы смысл.
  const saved = Episodes.get('a0', code);
  if (saved && Array.isArray(saved.steps) && saved.steps.length) return runA0Lesson(saved);

  // Первые два phonics-урока — алфавитный режим; остальные — стандартный
  const isAlpha = blk.block === 'phonics';

  Screen.loader(I18N.t('Готовлю урок') + ' A0.' + String(lessonN).padStart(2,'0') + '…');

  let lesson;
  const schemaHint = `{"lesson_title":"заголовок на native_lang","mode":"${isAlpha?'alphabet':'standard'}","items":[{"pattern":"буква/сочетание/тема","ipa_approx":"звук native_lang буквами","native_hint":"подсказка","examples":[{"word":"слово на target_lang","translit":"[транскрипция]","translation":"перевод","emoji":"эмодзи"}]}],"mini_check":[{"prompt_native":"вопрос на native_lang","options":[{"word":"вариант","correct":true}]}]${blk.hasMiniScene?`,"mini_scene":{"situation_native":"ситуация на native_lang — 1 предложение","exchanges":[{"speaker":"other","text_target":"фраза","translit":"[транскр]","text_native":"перевод"},{"speaker":"you","text_native":"что сказать:","task_options":[{"word":"правильная фраза","translit":"[транскр]","correct":true},{"word":"неверный вариант","correct":false},{"word":"неверный вариант","correct":false}]},{"speaker":"other","text_target":"фраза","translit":"[транскр]","text_native":"перевод"},{"speaker":"you","text_target":"фраза","translit":"[транскр]","text_native":"скажите:","task_type":"tap_to_say"}]}`:''}}`;

  const rules = isAlpha
    ? `ПРАВИЛА — АЛФАВИТНЫЙ УРОК (блок: ${blk.focus}):
items: ПОЛНЫЙ алфавит target_lang — ВСЕ буквы и спецсимволы (ü,ö,ä,ß для немецкого и т.п.), по ОДНОЙ букве на item, ОДНО слово-пример на букву. Транскрипция — native_lang буквами.
mini_check: РОВНО 12 упражнений ТОЛЬКО фонетических типов (по 6 каждого):
  Тип 1 (6 шт) — буква → звук: "Как читается буква X?" → 4 варианта транскрипции native_lang буквами.
  Тип 2 (6 шт) — звук → буква: "Какая буква даёт звук [Y]?" → 4 варианта букв.
ЗАПРЕТ: НЕ задавай вопросов на значение слов, перевод или лексику — человек ещё не знает языка, только учится читать буквы.
Все вопросы на native_lang. Транскрипция в квадратных скобках.`
    : `ПРАВИЛА — СТАНДАРТНЫЙ УРОК (блок: ${blk.block}, фокус: ${blk.focus}):
items: 5-7 тематических групп слов/фраз по теме фокуса. Для КАЖДОЙ группы — 3-4 слова или фразы в поле examples. Первое слово каждой группы — самое важное. Транскрипция — native_lang буквами.
mini_check: РОВНО 12 упражнений — узнавание слов, перевод, выбор правильного варианта из 4. Используй слова из items. Каждый вопрос на native_lang.`;

  try {
    lesson = await Gemini.call({
      task: 'a0_lesson', target_lang: p.targetLang, native_lang: p.nativeLang,
      lesson_index: lessonN, total_lessons: total, block: blk.block, focus: blk.focus
    }, schemaHint + '\n' + rules);
    if (!lesson?.items?.length) throw new Error('NO_ITEMS');

    Screen.show(`

      <p class="sub">Проверьте соединение и попробуйте снова.</p>
      <button class="btn btn-primary" id="retry">Повторить</button>
      <button class="btn btn-ghost" id="back">В меню</button>`);
    $('#retry').onclick = () => startA0Lesson(code);
    $('#back').onclick  = mainMenu;
    return;
  }

  // Сборка шагов:
  // Алфавитный режим: 1 шаг-сетка (все буквы сразу) + 12 упражнений
  // Стандартный: карточки по группам + 12 упражнений
  const steps = [];
  if (isAlpha) {
    steps.push({ type:'alpha_grid', items: lesson.items, title: lesson.lesson_title||'' });
  } else {
    (lesson.items||[]).forEach((item,i) => steps.push({ type:'item', item, idx:i, title: lesson.lesson_title||'' }));
  }
  (lesson.mini_check||[]).forEach((check,i) => steps.push({ type:'check', check, idx:i }));
  // Мини-сцена — финальный шаг тематических уроков (не phonics)
  if (blk.hasMiniScene && lesson.mini_scene?.exchanges?.length) {
    steps.push({ type:'scene', scene: lesson.mini_scene });
  }

  return runA0Lesson({ code, lessonN, total, steps, stepIdx:0, correctChecks:0, spent:0 });
}

/* Прохождение урока A0 из состояния S (4.29). S целиком уходит в снимок эпизода перед каждым
   шагом, поэтому выход из приложения на любом шаге — включая финальную мини-сцену — не теряет
   ни позицию, ни содержимое урока. Снимок снимается только по завершении урока. */
function runA0Lesson(S) {
  const { code, lessonN, total } = S;
  const steps = S.steps;
  const totalChecks = steps.filter(s=>s.type==='check').length;
  let mark = Date.now();   // метка текущего захода: паузы между заходами в статистику не идут

  const runStep = () => {
    S.spent = (S.spent||0) + (Date.now() - mark); mark = Date.now();
    if (S.stepIdx >= steps.length) {
      Episodes.drop('a0', code);   // урок пройден — снимок больше не нужен
      return finishA0Lesson(code, lessonN, total, S.correctChecks, totalChecks, Date.now() - S.spent);
    }
    Episodes.put('a0', code, S);   // снимок позиции перед каждым шагом
    const s = steps[S.stepIdx];
    const progress = `${S.stepIdx+1}/${steps.length}`;
    if (s.type === 'alpha_grid') showA0AlphaGrid(s.items, s.title, lessonN, total, progress, () => { S.stepIdx++; runStep(); });
    else if (s.type === 'item')  showA0Item(s.item, s.title, lessonN, total, progress, () => { S.stepIdx++; runStep(); });
    else if (s.type === 'check') showA0Check(s.check, lessonN, total, progress, (ok) => { if(ok) S.correctChecks++; S.stepIdx++; runStep(); });
    else if (s.type === 'scene') showA0MiniScene(s.scene, lessonN, total, progress, () => { S.stepIdx++; runStep(); });
    else { S.stepIdx++; runStep(); }
  };
  runStep();
}

/* Алфавитная сетка — все буквы сразу, каждая тапается для TTS */

    </div>`).join('');

    <div class="eyebrow"><span>A0</span> · <span>урок</span> ${lessonN}/${total} · <span>шаг</span> ${progress}</div>
    <div class="card">

      <p class="note" style="margin:4px 0 8px">👆 Нажмите на букву, чтобы услышать её произношение</p>
      <div class="a0-alpha-grid" id="alphaGrid">${cells}</div>
    </div>
    <p class="note" style="text-align:center">Изучите все буквы — затем переходите к заданиям</p>

function showA0Check(check, lessonN, total, progress, onDone) {
  const opts = shuffle([...(check.options||[])]);
  if (!opts.length) { onDone(true); return; }
  Screen.show(`
    <div class="eyebrow"><span>A0</span> · <span>урок</span> ${lessonN}/${total} · <span>задание</span> ${progress}</div>
    <div class="card" id="a0card">
      <div class="task-text">🎯 ${esc(check.prompt_native||'Выберите правильный вариант:')}</div>
      <div style="height:10px"></div>
      ${opts.map((o,i)=>`<button class="opt" data-correct="${!!o.correct}" data-idx="${i}">${esc(o.word||String(o))}</button>`).join('')}
    </div>`);
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const ok = b.dataset.correct === 'true';
    document.querySelectorAll('.opt').forEach(x => {
      x.disabled = true;
      if (x.dataset.correct === 'true') x.classList.add('correct-opt');
      else if (x === b && !ok)          x.classList.add('wrong-opt');
    });
    const fb = document.createElement('div');
    fb.className = ok ? 'feedback ok' : 'feedback bad';
    fb.innerHTML = ok ? '✅ Верно!' : '❌ Не совсем — правильный ответ выделен зелёным.';
    document.getElementById('a0card').appendChild(fb);
    if (ok && b.textContent) speak(b.textContent.trim(), DB.profile.targetLang);
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary'; btn.style.marginTop = '14px';
    btn.textContent = 'Дальше →'; btn.onclick = () => onDone(ok);
    document.getElementById('a0card').after(btn);
  });
}

/* Мини-сцена A0: ситуативный диалог в конце тематического урока.
   Каждая реплика — отдельный экран (тот же паттерн, что и остальные шаги).
   Типы: passive (показ реплики + TTS), task_options (выбор фразы), tap_to_say (тап для озвучки). */
function showA0MiniScene(scene, lessonN, total, progress, onDone) {
  if (!scene?.exchanges?.length) { onDone(); return; }
  const sit = scene.situation_native || '';
  let ei = 0;

  const header = () =>
    `<div class="eyebrow"><span>A0</span> · <span>урок</span> ${lessonN}/${total} · мини-сцена</div>
     <p class="note" style="margin:0 0 8px;font-size:13px">📍 ${esc(sit)}</p>`;

  const nextBtn = (label, cb) => {
    const b = document.createElement('button');
    b.className = 'btn btn-primary'; b.style.marginTop = '12px';
    b.textContent = label; b.onclick = cb;
    return b;
  };

  const advance = () => { ei++; showEx(); };

  const showEx = () => {
    if (ei >= scene.exchanges.length) return onDone();
    const ex = scene.exchanges[ei];
    const isLast = ei === scene.exchanges.length - 1;
    const nextLabel = isLast ? 'Завершить сцену ✓' : 'Дальше →';

    /* --- Выбор фразы (task_options) --- */
    if (ex.task_options?.length) {
      const opts = shuffle([...ex.task_options]);
      Screen.show(`${header()}
        <div class="card" id="scCard">
          ${ex.text_target ? `<div class="a0-scene-other-line">
            <div class="a0-scene-speaker">🧑‍💼</div>
            <div class="a0-scene-target">${esc(ex.text_target)}</div>
            ${ex.translit ? `<span class="a0-scene-translit">${esc(ex.translit)}</span>` : ''}
            ${ex.text_native ? `<div class="a0-scene-native">${esc(ex.text_native)}</div>` : ''}
            ${sayBtn(ex.text_target)}
          </div>` : ''}
          <div class="task-text">🎯 ${esc(ex.text_native || 'Выберите нужную фразу:')}</div>
          <div style="height:8px"></div>
          ${opts.map(o => `<button class="opt" data-correct="${!!o.correct}"
              data-word="${esc(o.word||'')}" data-translit="${esc(o.translit||'')}">
              ${esc(o.word||'')}
              ${o.translit ? `<span style="display:block;font-size:11px;color:var(--orange)">${esc(o.translit)}</span>` : ''}
            </button>`).join('')}
        </div>`);

      document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const ok = b.dataset.correct === 'true';
        if (ok) speak(b.dataset.word, DB.profile.targetLang);
        document.querySelectorAll('.opt').forEach(x => {
          x.disabled = true;
          if (x.dataset.correct === 'true') x.classList.add('correct-opt');
          else if (x === b && !ok)          x.classList.add('wrong-opt');
        });
        const fb = document.createElement('div');
        fb.className = ok ? 'feedback ok' : 'feedback bad';
        const correctOpt = opts.find(o => o.correct);
        fb.innerHTML = ok
          ? `✅ Верно! ${esc(b.dataset.translit)}`
          : `❌ Правильно: <b>${esc(correctOpt?.word||'')}</b> ${esc(correctOpt?.translit||'')}`;
        document.getElementById('scCard').appendChild(fb);
        document.getElementById('scCard').after(nextBtn(nextLabel, advance));
      });
      return;
    }

    /* --- Тап для озвучки (tap_to_say) --- */
    if (ex.task_type === 'tap_to_say') {
      Screen.show(`${header()}
        <div class="card" id="scCard">
          <div class="task-text">🎯 ${esc(ex.text_native || 'Нажмите, чтобы произнести:')}</div>
          <div class="a0-scene-say-box">
            ${esc(ex.text_target||'')}
            ${ex.translit ? `<div class="a0-scene-translit" style="font-size:14px;margin-top:6px">${esc(ex.translit)}</div>` : ''}
          </div>
          <button class="btn btn-primary" id="tapSay">🔊 Произнести</button>
        </div>`);
      $('#tapSay').onclick = () => {
        speak(ex.text_target||'', DB.profile.targetLang);
        $('#tapSay').textContent = '✅ Сказано!'; $('#tapSay').disabled = true;
        document.getElementById('scCard').after(nextBtn(nextLabel, advance));
      };
      return;
    }

    /* --- Пассивная реплика (чтение + TTS) --- */
    const isYou = ex.speaker === 'you';
    Screen.show(`${header()}
      <div class="card">
        <div class="${isYou ? 'a0-scene-you-line' : 'a0-scene-other-line'}">
          <div class="a0-scene-speaker">${isYou ? '👤 Вы' : '🧑‍💼'}</div>
          <div class="a0-scene-target">${esc(ex.text_target||'')}</div>
          ${ex.translit ? `<span class="a0-scene-translit">${esc(ex.translit)}</span>` : ''}
          ${ex.text_native ? `<div class="a0-scene-native">${esc(ex.text_native)}</div>` : ''}
          ${sayBtn(ex.text_target||'')}
        </div>
      </div>
      <button class="btn btn-primary" id="a0next">${nextLabel}</button>`);
    if (ex.text_target) speak(ex.text_target, DB.profile.targetLang);
    $('#a0next').onclick = advance;
  };

  showEx();
}

function finishA0Lesson(code, lessonN, total, correct, totalChecks, t0) {
  const next       = nextAfterLesson(code);
  const isLastA0   = (next === 'A1.1.01');
  const secElapsed = Math.round((Date.now() - t0) / 1000);
  const accuracy   = totalChecks > 0 ? correct / totalChecks : 1;

  DB.progress.push({ code, date:today(), words:'', next, note:`A0 ${correct}/${totalChecks}` });
  DB.analytics.push({ lesson:code, date:today(), accuracy_first_try:accuracy,
    errors_by_type:{}, hard_words:[], duration_sec:secElapsed, hints_used:0, delta_accuracy:'' });
  DB.nextStage = next;
  if (isLastA0) DB.profile.cefr = 'A1';
  Storage.save(DB);
  toast('Сохранено ✓');

  const pctOk = totalChecks > 0 ? Math.round(correct/totalChecks*100) : 100;
  Screen.show(`
    <div class="eyebrow">Результат: ${totalChecks>0?`${correct}/${totalChecks} верных (${pctOk}%)`:'урок пройден'}</div>
    <h1>${isLastA0 ? '🎉 Основы пройдены! Добро пожаловать на A1!' : 'Урок A0 завершён'}</h1>
    <p class="sub">${isLastA0
      ? 'Вы освоили чтение и базовую лексику. Теперь начинается настоящее обучение — уровень A1!'
      : `Следующий урок: <b style="color:var(--ink)">${esc(next)}</b> &nbsp;·&nbsp; пройдено ${lessonN} из ${total}`}</p>
    <button class="btn btn-primary" id="bNext">${isLastA0 ? 'Начать A1 🚀' : 'Следующий урок →'}</button>
    <button class="btn btn-ghost"  id="bExit">В главное меню</button>`);
  $('#bNext').onclick = () => isLastA0 ? startLesson(next) : startA0Lesson(next);
  $('#bExit').onclick = mainMenu;
}

/* =====================================================================
   УРОК — система 21 дрилла (раздел 5). Один дрилл на экран; нельзя
   перейти дальше, пока текущий не выполнен верно.
   ===================================================================== */
let L = null; // состояние текущего урока
function curCefr(){ const p = parseCode(String(L?.code||'').replace('SUPER_','')); return p ? p.lvl : DB.profile.cefr; }

/* Резервный путь набора порции (раздел 5, 4.26): Ядро исчерпано или не собралось.
   Прежняя схема generate_vocab + ДОБОР: фильтр дубликатов резал порцию до 3–6 слов и добора не было
   (корень бага «3 слова вместо 7», v63). Теперь недобор добирается вторым запросом с исключениями. */
async function legacyVocabPortion(p, lvl, survN, known) {
  const SCHEMA = '{"words":[{"term":"слово на целевом языке","emoji":"один эмодзи-якорь","translit":"[транскрипция родными буквами]","translation":"перевод на родной","part_of_speech":"noun|verb|adj|other","article":"der|die|das или пусто","is_irregular":false,"forms":"паспорт форм: для глаголов 3 формы (+3 лицо у неправильных), для существительных артикль+множественное"}]}';
  const RULES = 'Исключи ВСЕ слова из known_vocab — они уже известны ученику. Включи ровно 2 неправильных глагола с формами (если в целевом языке их нет как класса — 7 обычных слов). Для КАЖДОГО слова заполни поле forms («паспорт»): для глаголов три основные формы + 3-е лицо при смене корня (например "sieht, sah, hat gesehen"), для существительных артикль рода и множественное число (например "der Tisch, die Tische"). Поле part_of_speech: noun/verb/adj/other; для существительных article: der/die/das. Транскрипция — средствами родного языка (native_lang), в квадратных скобках, IPA запрещён.';
  const fresh = arr => (arr||[]).filter(w => w && w.term && w.translation && !DB.vocab.some(v => norm(v.term)===norm(w.term)));
  const ask = async (n, exclude) => {
    const r = await Gemini.call({
      task:'generate_vocab', target_lang:p.targetLang, native_lang:p.nativeLang, cefr:lvl,
      topic:p.interests, count:n,
      split:{ survival: Math.round(n*(SURVIVAL_SHARE[lvl] ?? 0.3)), interests: n - Math.round(n*(SURVIVAL_SHARE[lvl] ?? 0.3)) },
      survival_topics: SURVIVAL_TOPICS, known_vocab: exclude, rules: RULES
    }, SCHEMA + ' — ровно ' + n + ' объектов');
    return r.words || [];
  };
  let words = fresh(await ask(7, known)).slice(0,7);
  if (words.length < 7) {                       // ДОБОР: исключаем известное + только что предложенное
    const exclude = [...new Set([...known, ...words.map(w=>w.term)])];
    try {
      const more = fresh(await ask(7 - words.length + 3, exclude))
        .filter(w => !words.some(x => norm(x.term)===norm(w.term)));
      words = [...words, ...more].slice(0,7);
    } catch(e){}                                // добор не удался — идём с тем, что есть
  }
  if (words.length < 3) throw new Error('FEW_WORDS');
  return words;
}

async function startLesson(code) {
  // --- восстановление незавершённого урока из снимка (v45, слоты раздельные с 4.29) ---
  const cached = LessonCache.lesson(code);
  if (cached && cached.code === code && cached.i > 0) {
    L = cached;
    // если chunk2 уже был готов — восстанавливаем данные; иначе перезапускаем фоновую загрузку
    if (L.chunk2.state === 'ready') {
      // данные уже в L.constructs/L.grammar/L.phrases — renderStep сам разберётся
    } else {
      L.chunk2 = { state:'idle', promise:null, err:null };
      fetchLessonChunk2();
    }
    renderStep();
    return;
  }
  LessonCache.clearLesson(code);   // 4.29: этот урок начинается заново — прочие эпизоды не трогаем
  const p = DB.profile, lvl = parseCode(code).lvl;
  Screen.loader(I18N.t('Готовлю урок') + ' ' + code + '…');
  // --- баланс лексики: бытовое + интересы (раздел 5.0) ---
  const survN = Math.round(7 * (SURVIVAL_SHARE[lvl] ?? 0.3));
  const known = DB.vocab.map(w => w.term).slice(-300);
  let words;
  // ИНТЕНСИВ: если есть импортированные, ещё не показанные слова — урок учит ИХ (а не генерирует посторонние)
  const importedNew = DB.vocab.filter(w => w.source==='import' && (w.status==='новое') && w.seen!==true);
  if (DB.intensive && importedNew.length >= 3) {
    words = importedNew.slice(0, 7);
  } else {
  // 4.26: порцию собирает ПРИЛОЖЕНИЕ из Ядра языка — без запроса к Gemini (раздел 5).
  // Выбор слов = методика, методика принадлежит приложению. Урок стартует мгновенно.
  words = Core.pickPortion(lvl);
  if (!words) {                       // Ядро исчерпано или не построено → резервный путь
    try { words = await legacyVocabPortion(p, lvl, survN, known); }
    catch(e) {
      if (String(e.message).startsWith('KEY:')) return keyWizard(true);
      return lessonLoadError(()=>startLesson(code), e);
    }
  }
  }

  // --- Recap: до 7 задач повторения (спека 4.27: срочный слой → подошедшие по дате) ---
  const recapPool = [];
  // пункт 3: импортированные слова, ещё не показанные, не идут в повторение, пока не «увидены»
  const seenOk = w => !((w.source==='import' || w.priority) && w.seen!==true && (w.status==='новое'||!w.status));
  // QUEUE-38: пассивно встреченные слова (тап в сцене / глоссарий квеста) — не повторяем, лишь выученное.
  const passiveEncounter = w => w.seen_in_context === true
    || w.status === 'встречено в контексте' || w.status === 'встреченное';
  // 1) СРОЧНЫЙ слой: трудные + приоритетные/импортированные — всегда первыми, минуя даты
  const urgent = DB.vocab.filter(w => DB.reviewQueue.includes(w.term) && seenOk(w));
  // 2) СПОКОЙНЫЙ слой: подошедшие по графику 1/3/7/30, самые просроченные первыми (расписание заменяет прежний добор «последние 10»)
  const due = DB.vocab.filter(w => seenOk(w) && !passiveEncounter(w) && !DB.reviewQueue.includes(w.term) && SRS.due(w))
                      .sort((a,b) => SRS.overdue(b) - SRS.overdue(a));
  [...urgent, ...due].forEach(w => { if (!recapPool.some(x=>x.term===w.term)) recapPool.push(w); });
  const recapItems = DB.vocab.length >= 4 ? recapPool.slice(0, 7) : [];

  // пункт 7: часто нарушаемое правило — поднять в начале урока для перечитывания
  const adaptiveRules = (DB.rules||[]).filter(r => (r.errors||0) >= 2)
                                     .sort((a,b)=>(b.errors||0)-(a.errors||0)).slice(0,2);

  // --- сборка шагов: узнавание/контекст готовы сразу; построение фраз — порция 2 (фон) ---
  const steps = [];
  adaptiveRules.forEach(r => steps.push({ t:'ruleRecap', rule: r }));
  // пункт 12: повторение слов прошлого урока — в контексте со скелетами (предложения из порции 2)
  recapItems.forEach((w,i) => steps.push({ t:'reviewCtx', phase:'Повторение', n:`R${i+1}/7`, w, ri:i }));
  steps.push({ t:'present' });
  steps.push({ t:'grammar' });   // отрисуется, если правило догрузилось; иначе пропустится
  for (let i=0;i<5;i++) steps.push({ t:'recog', phase:'Узнавание', n:'<span>Задание</span> '+(i+1)+'/21', w: words[i % words.length], pool:'lesson' });
  for (let i=0;i<6;i++) steps.push({ t:'context', phase:'Слово в контексте', n:'<span>Задание</span> '+(i+6)+'/21', ci:i });
  if (((parseCode(code)||{}).n || 1) % 2 === 1) steps.push({ t:'phrases' });   // повседневные выражения — через урок (4.14)
  for (let i=0;i<9;i++) steps.push({ t:'construct', phase:'Сборка фразы', n:'<span>Задание</span> '+(i+12)+'/21', ci:i });
  steps.push({ t:'quest', n:'Задание 21/21 · Final Challenge' });

  L = { code, words, steps, i:0, grammar:null, constructs:null, reviewDrills:null,
        reviewWords: recapItems.map(w=>({ term:w.term, translation:w.translation||'' })),
        chunk2:{state:'idle',promise:null,err:null},
        lvl, known,
        errors:{ recognition:0, writing:0, construction:0, quest:0 },
        ft:{ ok:0, total:0 }, hints:0, t0: Date.now(),
        wordErr:{}, firstTryDone:{} };
  fetchLessonChunk2();   // порция 2 — в фоне, пока ученик делает повторение/презентацию/узнавание
  renderStep();
}

// Порция 2: задания на построение фраз + правило урока. Грузится в фоне, повторяется локально при сбое.
/* QUEUE-66: вторая линия обороны по уровню для заданий урока.
   До этого запрет уровня жил ТОЛЬКО текстом промпта (taskLevelBlock) — а модель его
   регулярно игнорирует (QUEUE-11/16). У квеста вторая линия есть с 4.30: код ищет маркеры
   в готовом эталоне и отдаёт находку валидатору, тот переписывает. У 21 задания урока
   такой линии не было вовсе: что пришло, то и показывали.
   Устройство то же, что в validateQuestScene: сначала ищем кодом (бесплатно), и ТОЛЬКО
   если нашли — один запрос на починку всех задетых заданий сразу. Чистый урок не платит
   ни запросом, ни задержкой. Сбой запроса не критичен: остаются исходные задания —
   лучше задание выше уровня, чем урок, который не открылся. */
/* 4.41 (QUEUE-105г): условие обязано быть на родном языке целиком. «Томас готовит в Alltag» —
   кусок ответа выдан прямо в задании. Это код проверить МОЖЕТ: сравнение строк, а не разбор
   языка — берём знаменательные слова эталона и ищем их в условии. */
function promptLeak(it) {
  const target = tokenize(String(it && it.expected_target || ''));
  const prompt = new Set(tokenize(String(it && it.prompt_native || '')));
  return target.filter(w => w.length >= 4 && prompt.has(w));
}
function dropLeaky(items) {
  const out = [], bad = [];
  (items||[]).forEach(it => { (promptLeak(it).length ? bad : out).push(it); });
  if (bad.length) console.log('[AILEX] заданий с утечкой целевых слов в условие:', bad.length);
  return out.length ? out : items;      // все с утечкой — лучше показать, чем оставить урок пустым
}

async function validateDrillLevel(items, lvl) {
  if (!Array.isArray(items) || !items.length) return items;
  let flagged = [];
  try {
    flagged = items
      .map((it, i) => ({ i, hits: GrammarCore.hitMarkers(String(it.expected_target||''), lvl) }))
      .filter(x => x.hits.length);
  } catch(_) { return items; }
  if (!flagged.length) return items;                    // чисто — запроса нет
  const p = DB.profile;
  try {
    const v = await Gemini.call({
      task:'validate_drill_level', target_lang:p.targetLang, native_lang:p.nativeLang, cefr:lvl,
      banned_markers: GrammarCore.bannedMarkers(lvl),
      items: flagged.map(x => ({ index:x.i, prompt_native:items[x.i].prompt_native,
        expected_target:items[x.i].expected_target, hit_markers:x.hits })),
      rules:'Каждое задание в items содержит грамматику, которую ученик ещё НЕ проходил: hit_markers — найденные кодом слова и формы непройденных тем. '
        + 'ПЕРЕПИШИ каждое задание так, чтобы того же смысла можно было достичь БЕЗ этих слов и форм. Меняй конструкцию, а не подставляй синоним той же непройденной темы: '
        + '«Sie wird hier sein» (будущее время) → «Sie ist hier» (настоящее). Если смысл без непройденной темы не выражается — замени смысл задания на близкий и посильный. '
        + 'prompt_native и expected_target обязаны остаться СТРОГО согласованными: каждое смысловое слово задания есть в эталоне и наоборот. prompt_native — только на native_lang, без единого слова целевого языка. '
        + 'expected_target — живая фраза носителя уровня CEFR '+lvl+', без битых слов и калек. Верни index каждого задания без изменений, чтобы приложение поставило его на место.'
    },
    '{"items":[{"index":0,"prompt_native":"исправленное условие на родном","expected_target":"исправленный эталон на целевом"}]}');
    (v && Array.isArray(v.items) ? v.items : []).forEach(f => {
      const i = Number(f.index);
      if (!items[i] || !f.expected_target) return;
      items[i].expected_target = f.expected_target;
      if (f.prompt_native) items[i].prompt_native = f.prompt_native;
      if (Array.isArray(f.glossary) && f.glossary.length) items[i].glossary = f.glossary;
    });
  } catch(_) {}                                          // сбой — оставляем как было, урок не рушим
  return items;
}

function fetchLessonChunk2() {
  if (!L) return;
  L.chunk2.state = 'loading'; L.chunk2.err = null;
  const p = DB.profile, lvl = L.lvl, words = L.words, known = L.known;
  L.chunk2.promise = (async () => {
    const r2 = await Gemini.call({
      task:'generate_construction_drills', target_lang:p.targetLang, native_lang:p.nativeLang, cefr:lvl,
      topic:p.interests, lesson_words: words.map(w=>w.term), known_vocab: known.slice(-60), known_rules: (DB.rules||[]).map(r=>r.title).slice(-40), count:9,
      rules:'Задания на активное построение фраз родной→целевой (production). Запрещён обратный перевод. Каждое задание использует хотя бы одно слово урока. ' + 'ЭТАЛОН — ЖИВАЯ ГРАМОТНАЯ ФРАЗА (критично, 4.41): expected_target обязан быть предложением, которое носитель признает правильным. ' + 'Глагол ставится в нужное лицо и число («Thomas schickt», НЕ «Thomas schicken»), существительное получает свой артикль там, где язык его требует («das Magazin», НЕ «Magazin»). ' + 'Словарная форма глагола в эталоне ЗАПРЕЩЕНА, если фраза требует спряжения. Неграмотный эталон недопустим ни при каких условиях: приложение показывает его ученику как образец, и ученик запомнит ошибку как правило. ' + 'НАБОР СЛОВ-ОПОР приложение строит САМО, разбирая expected_target на слова, — поэтому слова окажутся у ученика ровно в тех формах, в каких стоят в эталоне. Это упражнение на ПОРЯДОК СЛОВ и структуру, а не на образование форм. ' + 'ФОРМУЛИРОВКУ ЗАДАНИЯ ЗАДАЁТ ПРИЛОЖЕНИЕ: поле instruction не используется, не пиши в него «переведите» — перевод уже дан в prompt_native, ученик только собирает. ' + lessonThemeBlock() + taskLevelBlock(lvl) + 'СИММЕТРИЯ (критично): prompt_native и expected_target СТРОГО соответствуют друг другу — каждое смысловое слово задания ОБЯЗАНО присутствовать в эталоне и наоборот. Если в задании есть уточнение (на поезд, быстро, металл, очень) — оно ОБЯЗАНО быть в эталоне. Запрещено давать задание с деталью которой нет в эталоне. ПЕРЕВОД: на A1–A2 prompt_native переводи корректно по-русски сохраняя все смысловые слова. Служебные глаголы которые в русском опускаются (sein) — опускай. Порядок слов — русский. Если конструкция не переводится прямо — добавь пояснение в скобках. instruction — короткая внятная инструкция что сделать. ЧИСТОЕ УСЛОВИЕ (критично, 4.28): prompt_native — СТРОГО на native_lang, БЕЗ единого слова target_lang. ЗАПРЕЩЕНО оставлять в prompt_native непереведённые целевые слова (например «нужен рюкзак для Weltreise» — неверно; «нужен рюкзак для кругосветного путешествия» — верно) и ЗАПРЕЩЕНО помещать в prompt_native саму целевую фразу целиком. Целевые слова живут ТОЛЬКО в expected_target и glossary; условие — только перевод смысла на родной. КВОТА НОВОЙ ЛЕКСИКИ (критично, 4.28): expected_target строй из УЖЕ ИЗВЕСТНЫХ слов (known_vocab/lesson_words); НЕ БОЛЕЕ 1 нового слова (которого нет в known_vocab) на фразу. Если нового слова нет — тем лучше. Новое слово ОБЯЗАНО быть в glossary с переводом. GLOSSARY — ВСЕ СЛОВА ЭТАЛОНА (критично, 4.28): в glossary помести КАЖДОЕ слово из expected_target — не только ключевые и не только новые, но и служебные (артикли der/die/das, предлоги für/bei/mit, союзы und/oder), каждое: слово на целевом + транскрипция родными буквами + перевод. Приложение перемешивает эти слова в набор-опору, и тап по любому слову набора обязан находить перевод мгновенно. Также верни everyday_phrases — 3 разговорные фразы-клише по уровню CEFR, каждая: phrase + translit (родными буквами) + translation + when (когда говорят, на родном) + reply (ответная реплика если фраза предполагает ответ: {phrase, translit, translation}).'
    },
    '{"items":[{"instruction":"короткая инструкция что сделать на родном","prompt_native":"что именно сказать/перевести (на родном)","expected_target":"эталонная фраза на целевом, точно соответствующая prompt_native","expected_translit":"[транскрипция всей эталонной фразы родными буквами]","focus_word":"слово урока","glossary":[{"term":"новое слово из эталона","translit":"[транскрипция]","translation":"перевод"}]}] — ровно 9 объектов,"everyday_phrases":[{"phrase":"фраза-клише на целевом","translit":"[транскрипция]","translation":"перевод","when":"когда употребляется (на родном)","reply":{"phrase":"ответная реплика на целевом если применимо, иначе null","translit":"[транскрипция ответа]","translation":"перевод ответа"}}] — 3 штуки}');
    let constructs = (r2.items||[]).filter(i=>i.prompt_native && i.expected_target).slice(0,9);
    if (constructs.length < 5) throw new Error('FEW_DRILLS');
    constructs = dropLeaky(constructs);                       // 4.41: условие без целевых слов
    constructs = await validateDrillLevel(constructs, lvl);   // QUEUE-66: вторая линия обороны по уровню
    L.constructs = constructs;
    // QUEUE-07: пул фраз = новые от Gemini + старые из словаря (ротация)
    const newPhrases = (r2.everyday_phrases||[]).filter(f=>f && f.phrase).slice(0,3);
    const savedPhrases = (DB.vocab||[]).filter(v=>v.source==='phrase' && v.term)
      .sort(()=>Math.random()-0.5).slice(0, Math.max(0, 3-newPhrases.length))
      .map(v=>({phrase:v.term, translit:v.translit||'', translation:v.translation||'', when:v.note||''}));
    L.phrases = [...newPhrases, ...savedPhrases].slice(0,3);   // всегда 3 фразы
    // пункт 12: короткие предложения для слов ПОВТОРЕНИЯ — чтобы Recap шёл в контексте со скелетами
    if (L.reviewWords && L.reviewWords.length) {
      try {
        const rv = await Gemini.call({
          task:'generate_review_sentences', target_lang:p.targetLang, native_lang:p.nativeLang, cefr:lvl,
          review_words: L.reviewWords.map(w=>({ word:w.term, meaning:w.translation||'' })), count: L.reviewWords.length,
          rules:'Для КАЖДОГО объекта из review_words верни короткое естественное предложение на целевом языке, СОДЕРЖАЩЕЕ слово word в ЗНАЧЕНИИ meaning. КРИТИЧНО (QUEUE-40): у слова может быть несколько значений — используй ИМЕННО meaning, и весь смысл предложения обязан соответствовать этому значению (если meaning = «патрон (токарный)» — предложение про станок/деталь, НЕ про корм для собаки; если meaning = «корм» — про животное). Предложение строго по уровню CEFR. word — то слово из review_words, к которому относится предложение.'
        },
        '{"items":[{"word":"слово из review_words","sentence":"короткое предложение на целевом, содержащее это слово","translation":"перевод предложения на родной"}]}');
        L.reviewDrills = (rv.items||[]).filter(i=>i.word && i.sentence);
      } catch(_) { L.reviewDrills = []; }
    }
    try {
      const knownRules = (DB.rules||[]).map(r=>r.title).slice(-40);
      const coveredCats = [...new Set((DB.rules||[]).flatMap(r=>r.categories||[]))];
      // 4.30: тему выбирает ПРИЛОЖЕНИЕ по карте грамматики, модель её только раскрывает.
      // Карта не собралась (сбой генерации / старый профиль) — прежний путь, выбор за моделью.
      const theme = GrammarCore.next(lvl);
      if (theme && theme.title) L.theme = theme.title;   // 4.41: тема доступна заданиям (QUEUE-106)
      const themeReq = theme
        ? { theme_order: theme.order, theme_title: theme.title, theme_gist: theme.gist }
        : {};
      const themeRule = theme
        ? 'ТЕМА ЗАДАНА ПРИЛОЖЕНИЕМ (критично): раскрой ИМЕННО тему theme_title («'+theme.title+'», суть: '+(theme.gist||'')+'). Выбирать другую тему ЗАПРЕЩЕНО, даже если она кажется уместнее по словам урока. has_new_rule=true. title — понятный человеку заголовок этой темы на native_lang. '
        : 'Верни ОДНО уместное по уровню CEFR правило которого ещё нет в known_rules. На A1–A2 СНАЧАЛА закрывай фундаментальные темы которых нет в covered_categories: порядок слов, артикли/род, спряжение и времена, числа, даты, отрицание, вопросы, базовые предлоги — выбери самую базовую из НЕпройденных. Если нового нет — has_new_rule=false. ';
      const rg = await Gemini.call(Object.assign({
        task:'grammar_rule', target_lang:p.targetLang, native_lang:p.nativeLang, cefr:lvl,
        lesson_words: words.map(w=>w.term), known_rules: knownRules, covered_categories: coveredCats,
        rules: themeRule + ' ЯЗЫК ОБЪЯСНЕНИЯ: summary — без лингвистических терминов, объясняй через примеры как живому человеку (не "наречная группа" а "можно добавить уточнение — как быстро, где — это всё равно считается одной частью"). ГЛУБИНА ПО УРОВНЮ: summary держи коротким на всех уровнях — 1–2 фразы на A1–A2, чуть больше на B1+. ИСКЛЮЧЕНИЕ НАЗЫВАЙ ПРЯМО (критично, 4.40): если форма из таблицы не подчиняется общему правилу — особая форма, совпадение форм разных лиц, чередование основы — напиши это одной фразой в поле note. Молча обойти особенность ЗАПРЕЩЕНО: ученик встретит форму в задании и не поймёт, откуда она. Краткость относится к объёму объяснения, а не к полноте: коротко, но без умолчаний. ПОЛНОТА: правило показывает КОНТРАСТ — как форма выглядит в словаре/инфинитиве И как меняется в предложении (пример А → пример Б). ПРИМЕРЫ в examples: на A1–A2 только простые случаи без усложнений — никаких наречий-расширителей в W-Fragen, никаких отделяемых приставок в примерах спряжения. ПАРАДИГМА ЦЕЛИКОМ (критично, QUEUE-64): в table — ВЕСЬ набор форм темы, а не его часть. Если тема про артикль или склонение — в таблице все роды и все падежи уровня; если про спряжение — все лица. '
        + 'Обрезать таблицу до одного рода, одного лица или одного падежа ЗАПРЕЩЕНО: формы понятны только в сопоставлении, а урезанная таблица учит ложному правилу (в немецком ein одинаков для мужского и среднего рода — таблица только с мужским дезинформирует). '
        + 'ПОДПИСЬ ФОРМЫ (критично, 4.40): у каждой строки таблицы заполни label — чьё это лицо, число, род или падеж, на native_lang («я», «он, она, оно», «Dativ — кому/чему»). Если форма одинакова для нескольких лиц — объедини их в одной строке одной подписью («я / он, она, оно»), чтобы совпадение было видно, а не выводилось сравнением строк. Порядок строк такой, чтобы совпадения и различия форм читались с одного взгляда. Показ парадигмы целиком НЕ означает, что всё это потребуют в задании: задание остаётся в пределах пройденного, таблица — опора для узнавания. '
        + 'ТЕРМИНЫ С РАСШИФРОВКОЙ (QUEUE-64): грамматический термин, реально принятый для ЦЕЛЕВОГО языка (нем. Dativ, Akkusativ, Nominativ; рус. творительный падеж), в таблице УМЕСТЕН и полезен — но НИКОГДА не голым. Всегда с пояснением на native_lang рядом: «Dativ — кому/чему», «Akkusativ — вижу кого/что». '
        + 'Если в целевом языке такой категории нет (в английском нет падежей) — термин не выдумывай. В summary термины по-прежнему не нужны: там объясняем живым языком. '
        + 'Пояснения и название — на native_lang. Транскрипция — родными буквами.'
      }, themeReq),
      '{"has_new_rule":true,"title":"короткое название на родном","summary":"суть в 1-2 фразы на родном","categories":["одна или несколько из: Артикли, Существительные, Глаголы, Времена, Падежи, Предлоги, Порядок слов, Местоимения, Прочее"],"note":"особенность или исключение одной фразой на родном, пусто если нет","table":[{"label":"подпись формы на родном: я / он, она, оно / Dativ — кому/чему","form":"форма на целевом","translit":"[транскрипция родными буквами]","translation":"перевод"}],"examples":[{"target":"пример на целевом","translit":"[транскрипция]","translation":"перевод"}],"cefr":"уровень"}');
      if (rg && rg.has_new_rule && rg.title && !(DB.rules||[]).some(r=>norm(r.title)===norm(rg.title))) {
        if (theme) rg._theme = theme.order;      // 4.30: отметим тему пройденной, когда правило реально показано
        L.grammar = rg;
      }
    } catch(_) { /* правило необязательно */ }
    L.chunk2.state = 'ready';
  })().catch(e => { L.chunk2.state = 'error'; L.chunk2.err = e; throw e; });
  return L.chunk2.promise;
}

// Гарантирует готовность порции 2 к моменту, когда она нужна (построение фраз / правило).
async function ensureChunk2() {
  if (!L) return false;
  if (L.chunk2.state === 'ready') return true;
  if (L.chunk2.state === 'idle') fetchLessonChunk2();
  Screen.loader('Догружаю урок…');
  try { await L.chunk2.promise; return true; }
  catch(e) {
    if (String(e.message||'').startsWith('KEY:')) { keyWizard(true); return false; }
    lessonLoadError(()=>{ fetchLessonChunk2(); ensureChunk2().then(ok=>{ if(ok) renderStep(); }); }, e);
    return false;
  }
}

function lessonLoadError(retryFn, e) {
  Screen.show(`<h1>Не получилось подготовить урок</h1>
    <p class="sub">Проверьте интернет и попробуйте снова. Обучение не блокируется из-за модели — данные не пострадали.</p>
    <p class="note" style="opacity:.7">Причина: ${esc(String(e?.message||'неизвестно'))}</p>
    <button class="btn btn-primary" id="r">Повторить</button>
    <button class="btn btn-ghost" id="m">В меню</button>`);
  $('#r').onclick = retryFn; $('#m').onclick = mainMenu;
